<script>
// ══════════════════════════════════════════════════════════════
// 입사 안내
// ══════════════════════════════════════════════════════════════
function fillOnboardingDefaults(candId) {
  const select = document.getElementById('ob-cand');
  const id = Number(candId || select?.value);
  // 다른 지원자로 바꾸면 이전 지원자용으로 고른 첨부파일이 섞이지 않도록 비운다.
  if(select && String(id) !== String(select.dataset.attachFor || '')) { clearObAttachments_(); select.dataset.attachFor = String(id || ''); }
  const c = candidates.find(x=>Number(x.id)===id);
  if(!c) { renderOnboardingPositionFinalists(); renderOnboarding(); updateObPreview(); return; }
  // 입사 처리(입사 단계)로 넘어간 지원자는 선택 목록(최종합격만)에 없어서 값이 지정되지 않는다 — 옵션을 보충한다.
  if(select && ![...select.options].some(o => o.value === String(c.id))) select.add(new Option(`${c.name} (${c.pos || ''})`, c.id));
  if(select) select.value = String(c.id);
  const pos = positions.find(p=>Number(p.id)===Number(c.posId));
  const existing = onboardings.find(o=>Number(o.candId)===Number(c.id)) || {};
  // 처우·채용검진 안내에서 정한 직급·역량등급을 입사 안내 기본값으로 이어 쓴다(입사일은 지원자 회신으로 정한다).
  const offer = offers.find(o=>Number(o.candId)===Number(c.id)) || {};
  // 현장 포지션은 직종(건축 등) 대신 현장명을 배치 부서로 써서 그 현장의 소장을 찾는다.
  const siteName = pos && pos.location === '현장' ? String(pos.site || '').trim() : '';
  const dept = siteName || (pos&&pos.dept) || c.dept || existing.dept || '';
  const loc = (pos&&pos.loc) || siteName || c.loc || existing.loc || '';
  const etype = (pos&&pos.etype) || c.etype || existing.etype || '정규직';
  const leads = getDeptLeadRecipients(dept);
  const leadEmails = groupMailRecipients([existing.deptLead, ...leads.map(x=>x.email)]);
  const set = (id,v) => { const el=document.getElementById(id); if(el) el.value=v||''; };
  set('ob-position',(pos&&pos.title) || c.pos || '');
  set('ob-dept',dept);
  set('ob-dept-lead',leadEmails);
  setObDeptLeadHint_(dept, leads.length ? leads : (existing.deptLead ? [{ email:existing.deptLead }] : []));
  set('ob-loc',loc);
  set('ob-etype',etype);
  set('ob-date',existing.joinDate || c.joinDate || '');
  set('ob-pre-deadline',existing.preDeadline || '');
  set('ob-rank',existing.rank || offer.rank || '');
  set('ob-name-en',existing.nameEn || '');
  set('ob-cl',existing.cl || offer.cl || '');
  set('ob-phone',existing.phone || c.phone || c.mobile || '');
  set('ob-jointime',existing.joinTime || '09:00');
  set('ob-reportloc',existing.reportLocation || '린스퀘어 14F');
  renderOnboardingPositionFinalists(c.posId, c.id);
  renderOnboarding();
  updateObPreview();
  // 이미 등록된 사람이면 버튼이 '수정 저장'이 된다.
  updateObSendButton_();
  updateObJoinDateHint_();
}

// 왼쪽 입사 예정자 표에서 행을 누르면 오른쪽 입사 안내 등록 폼에 해당 지원자를 채운다.
function selectOnboardingRow(candId) {
  fillOnboardingDefaults(candId);
  const form = document.getElementById('ob-cand')?.closest('.card');
  if(form) {
    const rect = form.getBoundingClientRect();
    // 좁은 화면(폼이 표 아래로 내려간 배치)에서는 폼이 보이도록 스크롤한다.
    if(rect.top > window.innerHeight * 0.6 || rect.bottom < 0) form.scrollIntoView({ behavior:'smooth', block:'start' });
  }
  const target = document.getElementById('ob-date');
  if(target && !target.value) target.focus({ preventScroll:true });
}

// 지원자 입사안내를 이미 보냈으면 발송 버튼을 '재발송'으로 바꾸고 발송 완료를 함께 보여 준다.
// 파란(주요) 버튼은 지금 해야 할 다음 작업 하나에만 쓴다: 처음엔 [등록], 등록 후엔 [지원자 입사안내 발송],
// 발송까지 끝나면 파란 버튼 없음(수정 저장·재발송은 흰색).
function updateObSendButton_() {
  const id = Number(document.getElementById('ob-cand')?.value);
  const ob = onboardings.find(o => Number(o.candId) === id);
  const saveBtn = document.getElementById('ob-save-btn');
  if(saveBtn) { saveBtn.textContent = ob ? '수정 저장' : '등록'; saveBtn.className = ob ? 'btn' : 'btn btn-primary'; }
  // 내부 직원 공유도 다른 버튼과 같은 테두리 버튼으로 두고, 공유했으면 '재공유'로 바꾼다.
  const internalBtn = document.getElementById('ob-internal-btn');
  if(internalBtn) internalBtn.textContent = ob && ob.deptNotified ? '내부 직원 재공유' : '내부 직원 공유';
  const btn = document.getElementById('ob-send-btn');
  if(!btn) return;
  const sent = !!(ob && ob.notified);
  btn.textContent = sent ? '지원자 입사안내 재발송' : '지원자 입사안내 발송';
  btn.className = sent ? 'btn' : 'btn btn-primary';
  const status = document.getElementById('ob-send-status');
  if(status) {
    status.textContent = sent ? '✓ 지원자 입사안내 발송 완료' + (ob.notifiedAt ? ' · ' + fmtItv(ob.notifiedAt) : '') : '';
    status.style.display = sent ? '' : 'none';
  }
}

function refreshOnboardingDeptRecipients() {
  const dept = document.getElementById('ob-dept')?.value || '';
  const leads = getDeptLeadRecipients(dept);
  const leadInput = document.getElementById('ob-dept-lead');
  if(leadInput) leadInput.value = groupMailRecipients(leads.map(x=>x.email));
  updateObPreview();
  setObDeptLeadHint_(dept, leads);
}

// 부서장 이메일 자동 입력 결과를 입력칸 아래에 보여 준다. 못 찾아도 직접 입력하면 되므로 오류 알림은 띄우지 않는다.
// 담당자가 부서장 이메일 칸을 직접 고치면 자동 선택 안내 대신 '직접 입력'을 보여 준다.
function onObDeptLeadInput_() {
  const hint = document.getElementById('ob-dept-lead-hint');
  const input = document.getElementById('ob-dept-lead');
  if(!hint || !input) return;
  const dept = document.getElementById('ob-dept')?.value || '';
  const autoLeads = getDeptLeadRecipients(dept);
  const auto = autoLeads.map(x => String(x.email).toLowerCase()).sort().join(';');
  const typed = String(input.value || '').split(/[;,\n]+/).map(x => x.trim().toLowerCase()).filter(x => x.includes('@')).sort().join(';');
  if(typed && typed !== auto) {
    hint.textContent = '직접 입력한 이메일로 발송합니다. 자동으로 찾은 부서장은 포함하지 않습니다.';
    hint.style.color = 'var(--t3)';
  } else if(!typed) {
    hint.textContent = auto ? '비워 두면 자동으로 찾은 부서장에게 발송합니다.' : '';
    hint.style.color = 'var(--t3)';
  } else {
    setObDeptLeadHint_(dept, autoLeads, false);
  }
}

function setObDeptLeadHint_(dept, leads, loading = (typeof lazyInterviewerLoadPromise_ !== 'undefined' && !!lazyInterviewerLoadPromise_)) {
  const hint = document.getElementById('ob-dept-lead-hint');
  if(!hint) return;
  if(!String(dept || '').trim()) { hint.textContent = ''; return; }
  if(leads && leads.length) {
    hint.textContent = `자동 입력: ${leads.map(x => x.name || x.email).join(', ')}`;
    hint.style.color = 'var(--t3)';
  } else if(loading) {
    hint.textContent = '직원 DB를 불러오는 중입니다. 잠시 후 자동으로 채워집니다.';
    hint.style.color = 'var(--t3)';
  } else {
    hint.textContent = `직원 DB에서 ${dept}의 팀장/소장을 찾지 못했습니다. 이메일을 직접 입력해 주세요.`;
    hint.style.color = 'var(--amber)';
  }
}

function renderOnboardingPositionFinalists(positionId, selectedId) {
  const wrap = document.getElementById('ob-position-finalists');
  if(!wrap) return;
  const finals = candidates.filter(c=>Number(c.posId)===Number(positionId)&&c.stage===5);
  if(!finals.length) { wrap.innerHTML=''; return; }
  wrap.innerHTML=`<div class="ob-finalists"><span class="ob-finalists-label">동일 포지션 합격자 ${finals.length}명</span>${finals.map(c=>{
    const registered=onboardings.some(o=>Number(o.candId)===Number(c.id));
    return `<button type="button" class="ob-finalist ${registered?'registered':''} ${Number(c.id)===Number(selectedId)?'active':''}" data-action="call" data-call="fillOnboardingDefaults(${c.id})">${esc(c.name)}${registered?' · 등록':''}</button>`;
  }).join('')}</div>`;
}

function getOnboardingDraft() {
  const cid=Number(document.getElementById('ob-cand')?.value);
  const c=candidates.find(x=>Number(x.id)===cid);
  if(!c) return { cand:null, ob:{} };
  return { cand:c, ob:{
    candId:c.id,candName:c.name,pos:document.getElementById('ob-position')?.value||c.pos||'',
    joinDate:document.getElementById('ob-date')?.value||'',dept:document.getElementById('ob-dept')?.value||'',
    deptLead:document.getElementById('ob-dept-lead')?.value||'',rank:document.getElementById('ob-rank')?.value||'',
    loc:document.getElementById('ob-loc')?.value||'',etype:document.getElementById('ob-etype')?.value||'',
    joinTime:document.getElementById('ob-jointime')?.value||'',reportLocation:document.getElementById('ob-reportloc')?.value||''
  }};
}

function openOnboardingFromPosition(positionId) {
  const pos = positions.find(p=>Number(p.id)===Number(positionId));
  if(!pos) return;
  const finals = candidates.filter(c=>Number(c.posId)===Number(positionId)&&c.stage===5);
  if(!finals.length) { toast('이 포지션에는 입사 안내를 진행할 최종합격자가 없습니다.', 'tinfo'); return; }
  const candidate = finals.find(c=>!onboardings.some(o=>Number(o.candId)===Number(c.id))) || finals[0];
  nav('onboarding');
  populateSel('ob-cand');
  fillOnboardingDefaults(candidate.id);
  document.getElementById('sect-onboarding')?.scrollIntoView({behavior:'smooth',block:'start'});
}

function updateObPreview(){
  const {cand,ob}=getOnboardingDraft();
  const applicant=document.getElementById('ob-preview-outlook');
  const internal=document.getElementById('ob-preview-internal');
  const internalTo=document.getElementById('ob-preview-internal-to');
  if(applicant) applicant.textContent=cand?buildOfferEmail(ob,cand):'최종 합격자를 선택하면 지원자용 미리보기가 표시됩니다.';
  if(internal) internal.textContent=cand?buildInternalOnboardEmail(ob,cand):'최종 합격자를 선택하면 내부 공유용 미리보기가 표시됩니다.';
  if(internalTo) {
    const recipients=cand?getOnboardInternalRecipients(cand,ob):null;
    internalTo.textContent=recipients?.recipientNames?.length?recipients.recipientNames.join(', '):'부서장/소장 + 고정 수신팀 + 피플팀';
    const summary=document.getElementById('ob-recipient-summary');
    if(summary) summary.innerHTML=recipients
      ? `<strong>해당부서 팀장/소장</strong> ${recipients.leads.length?esc(recipients.leads.map(x=>x.name).join(', ')):'미매핑'}<br><strong>관련부서 고정 수신자</strong> ${recipients.teams.length?esc(recipients.teams.map(x=>x.name||x.email).join(', ')):'미설정'}<br><strong>피플팀 담당자</strong> ${esc(recipients.hrEmail||'미설정')}`
      : '합격자를 선택하면 내부 공유 수신자를 확인할 수 있습니다.';
  }
}


// ══════════════════════════════════════════════════════════════
// 입사 안내 발송
// ══════════════════════════════════════════════════════════════

// 유관 팀 이메일 파싱 (설정 탭의 cfg-notify-teams)
function parseNotifyTeams() {
  const raw = document.getElementById('cfg-notify-teams')?.value || '';
  return raw.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean).map(s => {
    const parts = s.split(' ').filter(Boolean);
    const email = parts.find(p => p.includes('@')) || '';
    const name  = parts.filter(p => !p.includes('@')).join(' ');
    return { name, email };
  }).filter(t => t.email);
}

// ── 입사 안내 관련부서 고정 수신자: 직원 DB에서 검색해 추가 ─────────────
// 저장 형식은 그대로 숨긴 cfg-notify-teams에 '이름 직급 이메일'을 한 줄씩 둔다(parseNotifyTeams와 호환).
let notifyTeamMatches_ = [];

function writeNotifyTeams_(list) {
  const el = document.getElementById('cfg-notify-teams');
  if(el) el.value = list.map(t => `${t.name ? t.name + ' ' : ''}${t.email}`).join('\n');
  renderNotifyTeamChips_();
}

function renderNotifyTeamChips_() {
  const box = document.getElementById('cfg-notify-chips');
  if(!box) return;
  const list = parseNotifyTeams();
  // 이름 없이 이메일만 저장된 수신자도 이름·부서가 보이도록 직원 DB를 한 번 불러온 뒤 다시 그린다.
  if(list.length && !(interviewers || []).length && typeof ensureInterviewersLoaded_ === 'function') {
    ensureInterviewersLoaded_().then(() => { if((interviewers || []).length) renderNotifyTeamChips_(); });
  }
  box.innerHTML = list.length
    ? list.map((t, i) => {
        const iv = (interviewers || []).find(x => String(x.email || '').trim().toLowerCase() === t.email.toLowerCase());
        const dept = iv?.dept ? ` · ${esc(iv.dept)}` : '';
        return `<span class="notify-chip"><b>${esc(t.name || iv?.name || '이름 없음')}</b><span>${dept}</span><span class="notify-chip-mail">${esc(t.email)}</span><button type="button" aria-label="${esc(t.name || t.email)} 삭제" data-action="call" data-call="removeNotifyTeamRecipient(${i})">×</button></span>`;
      }).join('')
    : '<span class="field-hint" style="margin:0">등록된 고정 수신자가 없습니다.</span>';
}

async function filterNotifyTeamCandidates() {
  const input = document.getElementById('cfg-notify-search');
  const listEl = document.getElementById('cfg-notify-results');
  if(!input || !listEl) return;
  await ensureInterviewersLoaded_();
  const q = input.value.trim().toLowerCase();
  const added = new Set(parseNotifyTeams().map(t => t.email.toLowerCase()));
  notifyTeamMatches_ = q ? (interviewers || []).filter(iv => {
    const email = String(iv.email || '').trim().toLowerCase();
    if(!email || added.has(email)) return false;
    return `${iv.name || ''} ${iv.rank || ''} ${iv.dept || ''} ${email}`.toLowerCase().includes(q);
  }).slice(0, 20) : [];
  const directEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(q) && !added.has(q) && !notifyTeamMatches_.some(iv => String(iv.email).toLowerCase() === q);
  if(!q) { listEl.style.display = 'none'; return; }
  const rows = notifyTeamMatches_.map((iv, i) => `<div class="notify-result" data-action="call" data-call="addNotifyTeamRecipient(${i})"><b>${esc(iv.name || '')}</b> ${esc(iv.rank || '')}<span>${esc(iv.dept || '')}</span><span class="notify-chip-mail">${esc(iv.email || '')}</span></div>`);
  if(directEmail) rows.push(`<div class="notify-result" data-action="call" data-call="addNotifyTeamRecipient(-1)">직원 DB에 없는 주소 <b>${esc(q)}</b> 추가</div>`);
  listEl.innerHTML = rows.length ? rows.join('') : `<div class="notify-result-empty">${interviewers.length ? '검색 결과가 없습니다. 이메일 주소를 그대로 입력하면 추가할 수 있습니다.' : '직원 DB가 비어 있습니다. 아래 면접관 DB를 먼저 불러와 주세요.'}</div>`;
  listEl.style.display = 'block';
}

function addNotifyTeamRecipient(index) {
  const input = document.getElementById('cfg-notify-search');
  let entry;
  if(Number(index) === -1) {
    entry = { name:'', email:String(input?.value || '').trim() };
  } else {
    const iv = notifyTeamMatches_[Number(index)];
    if(!iv) return;
    entry = { name:`${iv.name || ''} ${iv.rank || ''}`.trim(), email:String(iv.email || '').trim() };
  }
  if(!entry.email) return;
  const list = parseNotifyTeams();
  if(!list.some(t => t.email.toLowerCase() === entry.email.toLowerCase())) list.push(entry);
  writeNotifyTeams_(list);
  if(input) { input.value = ''; input.focus(); }
  hideNotifyTeamResults_();
  toast(`${entry.name || entry.email}님을 고정 수신자에 추가했습니다. [설정 저장]을 눌러야 반영됩니다.`, 'tinfo');
}

function removeNotifyTeamRecipient(index) {
  const list = parseNotifyTeams();
  list.splice(Number(index), 1);
  writeNotifyTeams_(list);
}

function hideNotifyTeamResults_() {
  const listEl = document.getElementById('cfg-notify-results');
  if(listEl) listEl.style.display = 'none';
}

// 검색 결과를 누르는 동안 목록이 먼저 닫히지 않도록 잠시 뒤에 닫는다.
function hideNotifyTeamResultsLater_() {
  setTimeout(hideNotifyTeamResults_, 200);
}

function onNotifyTeamSearchKey(event) {
  if(event?.key === 'Escape') { hideNotifyTeamResults_(); return; }
  if(event?.key !== 'Enter') return;
  event.preventDefault();
  if(notifyTeamMatches_.length === 1) addNotifyTeamRecipient(0);
  else if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(event.target?.value || '').trim()) && !notifyTeamMatches_.length) addNotifyTeamRecipient(-1);
}

// 입사 안내 메일 + Teams 발송
async function sendJoinNotice(obId) {
  const ob = onboardings.find(o => o.id === obId);
  if(!ob) return;
  const cand = candidates.find(c => c.id === ob.candId);
  if(!cand) return;

  const internal = getOnboardInternalRecipients(cand, ob);
  const { dept, leads, teams, recipients:toEmails } = internal;
  if(!toEmails) {
    toast(`통보할 부서 이메일이 없습니다. '${dept||'부서 미정'}'의 팀장/소장 또는 입사 안내 수신 팀을 설정해 주세요.`, 'terr');
    return;
  }
  if(!leads.length) {
    const confirmed = await confirmActionModal({
      title:'입사 안내 수신자 확인',
      message:`'${dept||'배치 부서 미정'}'의 팀장 또는 소장 이메일을 찾지 못했습니다.`,
      items:[`고정 수신자: ${toEmails}`],
      confirmLabel:'고정 수신자에게 발송',
    });
    if(!confirmed) return;
  }
  const subject = `[입사안내] ${ob.joinDate ? fmtShortDate(ob.joinDate) : '입사일 미정'} ${dept || ob.dept || '배치부서 미정'} ${cand.name} ${ob.rank || ''}`.trim();
  const body = buildInternalOnboardEmail({...ob,dept,pos:cand.pos||ob.pos,etype:ob.etype||cand.etype}, cand);

  // 이메일 발송 (관련 부서 + 피플팀 일괄 수신)
  const sent = await sendGeneralEmailViaGmail(toEmails, subject, body, '입사안내(사내부서)', cand.name, {
    templateType: 'onboarding_internal',
    candidateName: ob.candName || cand.name,
    positionText: cand.pos || ob.pos || '',
    dept: dept || ob.dept || '',
    joinDate: ob.joinDate || '',
    rank: ob.rank || '',
    etype: ob.etype || cand.etype || '',
    location: ob.loc || '',
    phone: ob.phone || cand.phone || cand.mobile || '',
    category: (positions.find(p => Number(p.id) === Number(cand.posId))?.location) || (/현장/.test(dept || ob.loc || '') ? '현장' : '본사'),
    nameEn: ob.nameEn || '',
    cl: ob.cl || '',
    remark: '',
    replyDeadline: (ob.joinDate ? ob.joinDate + ' 전일까지' : '입사일 전일까지'),
    joinDaySchedule: (ob.notes || '').trim() || '입사 당일 본사 출근 예정',
    deptCooperation: '정보전략팀(전산비품), 경영지원팀(전화기 설치(본사만 해당), 사원증 발급)'
  });
  if(sent === false) return;
  ob.deptNotified = true;
  if(typeof updateObSendButton_ === 'function') setTimeout(updateObSendButton_, 0);
  toast(`내부 직원 단체 안내 — 고정 수신팀 ${teams.length}개 + 배치 부서 팀장/소장 ${leads.length}명`, 'tok');
  logNotify('Gmail', '입사안내(사내부서)', cand.name, toEmails);
  saveState();
  renderOnboarding();
}

// 화면에서 고친 입사 정보를 [수정 저장]을 누르지 않았어도 발송 직전에 저장해 메일에 반영한다.
// 입사 예정일은 바뀌면 이미 보낸 안내를 다시 보내도록 표시하는 처리가 있어 [수정 저장]으로만 바꾼다.
const OB_FORM_FIELDS_ = [
  ['ob-dept','dept'], ['ob-dept-lead','deptLead'], ['ob-rank','rank'], ['ob-cl','cl'],
  ['ob-name-en','nameEn'], ['ob-phone','phone'], ['ob-loc','loc'], ['ob-jointime','joinTime'],
  ['ob-reportloc','reportLocation'], ['ob-etype','etype'], ['ob-pre-deadline','preDeadline'],
];
function syncObFormToRecord_(ob) {
  if(!ob) return false;
  let changed = false;
  OB_FORM_FIELDS_.forEach(([id, key]) => {
    const el = document.getElementById(id);
    if(!el) return;
    const value = el.tagName === 'TEXTAREA' ? el.value : String(el.value || '').trim();
    if(value !== String(ob[key] ?? '')) { ob[key] = value; changed = true; }
  });
  if(changed) saveState();
  return changed;
}

function sendCurrentOnboardInternal() {
  const cid=Number(document.getElementById('ob-cand')?.value);
  const c=candidates.find(x=>Number(x.id)===cid);
  if(!c){fieldError_('ob-cand', '최종 합격자를 선택해 주세요.');return;}
  const ob=onboardings.find(o=>Number(o.candId)===cid);
  if(!ob){toast('입사 정보를 먼저 등록해 주세요. 입사 예정일을 입력하고 [등록]을 누르면 됩니다.','terr');return;}
  syncObFormToRecord_(ob);
  sendJoinNotice(ob.id);
}

// 배치 부서장 면접 안내 (최종합격 후 부서장에게)
function addOnboarding(){
  const cid=parseInt(document.getElementById('ob-cand').value);
  const c=candidates.find(x=>x.id===cid);
  if(!c){fieldError_('ob-cand', '최종 합격자를 선택해 주세요.');return;}
  const jd=document.getElementById('ob-date').value;
  if(!jd){fieldError_('ob-date', '입사 예정일을 입력해 주세요.');return;}
  // 이미 등록된 사람이면 같은 버튼으로 수정한다(예전에는 '이미 등록된 입사 예정자'라며 입사일·직책을 바꿀 방법이 없었다).
  const existingOb = onboardings.find(o=>Number(o.candId)===Number(cid));
  if(existingOb) {
    const prevDate = existingOb.joinDate || '';
    Object.assign(existingOb, {
      pos: c.pos,
      etype: document.getElementById('ob-etype').value,
      dept: document.getElementById('ob-dept').value,
      deptLead: document.getElementById('ob-dept-lead')?.value || '',
      joinDate: jd, rank: document.getElementById('ob-rank').value,
      loc: document.getElementById('ob-loc').value,
      joinTime: document.getElementById('ob-jointime')?.value || '',
      reportLocation: document.getElementById('ob-reportloc')?.value || '',
      nameEn: (document.getElementById('ob-name-en')?.value || '').trim(),
      cl: document.getElementById('ob-cl')?.value || '',
      phone: (document.getElementById('ob-phone')?.value || '').trim(),
      preDeadline: document.getElementById('ob-pre-deadline')?.value || '',
    });
    c.joinDate = jd;
    syncReferralFromCandidate(c, {joinDate:jd});
    if(prevDate && prevDate !== jd && (existingOb.notified || existingOb.deptNotified)) {
      // 이미 나간 안내는 이전 입사일 기준이므로 다시 보내도록 표시한다.
      existingOb.notified = false; existingOb.deptNotified = false;
      toast(`${c.name}님 입사일이 ${prevDate} → ${jd}로 바뀌었습니다. 이미 보낸 입사 안내는 이전 날짜이니 다시 발송해 주세요.`, 'tw');
    } else {
      toast(`${c.name}님 입사 정보를 수정했습니다.`, 'tok');
    }
    saveState(); if(GS_CONFIG.scriptUrl) syncCandToGS(c); renderOnboarding(); updateMetrics(); renderDashboard();
    return;
  }
  onboardings.push({
    id:nextId(),candId:cid,candName:c.name,pos:c.pos,
    etype:document.getElementById('ob-etype').value,
    dept:document.getElementById('ob-dept').value,
    deptLead:document.getElementById('ob-dept-lead')?.value||'',
    joinDate:jd,rank:document.getElementById('ob-rank').value,
    loc:document.getElementById('ob-loc').value,
    joinTime:document.getElementById('ob-jointime')?.value||'',
    reportLocation:document.getElementById('ob-reportloc')?.value||'',
    nameEn:(document.getElementById('ob-name-en')?.value||'').trim(),
    cl:document.getElementById('ob-cl')?.value||'',
    phone:(document.getElementById('ob-phone')?.value||'').trim(),
    preDeadline:document.getElementById('ob-pre-deadline')?.value||'',
    notified:false
  });
  if(c.stage<5)c.stage=5;
  c.joinDate = jd;
  syncReferralFromCandidate(c, {joinDate:jd});
  saveState();if(GS_CONFIG.scriptUrl)syncCandToGS(c);renderOnboarding();updateMetrics();updateObSendButton_();
  renderOnboardingPositionFinalists(c.posId,c.id);
}

// 입사 안내(오퍼) 메일 첨부 — 입사 안내 등록 폼에서 고른 파일을 지원자(또는 헤드헌팅 업체) 메일에 붙인다.
function obAttachFiles_() {
  const input = document.getElementById('ob-attach');
  return input?.files ? [...input.files] : [];
}
function renderObAttachList() {
  const el = document.getElementById('ob-attach-list');
  if(!el) return;
  const files = obAttachFiles_();
  const total = files.reduce((sum, f) => sum + f.size, 0);
  const mb = n => (n / 1024 / 1024).toFixed(1);
  el.innerHTML = files.length
    ? `${files.map(f => esc(f.name)).join(', ')} · 합계 ${mb(total)}MB${total > MAIL_ATTACHMENT_MAX_TOTAL_BYTES_ ? ' <b style="color:var(--red)">· 15MB를 넘어 발송할 수 없습니다</b>' : ''}`
    : '선택한 파일은 [지원자 입사안내 발송] 시 함께 첨부됩니다.';
}
function clearObAttachments_() {
  const input = document.getElementById('ob-attach');
  if(input) input.value = '';
  renderObAttachList();
}
// 지금 폼에 선택된 지원자에게 보내는 경우에만 첨부를 붙인다(다른 행의 발송 버튼에 엉뚱한 파일이 붙지 않게).
async function readObAttachmentsFor_(candId) {
  const selected = Number(document.getElementById('ob-cand')?.value);
  const files = Number(candId) === selected ? obAttachFiles_() : [];
  const total = files.reduce((sum, f) => sum + f.size, 0);
  if(total > MAIL_ATTACHMENT_MAX_TOTAL_BYTES_) { fieldError_('ob-attach', '첨부파일이 너무 큽니다. 전체 15MB 이하로 다시 선택해 주세요.'); return null; }
  return Promise.all(files.map(readFileAsMailAttachment_));
}

// ── 메일 공통 첨부(사전 입사 절차 매뉴얼·채용검진 안내) ─────────────────
// 서버(연결된 스프레드시트)에 한 번 등록해 두면 해당 메일마다 자동으로 붙는다. 문서가 바뀌면 [교체]로 새 PDF를 올린다.
// 등록·교체는 설정 화면에서 하고, 발송 화면에는 자동 첨부될 파일만 보여 준다.
// 상태 표시 위치는 data-common-attach-status="종류" 속성으로 찾는다(설정·입사안내·처우검진 창).
const COMMON_ATTACH_UI_ = {
  onboarding:   { label:'사전 입사 절차 매뉴얼', file:'cfg-attach-file-onboarding' },
  offer_health: { label:'채용검진 안내',         file:'cfg-attach-file-offer_health' },
};
let commonAttachments_ = undefined; // undefined: 아직 확인 전, {kind: meta|null}

async function loadCommonAttachments_(force=false) {
  if(commonAttachments_ !== undefined && !force) { renderCommonAttachmentRows_(); return commonAttachments_; }
  if(!hasGsBridge_()) { renderCommonAttachmentRows_('서버 연결 후 확인할 수 있습니다.'); return {}; }
  try {
    const result = isAppsScriptDashboard_()
      ? await adminApiRun_({ action:'getCommonAttachments' })
      : await gsFetch('getCommonAttachments', '', {}, { allowQueue:false });
    commonAttachments_ = result?.ok ? (result.attachments || {}) : {};
  } catch(e) {
    renderCommonAttachmentRows_('확인하지 못했습니다. 새로고침 후 다시 확인해 주세요.');
    return {};
  }
  renderCommonAttachmentRows_();
  return commonAttachments_;
}

function renderCommonAttachmentRows_(message='', onlyKind='') {
  Object.entries(COMMON_ATTACH_UI_).forEach(([kind, ui]) => {
    if(onlyKind && kind !== onlyKind) return;
    const meta = commonAttachments_ ? commonAttachments_[kind] : null;
    document.querySelectorAll(`[data-common-attach-status="${kind}"]`).forEach(status => {
      if(message) status.textContent = message;
      else if(meta) status.innerHTML = `<b>${esc(meta.name)}</b> · ${(Number(meta.size || 0) / 1024 / 1024).toFixed(1)}MB · ${esc(fmtShortDate(meta.uploadedAt))} 등록`;
      else status.innerHTML = `<b style="color:var(--red)">등록된 파일이 없습니다</b> <span style="color:var(--t3)">(설정 → 메일 공통 첨부에서 등록)</span>`;
    });
    document.querySelectorAll(`[data-common-attach-btn="${kind}"]`).forEach(btn => { btn.textContent = meta ? '교체' : '등록'; });
  });
}

function pickCommonAttachment(kind) {
  const ui = COMMON_ATTACH_UI_[kind];
  if(ui) document.getElementById(ui.file)?.click();
}

async function uploadCommonAttachment(input) {
  const kind = input?.dataset?.kind || '';
  const ui = COMMON_ATTACH_UI_[kind];
  const file = input?.files?.[0];
  if(!ui || !file) return;
  if(!/\.pdf$/i.test(file.name)) { toast('공통 첨부는 PDF 파일만 등록할 수 있습니다.', 'terr'); input.value=''; return; }
  if(file.size > 10 * 1024 * 1024) { toast('파일이 너무 큽니다. 10MB 이하 PDF로 다시 선택해 주세요.', 'terr'); input.value=''; return; }
  renderCommonAttachmentRows_('등록 중…', kind);
  try {
    const att = await readFileAsMailAttachment_(file);
    const payload = { kind, name:file.name, base64:att.base64 };
    const result = isAppsScriptDashboard_()
      ? await adminApiRun_({ action:'uploadCommonAttachment', data:payload })
      : await gsFetch('uploadCommonAttachment', '', payload, { allowQueue:false });
    if(!result?.ok) throw new Error(result?.error || 'upload_failed');
    commonAttachments_ = Object.assign({}, commonAttachments_ || {}, { [kind]: result.attachment });
    renderCommonAttachmentRows_();
    toast(`${ui.label} 파일을 등록했습니다. 이제 메일에 '${file.name}'이 자동으로 첨부됩니다.`, 'tok');
  } catch(e) {
    renderCommonAttachmentRows_('', kind);
    toast(`파일을 등록하지 못했습니다. ${friendlyError_(e?.message, '서버(Apps Script) 권한을 확인해 주세요.')}`, 'terr');
  } finally {
    input.value = '';
  }
}

// 공통 첨부가 등록되지 않았으면 발송 전에 한 번 확인한다.
async function confirmCommonAttachmentReady_(kind) {
  const list = await loadCommonAttachments_();
  if(list && list[kind]) return true;
  const label = COMMON_ATTACH_UI_[kind]?.label || '공통 첨부';
  return confirmActionModal({
    title:`${label} 미등록`,
    message:`${label} 파일이 등록되지 않아 첨부 없이 발송됩니다. 메일 본문은 "첨부파일 참조"로 안내됩니다. 그래도 보낼까요?`,
    confirmLabel:'첨부 없이 발송',
    danger:true,
  });
}

// ── 최종합격 통보 · 입사 가능일 회신 ─────────────────────────────
// 검진 적합으로 최종합격이 확정되면 [최종합격 통보]로 합격 사실과 함께 입사 가능 날짜를 제안하고,
// 지원자가 공개 페이지에서 고른 날짜를 입사일로 반영한다. 회신 기록은 서버 JoinDateRequests 시트가 원본이고
// 여기서는 화면용으로 지원자 id별로 들고 있는다(반영한 회신 시각은 다시 덮어쓰지 않도록 따로 기억한다).
const JOIN_DATE_CACHE_KEY_ = 'woomic_join_date_requests_v1';
let joinDateRequests_ = {};
let joinDateApplied_ = {};
let finalPassCandId_ = null;
let finalPassDates_ = [];
try {
  const saved = JSON.parse(localStorage.getItem(JOIN_DATE_CACHE_KEY_) || '{}');
  joinDateRequests_ = saved.requests || {};
  joinDateApplied_ = saved.applied || {};
} catch(e) {}

function persistJoinDateRequests_() {
  try { localStorage.setItem(JOIN_DATE_CACHE_KEY_, JSON.stringify({ requests:joinDateRequests_, applied:joinDateApplied_ })); } catch(e) {}
}

function normalizeJoinDateRequest_(row) {
  let options = row.options;
  if(typeof options === 'string') { try { options = JSON.parse(options || '[]'); } catch(e) { options = []; } }
  return {
    candId:Number(row.candId || row.id), status:String(row.status || ''), options:Array.isArray(options) ? options : [],
    deadline:String(row.deadline || '').slice(0, 10), selection:String(row.selection || '').slice(0, 10),
    note:String(row.note || ''), respondedAt:String(row.respondedAt || ''), link:String(row.link || ''),
    updatedAt:String(row.updatedAt || ''),
  };
}

// 회신이 들어왔으면 입사일로 반영한다(이미 입사 안내를 보낸 입사 등록은 건드리지 않는다).
function applyJoinDateReply_(req, { quiet=false } = {}) {
  if(req.status !== 'RESPONDED' || !req.selection || joinDateApplied_[req.candId] === req.respondedAt) return false;
  const c = candidates.find(x => Number(x.id) === Number(req.candId));
  if(!c) return false;
  joinDateApplied_[req.candId] = req.respondedAt;
  c.joinDate = req.selection;
  const ob = onboardings.find(o => Number(o.candId) === Number(c.id));
  if(ob && !ob.notified) ob.joinDate = req.selection;
  if(GS_CONFIG.scriptUrl) syncCandToGS(c);
  if(!quiet) toast(`${c.name}님이 입사 가능일을 ${fmtShortDate(req.selection)}로 회신했습니다. 입사일로 반영했습니다.`, 'tok');
  return true;
}

function storeJoinDateRequest_(row, options) {
  const req = normalizeJoinDateRequest_(row);
  if(!Number.isFinite(req.candId)) return false;
  joinDateRequests_[req.candId] = req;
  const applied = applyJoinDateReply_(req, options);
  persistJoinDateRequests_();
  if(applied) saveState();
  return true;
}

async function loadJoinDateRequests_() {
  if(!hasGsBridge_()) return;
  try {
    const rows = await gsGetAll('JoinDateRequests', { force:true });
    rows.forEach(row => storeJoinDateRequest_(row));
    renderOnboarding();
    updateObJoinDateHint_();
  } catch(e) {
    console.warn('입사일 회신 목록을 불러오지 못했습니다:', e);
  }
}

// 다른 PC·지원자 회신으로 들어온 변경(getChanges)을 바로 반영한다.
function applyJoinDateRequestChange_(change) {
  if(change.action === 'delete') return false;
  const ok = storeJoinDateRequest_(change.data || {});
  if(ok) { renderOnboarding(); updateObJoinDateHint_(); }
  return ok;
}

function joinDateStatusHtml_(candId) {
  const req = joinDateRequests_[Number(candId)];
  if(!req) return '';
  if(req.status === 'RESPONDED') return `<span class="b bgreen" title="${esc(req.note || '')}">회신 ${esc(fmtShortDate(req.selection))}</span>`;
  if(req.status === 'UNAVAILABLE') return `<span class="b bamber" title="${esc(req.note || '')}">날짜 조정 요청</span>`;
  return `<span class="b bgray" title="${esc(req.options.map(fmtShortDate).join(', '))}">회신 대기</span>`;
}

// 입사 예정일 칸 아래에 지원자 회신 내용을 보여 준다.
function updateObJoinDateHint_() {
  const hint = document.getElementById('ob-date-hint');
  if(!hint) return;
  const req = joinDateRequests_[Number(document.getElementById('ob-cand')?.value)];
  if(!req) { hint.textContent = ''; return; }
  hint.innerHTML = req.status === 'RESPONDED' ? `지원자 회신: <b>${esc(fmtShortDate(req.selection))}</b>${req.note ? ` · ${esc(req.note)}` : ''}`
    : req.status === 'UNAVAILABLE' ? `<b style="color:var(--amber)">제안 날짜가 모두 어렵다는 회신</b> · ${esc(req.note || '')}`
    : `최종합격 통보 발송 · 회신 대기 (${esc(req.options.map(fmtShortDate).join(', '))})`;
}

function openFinalPassModal(candId) {
  const c = candidates.find(x => Number(x.id) === Number(candId));
  if(!c) { toast('지원자 정보를 찾을 수 없습니다. 새로고침 후 다시 시도해 주세요.', 'terr'); return; }
  finalPassCandId_ = Number(c.id);
  const req = joinDateRequests_[c.id];
  finalPassDates_ = req && req.status !== 'RESPONDED' ? [...req.options] : [];
  document.getElementById('fp-title').textContent = `최종합격 통보 · 입사일 확인 — ${c.name}`;
  document.getElementById('fp-target').textContent = `${c.pos || '-'} · ${getCandidateMailTarget(c).to || c.email || '이메일 없음'}${isHeadhuntingCandidate(c) ? ' (헤드헌팅 업체 경유)' : ''}`;
  const deadline = new Date(); deadline.setDate(deadline.getDate() + 3);
  document.getElementById('fp-deadline').value = (req && req.deadline) || localYmd_(deadline);
  document.getElementById('fp-date-input').value = '';
  const status = document.getElementById('fp-status');
  if(status) status.innerHTML = req ? `이전 발송: ${joinDateStatusHtml_(c.id)}${req.note ? ` · ${esc(req.note)}` : ''}` : '';
  renderFinalPassDates_();
  openModal('modal-final-pass');
}

function renderFinalPassDates_() {
  const box = document.getElementById('fp-dates');
  if(!box) return;
  finalPassDates_ = [...new Set(finalPassDates_)].sort();
  box.innerHTML = finalPassDates_.length
    ? finalPassDates_.map((d, i) => `<span class="notify-chip"><b>${esc(fmtShortDate(d))}</b><button type="button" aria-label="${esc(fmtShortDate(d))} 빼기" data-action="call" data-call="removeFinalPassDate(${i})">×</button></span>`).join('')
    : '<span class="field-hint" style="margin:0">제안할 입사 가능 날짜를 추가해 주세요. (여러 개 가능)</span>';
}

function addFinalPassDate() {
  const input = document.getElementById('fp-date-input');
  const value = String(input?.value || '').slice(0, 10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value)) { fieldError_('fp-date-input', '추가할 날짜를 선택해 주세요.'); return; }
  if(value < today()) { fieldError_('fp-date-input', '오늘 이후 날짜를 선택해 주세요.'); return; }
  finalPassDates_.push(value);
  input.value = '';
  renderFinalPassDates_();
}

function removeFinalPassDate(index) {
  finalPassDates_.splice(Number(index), 1);
  renderFinalPassDates_();
}

async function sendFinalPassNotice() {
  const c = candidates.find(x => Number(x.id) === Number(finalPassCandId_));
  if(!c) return;
  if(!finalPassDates_.length) { fieldError_('fp-date-input', '제안할 입사 가능 날짜를 하나 이상 추가해 주세요.'); return; }
  const deadline = document.getElementById('fp-deadline')?.value || '';
  const btn = document.getElementById('fp-send-btn');
  const prevLabel = btn ? btn.textContent : '';
  if(btn) { btn.disabled = true; btn.textContent = '발송 중…'; }
  try {
    const target = getCandidateMailTarget(c);
    const issued = await gsFetch('issueJoinDateLink', '', {
      candId:c.id, candName:c.name, positionText:c.pos || '', options:finalPassDates_, deadline,
      responseBy:isHeadhuntingCandidate(c) ? 'headhunter' : 'candidate',
    }, { allowQueue:false });
    if(!issued?.ok || !issued.link) { toast(`입사일 회신 링크를 만들지 못했습니다. ${friendlyError_(issued?.error, '잠시 후 다시 시도해 주세요.')}`, 'terr'); return; }
    const subject = `[우미건설] ${c.name}님 최종합격 안내 및 입사일 확인`;
    const body = [
      `${c.name}님, 최종 합격을 진심으로 축하드립니다.`, '',
      `우미건설 ${c.pos || ''} 포지션에 최종 합격하셨음을 알려드립니다.`,
      '입사일을 확정하기 위해 아래 링크에서 입사 가능한 날짜를 선택해 주세요.', '',

      '회신해 주신 날짜로 입사일을 확정한 뒤, 입사 준비사항과 함께 입사 안내 메일을 보내드리겠습니다.',
    ].join('\n');
    const sent = await dispatchCandidateMail_(c, {
      subject, purpose:'최종합격 안내 및 입사일 확인', logType:'최종합격통보(업체경유)',
      sendDirect: () => sendGeneralEmailViaGmail(target.to || c.email, subject, body, '최종합격통보', c.name, {
        templateType:'final_pass', candidateName:c.name, positionText:c.pos || '',
        options:finalPassDates_.join(','), replyDeadline:deadline, link:issued.link,
      })
    });
    if(!sent) return;
    joinDateRequests_[c.id] = { candId:Number(c.id), status:'SENT', options:[...finalPassDates_], deadline, selection:'', note:'', respondedAt:'', link:issued.link, updatedAt:new Date().toISOString() };
    persistJoinDateRequests_();
    logActivity('최종합격 통보', `${c.name} · 제안 ${finalPassDates_.map(fmtShortDate).join(', ')}`, 'candidate', String(c.id));
    closeModal('modal-final-pass');

    toast(`${c.name}님에게 최종합격 안내를 보냈습니다. 입사 가능일을 회신하면 입사일로 자동 반영됩니다.`, 'tok');
  } finally {
    if(btn) { btn.disabled = false; btn.textContent = prevLabel; }
  }
}

// 현장 포지션 입사자에게만 입사안내 메일에 현장숙소 개인 짐 안내를 넣는다.
function isSiteOnboarding_(cand) {
  const pos = cand ? positions.find(p => Number(p.id) === Number(cand.posId)) : null;
  return pos?.location === '현장';
}

function pendingJoinAction_(c) {
  const req = joinDateRequests_[Number(c.id)];
  const status = joinDateStatusHtml_(c.id);
  if(!req) return `<button class="btn btn-xs btn-primary" data-action="call" data-call="openFinalPassModal(${c.id})">최종합격 통보</button>`;
  if(req.status === 'RESPONDED') return `<div class="ob-actions">${status}<button class="btn btn-xs btn-primary" data-action="call" data-call="selectOnboardingRow(${c.id})">입사일 등록</button></div>`;
  if(req.status === 'UNAVAILABLE') return `<div class="ob-actions">${status}<button class="btn btn-xs btn-primary" data-action="call" data-call="openFinalPassModal(${c.id})">다시 제안</button></div>`;
  return `<div class="ob-actions">${status}<button class="btn btn-xs" data-action="call" data-call="openFinalPassModal(${c.id})">재발송</button></div>`;
}

function renderOnboarding(){
  const wrap=document.getElementById('ob-table');
  if(!wrap)return;
  const registeredIds = new Set(onboardings.map(o=>Number(o.candId)));
  // 충원완료 포지션의 최종합격자·입사 처리자는 입사 완료로 보고 진행 목록에서 뺀다(아래 접힌 목록에서만 확인).
  const candById = new Map(candidates.map(c=>[Number(c.id),c]));
  const pendingCands = candidates.filter(c=>Number(c.stage)===5 && !registeredIds.has(Number(c.id)) && !isOnboardingDone_(c));
  const sortedObs = [...onboardings].sort((a,b)=>(a.joinDate||'').localeCompare(b.joinDate||''));
  const confirmedObs = sortedObs.filter(o=>!isOnboardingDone_(candById.get(Number(o.candId))));
  const doneList = [
    ...sortedObs.filter(o=>isOnboardingDone_(candById.get(Number(o.candId)))).map(o=>({ name:o.candName, pos:o.pos, dept:o.dept, joinDate:o.joinDate })),
    ...candidates.filter(c=>isOnboardingDone_(c) && !registeredIds.has(Number(c.id))).map(c=>({ name:c.name, pos:c.pos, dept:c.dept, joinDate:getCandidateJoinDate(c) })),
  ];
  const doneHtml = doneList.length ? `<details class="ob-done-list"><summary>입사 완료 · ${doneList.length}명 <span>(충원완료 포지션 포함)</span></summary>
    <div>${doneList.map(d=>`<div class="ob-done-item"><b>${esc(d.name||'-')}</b><span>${esc(d.pos||'-')}${d.dept?` · ${esc(d.dept)}`:''}</span><span>${d.joinDate?esc(fmtDate(d.joinDate)):'입사일 미입력'}</span></div>`).join('')}</div></details>` : '';
  if(!pendingCands.length && !confirmedObs.length){wrap.innerHTML=empty('입사 진행 중인 최종합격자가 없습니다.')+doneHtml;return;}
  const selectedId = Number(document.getElementById('ob-cand')?.value) || 0;
  const rowAttrs = (candId, extraClass='') => `class="ob-row${extraClass}${Number(candId)===selectedId?' ob-row-active':''}" data-action="call" data-call="selectOnboardingRow(${Number(candId)})" title="클릭하면 오른쪽 입사 안내 등록에 불러옵니다"`;
  const nameCell = (name, email, etype) => `<td class="ob-col-name"><div class="ob-name-line"><span class="tname">${esc(name||'-')}</span>${etype?etypePill(etype):''}</div>${email?`<div class="tsub ob-email" title="${esc(email)}">${esc(email)}</div>`:''}</td>`;
  // 부서명이 직무명과 같거나 '직무명+팀'이면(인테리어 / 인테리어팀) 한 번만 보여 준다.
  const sameAsPos = (pos, dept) => { const p=String(pos||'').trim(), d=String(dept||'').trim(); return !d || d===p || d===p+'팀' || p===d+'팀'; };
  const posCell = (pos, dept) => `<td class="ob-col-pos"><div>${esc(pos||dept||'-')}</div>${sameAsPos(pos, dept)?'':`<div class="tsub">${esc(dept)}</div>`}</td>`;
  // 위 그룹 제목이 '입사일 확정 필요'라서 줄마다 '미확정·미발송'을 반복하지 않는다(등록 전에는 발송할 수도 없다).
  const pendingRows = pendingCands.map(c=>`<tr ${rowAttrs(c.id,' ob-row-pending')} style="background:var(--rbg)">
      ${nameCell(c.name, c.email, c.etype)}
      ${posCell(c.pos, c.dept)}
      <td class="ob-col-date"></td>
      <td class="ob-col-notify"></td>
      <td class="ob-col-action">${pendingJoinAction_(c)}</td>
    </tr>`).join('');
  const confirmedRows = confirmedObs.map(o=>{
    const c = candidates.find(x=>Number(x.id)===Number(o.candId));
    return `<tr ${rowAttrs(o.candId)}>
      ${nameCell(o.candName, c?.email || '', o.etype)}
      ${posCell(o.pos, o.dept)}
      <td class="ob-col-date"><div class="ob-date">${esc(o.joinDate?fmtDate(o.joinDate):'-')}</div>${o.rank?`<div class="tsub">${esc(o.rank)}</div>`:''}</td>
      <td class="ob-col-notify"><div class="ob-badges">${o.notified?'<span class="b bgreen">지원자 발송완료</span>':'<span class="b bgray">미발송</span>'}${o.deptNotified?'<span class="b bgreen">부서✓</span>':''}</div></td>
      <td class="ob-col-action"><div class="ob-actions">
        ${o.notified
          ? '<button class="btn btn-xs" data-action="call" data-call="sendObById('+o.id+',\'outlook\')" title="이미 발송했습니다. 다시 보내려면 누르세요.">재발송</button>'
          : '<button class="btn btn-xs btn-primary" data-action="call" data-call="sendObById('+o.id+',\'outlook\')">입사안내 발송</button>'}
        <button class="btn btn-xs" data-action="call" data-call="sendJoinNotice(${o.id})">${o.deptNotified ? '내부 재공유' : '내부 공유'}</button>
      </div></td>
    </tr>`;
  }).join('');
  const pendingHeader = pendingCands.length ? `<tr class="ob-group-row">
      <td colspan="5" style="color:var(--red)">⚠ 입사일 확정 필요 · ${pendingCands.length}명</td>
    </tr>` : '';
  const confirmedHeader = confirmedObs.length ? `<tr class="ob-group-row">
      <td colspan="5" style="color:var(--green)">✓ 입사일 확정 · ${confirmedObs.length}명</td>
    </tr>` : '';
  // 열이 많아 좁은 카드에서 액션 열이 잘렸다 — 채용형태는 이름 옆, 직책은 입사일 아래로 합쳐 5열로 줄였다.
  wrap.innerHTML=`<div class="tw ob-tw"><table class="ob-table">
    <thead><tr><th>지원자</th><th>직무/부서</th><th>입사일·직책</th><th>알림</th><th>액션</th></tr></thead>
    <tbody>${pendingHeader}${pendingRows}${confirmedHeader}${confirmedRows}</tbody>
  </table></div>${doneHtml}`;
}

// ── Google Sheets 설정 저장/로드 ─────────────────────────────
async function saveSettingsToGS(cfg) {
  if(!GS_CONFIG.scriptUrl) return;
  // Settings 시트에 key-value 형태로 저장한다. 브라우저 전용 비밀값은 동기화하지 않는다.
  const remoteCfg = {...cfg};
  delete remoteCfg.openaiKey;
  const items = Object.entries(remoteCfg).map(([key, val]) => ({id: key, value: val}));
  await settleSync([() => gsBatchUpsert('Settings', items)], '설정 동기화');
}

async function loadSettingsFromGS() {
  if(!hasGsBridge_()) return null;
  try {
    const data = await gsGetAll('Settings');
    if(!data || !data.length) return null;
    const cfg = {};
    const tombstones = getGsTombstones();
    data.forEach(row => {
      if(!row.id) return;
      if(String(row.id).startsWith('tombstone:')) {
        const key = String(row.id).slice('tombstone:'.length);
        tombstones[key] = row.value;
      } else cfg[row.id] = row.value;
    });
    localStorage.setItem(GS_TOMBSTONE_KEY, JSON.stringify(tombstones));
    return cfg;
  } catch(e) {
    console.warn('GS 설정 로드 실패:', e);
    return null;
  }
}

// localStorage 먼저 로드 → GS URL이 있으면 GS에서 덮어쓰기 (GS 우선)

      set('cfg-notify-email',    gsCfg.notifyEmail);
      set('cfg-headhunter-db',    gsCfg.headhunterDb);
      set('cfg-gs-url',          gsCfg.gsUrl);
      set('cfg-referral-data-url', gsCfg.referralDataUrl);
      set('cfg-interviewer-url', gsCfg.interviewerUrl);
      set('cfg-ref-auto-url',    gsCfg.refAutoUrl);

      if(gsCfg.gsUrl)          GS_CONFIG.scriptUrl = gsCfg.gsUrl;

function saveSettings() {
  const cfg = {
    sign:    document.getElementById('cfg-sign')?.value    || '',
    flowUrl: document.getElementById('cfg-flow-url')?.value || '',
    channel: document.getElementById('cfg-default-channel')?.value || 'outlook',
    refDays: document.getElementById('cfg-ref-days')?.value || '7',
    remindDays: document.getElementById('cfg-remind-days')?.value || '3',
    hrEmail: document.getElementById('cfg-hr-email')?.value || '',
    notifyEmail: document.getElementById('cfg-notify-email')?.value || '',
    headhunterDb: document.getElementById('cfg-headhunter-db')?.value || '',
    gsUrl:        document.getElementById('cfg-gs-url')?.value        || '',
    referralDataUrl: document.getElementById('cfg-referral-data-url')?.value || '',
    interviewerUrl: document.getElementById('cfg-interviewer-url')?.value || '',
    refAutoUrl: document.getElementById('cfg-ref-auto-url')?.value || '',
    notifyTeams:  document.getElementById('cfg-notify-teams')?.value || '',
    maskPii:      document.getElementById('cfg-mask-pii')?.value || 'false',
    retentionMonths: document.getElementById('cfg-retention-months')?.value || '6',
    idleMinutes:  document.getElementById('cfg-idle-minutes')?.value || '10',
  };
  try {
    localStorage.setItem('woomic_settings', JSON.stringify(cfg));
    setPrivacyMask(cfg.maskPii === 'true');
    resetIdleLock();
    // GS Settings 시트에도 저장
    if(hasGsBridge_()) {
      saveSettingsToGS(cfg).then(()=>{
        toast('설정이 저장되었습니다 (GS 동기화 완료).','tok');
      }).catch(()=>{
        toast('설정은 이 브라우저에만 저장되었습니다 (Google Sheets 동기화 실패).','tw');
      });
    } else {
      toast('설정이 저장되었습니다. 새로고침 후에도 유지됩니다.','tok');
    }
  } catch(e) {
    toast('브라우저 저장공간이 부족해 설정을 저장하지 못했습니다. 다른 탭을 닫거나 브라우저 데이터를 정리한 뒤 다시 시도해 주세요.','terr');
  }
}

function loadSettings() {
  try {
    const raw = localStorage.getItem('woomic_settings');
    if(!raw) return;
    const cfg = JSON.parse(raw);
    const set = (id, val) => { const el=document.getElementById(id); if(el&&val) el.value=val; };
    set('cfg-sign',             cfg.sign);
    set('cfg-flow-url',         cfg.flowUrl);
    set('cfg-default-channel',  cfg.channel);
    set('cfg-ref-days',         cfg.refDays);
    set('cfg-remind-days',      cfg.remindDays);
    set('cfg-hr-email',         cfg.hrEmail);
    set('cfg-notify-email',     cfg.notifyEmail);
    set('cfg-headhunter-db',    cfg.headhunterDb);
    set('cfg-gs-url', cfg.gsUrl);
    if(cfg.gsUrl) GS_CONFIG.scriptUrl = cfg.gsUrl; // GS 연동 복원
    set('cfg-referral-data-url', cfg.referralDataUrl);
    if(cfg.referralDataUrl) GS_CONFIG.referralDataUrl = cfg.referralDataUrl;
    set('cfg-interviewer-url', cfg.interviewerUrl);
    if(cfg.interviewerUrl) {
      GS_CONFIG.interviewerUrl = cfg.interviewerUrl;
    }
    set('cfg-ref-auto-url', cfg.refAutoUrl);
    if(cfg.refAutoUrl) GS_CONFIG.refAutoUrl = cfg.refAutoUrl;
    set('cfg-notify-teams',     cfg.notifyTeams);
    renderNotifyTeamChips_();
    set('cfg-mask-pii',         cfg.maskPii);
    set('cfg-retention-months', cfg.retentionMonths);
    set('cfg-idle-minutes',     cfg.idleMinutes);
    renderHeadhunterDbPreview();
    populateHeadhunterSelect();
    privacyMode = cfg.maskPii === 'true' || localStorage.getItem('woomic_privacy_mask') === 'true';
  } catch(e) { console.warn('설정 로드 실패', e); }
}

// 레퍼런스(구) 단계 마이그레이션 사전 점검 — 아무 것도 쓰지 않는 읽기 전용 조회.
// 병행 전형 코드를 배포하면 레퍼런스(구) 단계 지원자는 칸반/단계 버튼에서 보이지
// 않게 되므로, 배포 전에 몇 명이 남아 있는지 확인하는 용도다.
async function runLegacyReferenceMigrationPreview() {
  const resultEl = document.getElementById('ref-migration-preview-result');
  if(resultEl) resultEl.textContent = '점검 중...';
  try {
    const r = await adminApiRun_({ action:'legacyReferenceStageMigrationPreview' });
    if(!r || r.error) {
      if(resultEl) resultEl.textContent = `점검 실패: ${r?.error || '알 수 없는 오류'}`;
      return;
    }
    const fmtMap = obj => Object.entries(obj || {}).map(([k,v]) => `${k} ${v}`).join(', ') || '없음';
    const lines = [
      `레퍼런스(구) 단계 잔류 인원: ${r.totalLegacyReferenceCandidates}명`,
      `· 2차면접 기록 있음 ${r.withSecondInterviewRecord}명 / 없음 ${r.withoutSecondInterviewRecord}명`,
      `· 레퍼런스 상태: ${fmtMap(r.refStatusBreakdown)}`,
      `· 1차 면접 완료기록 누락 ${r.missingFirstInterviewCompletion}명`,
      `· lastCompletedStage 불일치(1이 아님) ${r.lastCompletedStageMismatch}명`,
      `· 보류(held) ${r.heldCount}명`,
      `· 포지션 상태별: ${fmtMap(r.byPositionStatus)}`,
    ];
    if(resultEl) resultEl.textContent = lines.join('\n');
    console.info('[레퍼런스 마이그레이션 점검] 지원자별 상세', r.candidates);
    toast(`점검 완료 · 잔류 ${r.totalLegacyReferenceCandidates}명 (지원자별 상세는 브라우저 콘솔 참고)`, 'tok');
  } catch(err) {
    if(resultEl) resultEl.textContent = `점검 실패: ${err?.message || err}`;
  }
}

// 레퍼런스(구) 단계 레코드를 2차면접으로 실제 이관한다 — 먼저 점검 결과를 다시 불러와
// 대상자 명단을 보여주고 확인을 받은 뒤에만 서버에 반영한다. stage 필드만 바뀌고
// 일정·레퍼런스 응답·보고서는 그대로 유지된다.
async function runLegacyReferenceMigrationExecute() {
  const resultEl = document.getElementById('ref-migration-preview-result');
  let preview;
  try {
    preview = await adminApiRun_({ action:'legacyReferenceStageMigrationPreview' });
  } catch(err) {
    toast(`이관 대상을 조회하지 못했습니다. ${friendlyError_(err)}`, 'terr');
    return;
  }
  if(!preview || preview.error) { toast(`이관 대상을 조회하지 못했습니다. ${friendlyError_(preview?.error)}`, 'terr'); return; }
  if(!preview.totalLegacyReferenceCandidates) { toast('이관할 대상이 없습니다. 이미 모두 2차면접으로 넘어갔습니다.', 'tok'); return; }

  const confirmed = await confirmActionModal({
    title:'레퍼런스 단계 → 2차면접 이관',
    message:`레퍼런스(구) 단계에 남은 ${preview.totalLegacyReferenceCandidates}명의 단계를 2차면접으로 변경합니다. 일정·레퍼런스 응답·보고서는 그대로 유지되며, 메일은 발송되지 않습니다.`,
    items:preview.candidates.map(c => `${c.name} · ${c.positionTitle} · 레퍼런스 ${c.ref}`),
    confirmLabel:`${preview.totalLegacyReferenceCandidates}명 이관`,
    danger:true,
  });
  if(!confirmed) return;

  if(resultEl) resultEl.textContent = '이관 중...';
  try {
    const r = await adminApiRun_({ action:'migrateLegacyReferenceStage', data:{ confirm:true } });
    if(!r || r.error) { toast(`이관하지 못했습니다. ${friendlyError_(r?.error)}`, 'terr'); return; }
    if(resultEl) resultEl.textContent = `이관 완료 · 성공 ${r.migratedCount}명${r.failedCount?` · 실패 ${r.failedCount}명`:''}`;
    console.info('[레퍼런스 이관] 결과', r);
    toast(`이관 완료 · ${r.migratedCount}명을 2차면접으로 변경했습니다.`, r.failedCount ? 'tw' : 'tok');
    if(typeof syncCoreFromGS === 'function') syncCoreFromGS();
  } catch(err) {
    if(resultEl) resultEl.textContent = `이관 실패: ${err?.message || err}`;
  }
}

function scrubLegacyBrowserSecrets() {
  try {
    const raw = localStorage.getItem('woomic_settings');
    if(!raw) return;
    const cfg = JSON.parse(raw);
    if(!cfg || !Object.prototype.hasOwnProperty.call(cfg, 'openaiKey')) return;
    delete cfg.openaiKey;
    localStorage.setItem('woomic_settings', JSON.stringify(cfg));
    console.info('브라우저에 남아 있던 OpenAI API 키 설정을 제거했습니다.');
  } catch(e) {
    console.warn('브라우저 비밀값 정리 실패', e);
  }
}


</script>
