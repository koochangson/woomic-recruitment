<script>
// ══════════════════════════════════════════════════════════════
// 내부 모듈 경계: 단일 HTML을 유지하면서 역할별 공개 API를 구분한다.
// ══════════════════════════════════════════════════════════════
const RecruitmentCore = Object.freeze({
  posStatus, getPositionFlow, nextFlowStage, isActivePipelineCand, getActionItems,
  buildRehireTitle, calculateOperationalMetrics, uniqueInterviewRecords, getPeriodReport, chunkText,
  maskEmail, applyPrivacyRetention,
});
const RecruitmentPersistence = Object.freeze({
  loadState, saveState, gsGetAll, gsUpsert, gsBatchUpsert, gsDelete, syncCandToGS, syncIntToGS, syncPosToGS,
  flushGsRetryQueue, checkGsSchemaCoverage, loadAuxStateFromGS, syncAuxStateToGS,
});
const RecruitmentUI = Object.freeze({
  renderDashboard, renderPositions, renderTracker, renderPositionDetail, renderPeriodReport,
  openModal, closeModal, switchKanban,
});

const DELEGATED_CALLS = Object.freeze({
  addCandToPos, addCandidate, addInterview, addOnboarding, applyBatchSchedule, applyInterviewConfirm,
  cancelInterviewConfirm, cancelStageChange, changePositionProcessStage, closeCollectSend, closeModal, closePosition, completeRef, confirmInterview,
  confirmMailPendingAt, confirmPendingMail, confirmStageChange, confirmStageDecisions, delInt, dismissPendingMail,
  deletePosition, doCollectSendCurrent, editCandidate, editPosition, executeBulkAdd, executeNohireWizard, executePositionProcessTask,
  addRecruitPlanTarget, applyAIToRefReport, clearPositionOrgFilter, dashDropStage, exportRecruitStatus, fillOnboardingDefaults, filterInterviewers, filterPosToTeam, generateAI, generateDashboardBrief, kbActivate, linkCandFromUnlinked, loadInterviewers, lockPrivacyScreen, markInterviewDone, markOneResponse,
  markRefRegistered, markRefResponse, moveBatchCandidate, moveRecruitPlanDraft, nav, navBtn, nextCollectSend, nohirePosition, onPosLocationChange, openAddCand, openAddPosition, openAddTeam, openBulkAddCand, openRecruitPlanModal,
  openCollectSlots, openIntResult, openInterviewNoticeFlow, openPosDetail, openPositionResultModal, openPositionRoundSchedule, openReferralDraft, quickNotify, rejectCandidate,
  remindOneRef, remindRef, removePanelist, removeRecruitPlanDraft, renderActivityLog, renderIntTable, renderNotifyLog, renderReference, renderRefReport, renderTracker, reopenPosition, requestPositionReferences,
  posdetailClosePos, posdetailDeletePos, posdetailStopPos, printReferralInterviewSheet, purgeExpiredPii, renderExpiredPii, renderReferralSection, renderTeamMaster, requestStageChange, resetIdleLock, saveNewTeam, savePosition, savePositionResults, saveRecruitPlanModal, saveRefReport, saveReferralDraft, saveReferralEmployee, saveReferralStatus, selectPositionResult, selectReferral, setInterviewPositionFilter, setPrivacyMaskFromControl, setReferralView, setRpLocation, setRpYear, setRsYear, setTrackerPage, snapTo10,
  exportReferralRewardsCsv, finishRejectReason, runCoreDiagnosticsUI,
  refreshOnboardingDeptRecipients, saveSettings, searchRecruitPlanTargets, selectRefCand, selectRefPosition, selectTemplateEditor, insertTemplateSnippet, sendBulk, sendCollectSlots, sendCurrentOnboardInternal, sendIntById, sendIntNotify,
  sendAllCandSchedule, sendInterviewNoticeCandidates, sendInterviewNoticePanel, sendJoinNotice, sendObById, sendObNotify, sendPanelAvailabilityRequest, refreshCurrentPanelAvailability, sendPanelNotice, sendRefRequest, setDashPipeFilter, confirmPanelAvailabilityAndContinue, setRefFilter, showUnlinkedList, scrollPositionDetail,
  closeAddTeam, createCandidateFromReferral, deleteTeam, editReferralEmployee, importInterviewersFromEmployeeFile, refreshEmployeesFromGS, refreshReferralsFromGS, skipCollectSend, startAllEligible, startRef, stopPosition, syncCoreFromGS, syncRefFromGS, syncTeamMasterFromInterviewers, testGSConnection, testInterviewerConnection,
  setReferenceStageMailChoice, testRefAutoConnection, toggleHeadhunterFields, togglePositionProcessGroup, toggleTeamVisibility, unlockPrivacyScreen, updateAddCandSeatHint, updateBulkPreview, updateBulkSeatHint, updateHeadhunterHint, updateIntPreview, updateObPreview, updateRecruitPlanDraft, updateRewardStatusFromSelect,
  populateHeadhunterSelect, renderHeadhunterDbPreview,
});
function invokeDelegatedCall(call, target, delegatedEvent) {
  const match = String(call || '').match(/^([A-Za-z_$][\w$]*)\((.*)\)$/);
  const fn = match && DELEGATED_CALLS[match[1]];
  if(typeof fn !== 'function') return;
  const raw = match[2].trim();
  const args = raw ? raw.match(/'(?:\\'|[^'])*'|"(?:\\"|[^"])*"|[^,]+/g).map(token => {
    const v = token.trim();
    if(v === 'this') return target;
    if(v === 'event') return delegatedEvent;
    if(v === 'true') return true;
    if(v === 'false') return false;
    if(v === 'null') return null;
    if(/^[-+]?\d+(?:\.\d+)?$/.test(v)) return Number(v);
    if((v.startsWith("'")&&v.endsWith("'"))||(v.startsWith('"')&&v.endsWith('"'))) return v.slice(1,-1);
    return undefined;
  }) : [];
  if(args.some(v => v === undefined)) return;
  return fn(...args);
}

function invokeDelegatedSequence(sequence, target, delegatedEvent) {
  const source = String(sequence || '').trim();
  if(!source) return;
  const pendingMatch = source.match(/^pendingMailMeta=\{type:'([^']+)',id:(\d+)\};confirmPendingMail\(\)$/);
  if(pendingMatch) {
    pendingMailMeta = { type:pendingMatch[1], id:Number(pendingMatch[2]) };
    return confirmPendingMail();
  }
  const hideMatch = source.match(/^document\.getElementById\('([^']+)'\)\.style\.display='none'$/);
  if(hideMatch) {
    const el = document.getElementById(hideMatch[1]);
    if(el) el.style.display = 'none';
    return;
  }
  const valueMatch = source.match(/^document\.getElementById\('([^']+)'\)\.value='([^']*)'$/);
  if(valueMatch) {
    const el = document.getElementById(valueMatch[1]);
    if(el) el.value = valueMatch[2];
    return;
  }
  source.split(';').map(part => part.trim()).filter(Boolean).forEach(call => {
    if(call === 'event.stopPropagation()') delegatedEvent?.stopPropagation?.();
    else invokeDelegatedCall(call, target, delegatedEvent);
  });
}

function handleDelegatedAction(target, delegatedEvent) {
  const action = target.dataset.action;
  if(target.dataset.stop === 'true') delegatedEvent?.stopPropagation?.();
  if(target.dataset.close) closeModal(target.dataset.close);
  if(action === 'nav') nav(target.dataset.target, target);
  else if(action === 'switch-kanban') switchKanban(target.dataset.view);
  else if(action === 'open-position') openPosDetail(Number(target.dataset.id));
  else if(action === 'reopen-position') reopenPosition(Number(target.dataset.id));
  else if(action === 'close-position') closePosition(Number(target.dataset.id));
  else if(action === 'edit-position') editPosition(Number(target.dataset.id));
  else if(action === 'delete-position') deletePosition(Number(target.dataset.id));
  else if(action === 'close-modal') closeModal(target.dataset.id);
  else if(action === 'filter-stage') filterStage(Number(target.dataset.value), target);
  else if(action === 'filter-role') filterRole(target.dataset.value, target);
  else if(action === 'filter-etype') filterEtype(target.dataset.value, target);
  else if(action === 'filter-position') setPosFilter(target.dataset.value, target);
  else if(action === 'filter-reference') setRefFilter(target.dataset.value, target);
  else if(action === 'open-candidate') openDetail(Number(target.dataset.id));
  else if(action === 'edit-candidate') editCandidate(Number(target.dataset.id));
  else if(action === 'select-interviewer') selectInterviewer(Number(target.dataset.round), target.dataset.payload);
  else if(action === 'call') invokeDelegatedSequence(target.dataset.call, target, delegatedEvent);
  else if(action === 'render-period-report') renderPeriodReport();
  else if(action === 'export-period-report') exportPeriodReport();
}

function handleDelegatedFormEvent(eventName, target, delegatedEvent) {
  const call = target.dataset[`on${eventName}`];
  if(call) invokeDelegatedSequence(call, target, delegatedEvent);
  if(eventName === 'blur') {
    if(target.id === 'pos-panel1-search') setTimeout(() => hideInterviewerList(1), 200);
    if(target.id === 'pos-panel2-search') setTimeout(() => hideInterviewerList(2), 200);
  }
}

// ══════════════════════════════════════════════════════════════
// 초기화
// ══════════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
try {
  bindAdminLogin_();
  if(isAppsScriptDashboard_() && !getAdminSessionToken_()) showAdminLogin_();
  // data-action 기반 단일 이벤트 위임: 정적 내비게이션과 신규 리포트 영역부터 점진 적용
  document.addEventListener('click', e => {
    const target = e.target.closest?.('[data-action]');
    if(!target) return;
    if(target.dataset.action === 'select-interviewer') return;
    handleDelegatedAction(target, e);
  });
  document.addEventListener('mousedown', e => {
    const target = e.target.closest?.('[data-action="select-interviewer"]');
    if(target) handleDelegatedAction(target, e);
  });
  ['change','input','focus','blur'].forEach(eventName => {
    document.addEventListener(eventName, e => {
      const target = e.target.closest?.(`[data-on${eventName}]`);
      if(target) handleDelegatedFormEvent(eventName, target, e);
    }, true);
  });
  document.addEventListener('keydown', e => {
    const target = e.target.closest?.('[data-onkeydown]');
    if(!target) return;
    if(target.dataset.onkeydown === 'kbActivate(event)' && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      target.click();
      return;
    }
    handleDelegatedFormEvent('keydown', target, e);
  });
  document.addEventListener('dragstart', e => {
    const target = e.target.closest?.('[data-ondragstart]');
    if(target?.dataset.id) e.dataTransfer?.setData('text/plain', target.dataset.id);
  });
  document.addEventListener('dragover', e => {
    const target = e.target.closest?.('[data-ondragover]');
    if(!target) return;
    e.preventDefault();
    target.classList.add('drag-over');
  });
  document.addEventListener('dragleave', e => {
    const target = e.target.closest?.('[data-ondragleave]');
    if(target) target.classList.remove('drag-over');
  });
  document.addEventListener('drop', e => {
    const target = e.target.closest?.('[data-ondrop]');
    if(!target) return;
    e.preventDefault();
    target.classList.remove('drag-over');
    invokeDelegatedSequence(target.dataset.ondrop, target, e);
  });
  privacyMode = localStorage.getItem('woomic_privacy_mask') === 'true';
  if(typeof MutationObserver === 'function') {
    privacyObserver = new MutationObserver(() => { if(privacyMode) maskVisiblePii(); });
    privacyObserver.observe(document.body, {childList:true,subtree:true,characterData:true});
  }
  ['click','keydown','touchstart'].forEach(name => document.addEventListener(name, resetIdleLock, true));
  // ── 데이터 로드 (localStorage → GS 순서) ──────────────────
  const saved = loadState();
  if(saved && saved.candidates) {
    candidates  = saved.candidates  || [];
    interviews  = saved.interviews  || [];
    onboardings = saved.onboardings || [];
    notifyLog   = saved.notifyLog   || [];
    refDetails  = saved.refDetails  || {};
    refReports  = saved.refReports  || {};
    positions   = saved.positions   || [];
    referrals   = saved.referrals   || [];
    rewards     = saved.rewards     || [];
    refRules    = saved.refRules    || [];
    employees   = saved.employees   || [];
    activityLog = saved.activityLog || [];
    auxUpdatedAt = saved.auxUpdatedAt || '';
  }
  checkGsSchemaCoverage();
  const privacyCleanup = applyPrivacyRetention();
  if(privacyCleanup.removedNotify || privacyCleanup.removedActivity) saveState();
  // 기존 중복 면접 데이터 정리 (같은 지원자+type 1건만)
  const dups = dedupeInterviews();

  // 모달은 X·닫기·취소 같은 명시적 버튼으로만 닫고, 배경 클릭과 ESC로는 닫지 않는다.
  // 모달 내부 Tab 포커스 순환
  document.addEventListener('keydown', e => {
    const open = [...document.querySelectorAll('.overlay.open')].pop();
    if(!open) return;
    if(e.key === 'Tab') {
      const focusable = [...open.querySelectorAll('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])')]
        .filter(el => !el.disabled && el.offsetParent !== null);
      if(!focusable.length) { e.preventDefault(); open.focus(); return; }
      const first = focusable[0], last = focusable[focusable.length-1];
      if(e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  // 면접 후보 일정 변경 시 미리보기 업데이트
  [1,2,3].forEach(n => {
    [`cs-slot${n}-dt`].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.addEventListener('change', () => {
        if(pendingStageChange) {
          const c = candidates.find(x => x.id === pendingStageChange.candId);
          if(c) {
            const preview = buildStageNotifyMsg(c, pendingStageChange.newStage);
            const previewEl = document.getElementById('cs-preview-msg');
            if(previewEl) previewEl.textContent = preview;
          }
        }
      });
    });
  });

  // 고정 URL을 설정 입력창에 표시 (회사 PC 데이터 삭제 대비)
  const showFixed = (id, val) => { const el=document.getElementById(id); if(el && val && !el.value) el.value = val; };
  showFixed('cfg-gs-url',          FIXED_URLS.scriptUrl);
  showFixed('cfg-referral-data-url', FIXED_URLS.referralDataUrl);
  showFixed('cfg-interviewer-url', FIXED_URLS.interviewerUrl);
  showFixed('cfg-ref-auto-url',    FIXED_URLS.refAutoUrl);

  scrubLegacyBrowserSecrets();

  // 설정 로드 (localStorage + GS 동기화)
  loadSettingsWithGS().then(() => {
    // 고정 URL은 GS 설정 로드 후에도 유지 (빈 값으로 덮어쓰지 않도록 재적용)
    if(FIXED_URLS.scriptUrl)      GS_CONFIG.scriptUrl      = FIXED_URLS.scriptUrl;
    if(FIXED_URLS.referralDataUrl) GS_CONFIG.referralDataUrl = FIXED_URLS.referralDataUrl;
    if(FIXED_URLS.interviewerUrl) GS_CONFIG.interviewerUrl = FIXED_URLS.interviewerUrl;
    if(FIXED_URLS.refAutoUrl)     GS_CONFIG.refAutoUrl     = FIXED_URLS.refAutoUrl;
    if(FIXED_URLS.referralScriptUrl) GS_CONFIG.referralScriptUrl = FIXED_URLS.referralScriptUrl;
    // 지원자 데이터 로드 (GS 우선, 실패 시 localStorage 캐시 유지)
    if(GS_CONFIG.scriptUrl) {
      loadAuxStateFromGS().then(loaded => {
        if(loaded) { renderActivityLog(); renderReference(); renderOnboarding(); renderNotifyLog(); }
      }).finally(() => { auxSyncSuspended = false; });
      syncCoreFromGS().then(loaded => {
        if(loaded) {
          renderDashboard(); renderRecruitStatus(); renderTracker(); renderPositions(); renderIntTable();
          showSyncStatus('Google Sheets 기준으로 로드됨', 'ok');
        } else {
          showSyncStatus('⚠ GS 응답 없음 — 로컬 캐시로 표시 중', 'warn');
        }
      }).catch(() => {
        showSyncStatus('⚠ GS 연결 실패 — 로컬 캐시로 표시 중 (네트워크 확인)', 'warn');
      });
      // 사내추천은 별도 스프레드시트라 위 syncCoreFromGS 커서 폴링에 안 잡힘 — 따로 동기화
      syncReferralCoreFromGS().then(loaded => {
        if(loaded) { renderReferralSection(); updateMetrics(); }
      }).catch(() => {});
    } else {
      auxSyncSuspended = false;
      showSyncStatus('⚠ 관리자 URL 미설정 — 설정 탭에서 관리자 Apps Script URL을 입력하세요.', 'warn');
    }
    // 면접관 DB 자동 로드
    if(GS_CONFIG.interviewerUrl && typeof loadInterviewers === 'function') loadInterviewers();
    // 레퍼런스 상태 자동 동기화
    if(GS_CONFIG.refAutoUrl && typeof syncRefFromGS === 'function') syncRefFromGS();
    // 이전 세션에서 실패한 GS 저장 요청 재시도
    if(hasGsBridge_()) setTimeout(flushGsRetryQueue, 1500);
  });
  document.getElementById('tb-date').textContent = new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  renderDashboard();
  renderPositions();
  renderActivityLog();
  populateSel('int-cand');
  populateSel('ob-cand');
  updateIntPreview();
  updateObPreview();
  updateBulkPreview();
  renderExpiredPii();
  resetIdleLock();
  if(privacyMode) maskVisiblePii();

} catch(initErr) {
  console.error('[DOMContentLoaded] 초기화 에러:', initErr);
  alert('대시보드 초기화 오류: ' + initErr.message + '\n\nF12 → Console 탭을 확인하세요.');
}
});

</script>
