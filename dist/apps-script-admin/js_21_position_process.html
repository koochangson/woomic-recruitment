<script>
// ══════════════════════════════════════════════════════════════
// 포지션 상세: 진행현황·체크리스트·Gate·단계 전환
// js_02_positions_interviews.html에서 분리 (Phase 2).
// ══════════════════════════════════════════════════════════════

function getPositionProjectData(positionId) {
  const pos = positions.find(p => Number(p.id) === Number(positionId));
  if(!pos) return null;
  const list = candidates.filter(c => Number(c.posId) === Number(positionId));
  const target = parseInt(pos.headcount) || 1;
  const final = list.filter(isSeatFilledCand_); // 최종합격 + 입사
  const rejected = list.filter(c => c.stage === 6);
  const active = list.filter(c => c.stage < 5 && !c.held);
  const filled = Math.min(target, final.length);
  const remain = Math.max(0, target - filled);
  const rate = target ? Math.min(100, Math.round(filled / target * 100)) : 0;
  const rawStatus = posStatus(pos);
  // isOpen: 아직 모집 중(status 'active')인지. 저장된 'partial'은 "부분 충원 마감"이라 종료 상태다.
  const isOpen = rawStatus === 'active';
  const projectStatus = isOpen ? (filled > 0 && remain > 0 ? 'partial' : 'active') : (rawStatus === 'partial' ? 'partial_closed' : rawStatus);
  const statusLabels = { active:'진행중', partial:'부분충원', partial_closed:'부분충원 마감', filled:'충원완료', nohire:'미채용', stopped:'중단' };
  return { pos, list, target, final, rejected, active, filled, remain, rate, isOpen, projectStatus, statusLabel:statusLabels[projectStatus] || posStatusLabel(pos) };
}

function positionRoundData(positionId, stageIdx) {
  const round = stageIdx === 1 ? '1차' : '2차';
  const candidateStages = stageIdx === 1 ? [0,1] : [2,3];
  const positionCands = candidates.filter(c => Number(c.posId) === Number(positionId));
  const roundCands = positionCands.filter(c => candidateStages.includes(c.stage));
  const positionIds = new Set(positionCands
    .filter(c => candidateStages.includes(c.stage) || (c.stage !== 0 && (c.stage >= stageIdx || Number(c.lastCompletedStage) >= stageIdx)))
    .map(c => Number(c.id)));
  const roundInterviews = interviews.filter(i => positionIds.has(Number(i.candId)) && i.type === round);
  return {
    round, candidates:roundCands, interviews:roundInterviews,
    pending:roundInterviews.filter(i => (i.status||'pending') === 'pending'),
    confirmed:roundInterviews.filter(i => i.status === 'confirmed' || i.status === 'done'),
    done:roundInterviews.filter(i => i.status === 'done'),
    candidateNotified:roundInterviews.filter(i => i.candidateNotified || i.candNotified),
    panelNotified:roundInterviews.filter(i => i.panelNotified || i.notified),
  };
}

// 확정된 면접이 있고, 그 전원에게 지원자 안내와 면접관 안내가 모두 발송됐는지
function isRoundNoticeComplete_(roundData) {
  // 지금 이 차수에 남아 있는 지원자가 있으면 그들의 면접만 본다(탈락·보류자의 미표시 기록 제외).
  const current = new Set((roundData?.candidates || []).filter(c => !c.held).map(c => Number(c.id)));
  const all = roundData?.confirmed || [];
  const confirmed = current.size ? all.filter(i => current.has(Number(i.candId))) : all;
  if(!confirmed.length) return false;
  return confirmed.every(i => (i.candidateNotified || i.candNotified) && (i.panelNotified || i.notified));
}

function isRoundAvailabilityComplete(roundData) {
  if(!roundData?.candidates?.length) return false;
  return roundData.candidates.every(c => {
    const itv = roundData.interviews.find(i => Number(i.candId) === Number(c.id));
    return ['RESPONDED','UNAVAILABLE'].includes(itv?.availabilityStatus);
  });
}

function getPositionActionItems(positionId) {
  const d = getPositionProjectData(positionId);
  if(!d) return [];
  const { pos, list: allList, target, final, remain, projectStatus, isOpen } = d;
  const items = [];
  const add = (type, priority, title, desc, actionLabel, action, actionCall) =>
    items.push({ type, priority, title, desc, actionLabel, action, actionCall });

  // 충원완료·미채용·채용중단된 포지션은 더 이상 진행 액션이 필요 없다 — 보류(held) 처리된
  // 지원자도 같은 이유로 제외한다 (예: 채용중단 후에도 레퍼런스 재요청 등이 계속 남는 문제 방지).
  if(isOpen) {
    const list = allList.filter(c => !c.held);
    const short = isShortProcessEtype(pos.etype);
    const r1 = positionRoundData(positionId, 1);
    const r2 = positionRoundData(positionId, 3);
    const hasHeadhunting = list.some(isHeadhuntingCandidate);
    const routeNoticeText = hasHeadhunting ? '업체 경유 안내' : '지원자 안내';

    if(!list.length) add('candidate_register','high','지원자 미배정','등록된 지원자 없음 · 지원자 등록 필요','지원자 추가','addCandToPos',`addCandToPos(${positionId})`);

    const stage0 = list.filter(c => c.stage === 0);
    if(stage0.length && !pos.panel1AvailabilityConfirmedAt && !r1.confirmed.length) add('first_panel_availability','high',pos.panel1AvailabilityRequestedAt?'1차 면접관 가능 일정 회신 확인 필요':'1차 면접관 가능 일정 확인 필요',pos.panel1AvailabilityRequestedAt?panelReplyTaskText_(pos,1):'면접관에게 공통 후보 날짜의 참석 가능 여부를 먼저 확인하세요.','면접관 일정 확인','openCollectSlots',`openCollectSlots(${positionId},1)`);
    if(stage0.length && pos.panel1AvailabilityConfirmedAt && !r1.interviews.length) add('first_slots','high',`1차 지원자 가능일 ${routeNoticeText} 필요`,`${stage0.length}명 · 면접관 확인이 완료된 후보일정을 ${hasHeadhunting?'업체 경유로 ':''}지원자에게 안내하세요.`,'지원자 가능일 확인','openCollectSlots',`openCollectSlots(${positionId},1)`);

    // r1.interviews는 완료·확정 여부 추적을 위해 이미 다음 단계로 넘어간 지원자의
    // 면접 기록도 포함한다 — 일정 확정 액션은 "지금 1차 단계에 남아있는" 지원자로
    // 한정해야, 대상이 없는 포지션에 openPositionRoundSchedule을 띄워 "지원자가
    // 없습니다" 오류가 나는 상황(처리 필요 업무 ↔ 실제 진행 상태 불일치)을 막는다.
    const round1CandIds = new Set(list.filter(c => [0,1].includes(c.stage)).map(c => Number(c.id)));
    const firstResponded = r1.interviews.filter(i => round1CandIds.has(Number(i.candId)) && ['RESPONDED','UNAVAILABLE'].includes(i.availabilityStatus));
    const firstWaiting = r1.interviews.filter(i => round1CandIds.has(Number(i.candId)) && i.availabilityStatus === 'SENT');
    const firstPending = r1.pending.filter(i => round1CandIds.has(Number(i.candId)));
    if(firstResponded.length && !firstWaiting.length) add('first_schedule_reply','high','1차 면접시간·순서 확정 필요',`가능 시간대 응답 ${firstResponded.length}건 취합 완료 · 세부 시간과 순서를 확정하세요.`,'일정 확정','openPositionRoundSchedule',`openPositionRoundSchedule(${positionId},1)`);
    else if(firstWaiting.length) add('first_schedule_wait','medium','1차 가능 시간대 응답 대기',`응답완료 ${firstResponded.length}명 · 대기 ${firstWaiting.length}명`,'응답 현황','openCollectSlots',`openCollectSlots(${positionId},1)`);
    else if(firstPending.length) add('first_schedule','high','1차 공동일정 확정 필요',`미확정 일정 ${firstPending.length}건이 있습니다.`,'일정 확정','openPositionRoundSchedule',`openPositionRoundSchedule(${positionId},1)`);

    // 안내·완료 업무는 지금 1차 단계에 있는(보류·불합격·다음 단계 이동 제외) 지원자의 면접만 대상으로 한다 —
    // 이미 다음 단계로 넘어갔거나 탈락한 지원자의 미표시 기록 때문에 업무가 계속 남던 문제 방지.
    const cur1 = rows => rows.filter(i => round1CandIds.has(Number(i.candId)));
    const r1c = { confirmed:cur1(r1.confirmed), done:cur1(r1.done), panelNotified:cur1(r1.panelNotified), candidateNotified:cur1(r1.candidateNotified) };
    if(r1c.confirmed.length && r1c.panelNotified.length < r1c.confirmed.length) add('first_panel_notice','medium','1차 면접관 안내 미발송',`확정 ${r1c.confirmed.length}건 중 면접관 안내 미완료`,'면접관 안내','openInterviewNoticeFlow',`openInterviewNoticeFlow(${positionId},1,1)`);
    if(r1c.confirmed.length && r1c.candidateNotified.length < r1c.confirmed.length) add('first_candidate_notice','medium',`1차 면접 ${routeNoticeText} 미발송`,`확정 ${r1c.confirmed.length}건 중 ${routeNoticeText} 미완료`,'안내 발송','sendAllCandSchedule',`sendAllCandSchedule(${positionId},1)`);

    if(r1c.confirmed.length > r1c.done.length) add('first_interview_done','medium','1차 면접 실시 후 완료 처리 필요',`일정 확정 ${r1c.confirmed.length}건 · 완료 ${r1c.done.length}건`,'면접 완료 처리','scrollPositionDetail',`scrollPositionDetail('pp-position-candidates')`);

    // 1차 단계에 남아 있으면 결과가 확정되지 않은 것이다(이전 '판정 저장'만 해 둔 지원자 포함).
    const firstResult = list.filter(c => c.stage === 1);
    if(r1c.done.length && firstResult.length) add('first_result','high','1차 면접 결과 확정 필요',`결과 미확정 ${firstResult.length}명 · 합격/불합격 선택 후 확정`,'결과 입력','openPositionResultModal',`openPositionResultModal(${positionId},1)`);

    if(!short) {
      // 레퍼런스는 2차면접(3)과 병행 진행되는 트랙이라 대상을 stage===3(+레거시 2)으로 잡는다.
      const refReady = list.filter(c => [2,3].includes(c.stage) && requiresReferenceCheck(c) && c.ref === '미시작');
      if(refReady.length) add('reference_request','medium',hasHeadhunting?'레퍼런스 체크 업체 요청 필요':'레퍼런스 체크 요청 필요',`요청 대기 ${refReady.length}명${hasHeadhunting?' · 업체 경유 대상 포함':''}`,'레퍼런스 요청','scrollPositionDetail',`scrollPositionDetail('pp-position-candidates')`);
      const refResend = list.filter(c => [2,3].includes(c.stage) && c.ref === '진행중' && Number(c.refD||0) === 0 && ensureRefDetails(c).length === 0);
      if(refResend.length) add('reference_resend','medium','레퍼런스 재요청 필요',`추천인 미접수 ${refResend.length}명 · ${hasHeadhunting?'업체 경유로':'지원자에게'} 등록 안내를 다시 발송하세요.`,'레퍼런스 재요청','requestPositionReferences',`requestPositionReferences(${positionId})`);
      const refLate = list.filter(c => c.ref === '진행중' && Number(c.refD||0) === 0 && ensureRefDetails(c).length > 0);
      if(refLate.length) add('reference_remind','high','레퍼런스 미응답 독촉 필요',`응답 없음 ${refLate.length}명`,'리마인드','remindRef',`remindRef(${refLate[0].id})`);
      const refIncomplete = list.filter(c => [2,3].includes(c.stage) && requiresReferenceCheck(c) && c.ref !== '완료' && c.ref !== '생략');
      if(refIncomplete.length && !refReady.length && !refResend.length && !refLate.length) add('reference_complete','medium','레퍼런스 완료 확인 필요',`진행중 ${refIncomplete.length}명 · 응답 수집 후 완료 처리`,'레퍼런스 보기','scrollPositionDetail',`scrollPositionDetail('pp-position-candidates')`);

      // 경영진 일정은 확보가 어려워 레퍼런스 완료를 기다리지 않고 먼저 잡는 경우가 많다 —
      // 2차 면접 일정 확정은 레퍼런스 완료 여부와 무관하게 병행 진행할 수 있도록 한다.
      // (단, 실제 면접 전까지는 레퍼런스가 완료·보고되어야 하며, 이는 면접관 안내 발송 시점에 별도 확인한다.)
      const secondReady = list.some(c => [2,3].includes(c.stage));
      if(secondReady && !pos.panel2AvailabilityConfirmedAt && !r2.confirmed.length) add('second_panel_availability','high',pos.panel2AvailabilityRequestedAt?'2차 면접관 가능 일정 회신 확인 필요':'2차 면접관 가능 일정 확인 필요',pos.panel2AvailabilityRequestedAt?panelReplyTaskText_(pos,3):'면접관에게 공통 후보 날짜의 참석 가능 여부를 먼저 확인하세요.','면접관 일정 확인','openCollectSlots',`openCollectSlots(${positionId},3)`);
      if(secondReady && pos.panel2AvailabilityConfirmedAt && !r2.interviews.length) add('second_slots','medium',`2차 지원자 가능일 ${routeNoticeText} 필요`,`면접관 확인이 완료된 일정을 ${hasHeadhunting?'업체 경유로 ':''}안내하세요. 레퍼런스는 면접 전까지 완료되면 됩니다.`,'지원자 가능일 확인','openCollectSlots',`openCollectSlots(${positionId},3)`);
      const round2CandIds = new Set(list.filter(c => [2,3].includes(c.stage)).map(c => Number(c.id)));
      const secondResponded = r2.interviews.filter(i => round2CandIds.has(Number(i.candId)) && ['RESPONDED','UNAVAILABLE'].includes(i.availabilityStatus));
      const secondWaiting = r2.interviews.filter(i => round2CandIds.has(Number(i.candId)) && i.availabilityStatus === 'SENT');
      const secondPending = r2.pending.filter(i => round2CandIds.has(Number(i.candId)));
      if(secondResponded.length && !secondWaiting.length) add('second_schedule','high','2차 면접시간·순서 확정 필요',`가능 시간대 응답 ${secondResponded.length}건 취합 완료`,'일정 확정','openPositionRoundSchedule',`openPositionRoundSchedule(${positionId},3)`);
      else if(secondWaiting.length) add('second_schedule_wait','medium','2차 가능 시간대 응답 대기',`응답완료 ${secondResponded.length}명 · 대기 ${secondWaiting.length}명`,'응답 현황','openCollectSlots',`openCollectSlots(${positionId},3)`);
      else if(secondPending.length) add('second_schedule','high','2차 공동일정 확정 필요',`미확정 ${secondPending.length}건`,'일정 확정','openPositionRoundSchedule',`openPositionRoundSchedule(${positionId},3)`);
      const cur2 = rows => rows.filter(i => round2CandIds.has(Number(i.candId)));
      const r2c = { confirmed:cur2(r2.confirmed), done:cur2(r2.done), panelNotified:cur2(r2.panelNotified), candidateNotified:cur2(r2.candidateNotified) };
      if(r2c.confirmed.length && r2c.panelNotified.length < r2c.confirmed.length) add('second_panel_notice','medium','2차 면접관 안내 미발송','확정된 2차 공동일정을 면접관에게 안내','면접관 안내','openInterviewNoticeFlow',`openInterviewNoticeFlow(${positionId},3,2)`);
      if(r2c.confirmed.length && r2c.candidateNotified.length < r2c.confirmed.length) add('second_candidate_notice','medium',`2차 면접 ${routeNoticeText} 미발송`,`확정된 2차 면접일정을 ${hasHeadhunting?'업체 경유로':'지원자에게'} 안내`,'안내 발송','sendAllCandSchedule',`sendAllCandSchedule(${positionId},3)`);
      // 면접관 안내 후 레퍼런스가 완료된 경우에는 보고서를 별도로 전달하고 완료 여부를 기록한다.
      const refFollowupNeeded = list.filter(c => [3,4].includes(c.stage) && requiresReferenceCheck(c) && c.ref === '완료' && !c.refReportSentAt);
      // 레퍼런스는 2차면접일 전까지 완료돼야 한다(차단하지 않고 경고만). 보고서는 자동 첨부되지 않으므로
      // 완료되면 면접관에게 별도로 전달해야 한다(아래 reference_followup 액션 아이템).
      const refInterviewRisk = list.filter(c => getReferenceInterviewRisk(c));
      if(refInterviewRisk.length) add('reference_before_interview','high','2차면접 전 레퍼런스 완료 필요',`2차면접 ${REF_INTERVIEW_WARN_DAYS}일 이내 · 레퍼런스 미완료 ${refInterviewRisk.length}명 (${refInterviewRisk.slice(0,3).map(c=>c.name).join(', ')})`,'레퍼런스 보기','scrollPositionDetail',`scrollPositionDetail('pp-position-candidates')`);
      if(r2.panelNotified.length && refFollowupNeeded.length) add('reference_followup','medium','레퍼런스 보고서 면접관 전달 필요',`면접관 안내 후 레퍼런스가 완료된 지원자 ${refFollowupNeeded.length}명 · 보고서 별도 전달 후 완료로 표시하세요.`,'레퍼런스 보기','scrollPositionDetail',`scrollPositionDetail('pp-position-candidates')`);
      const secondResult = list.filter(c => c.stage === 3);
      if(r2c.done.length && secondResult.length) add('second_result','high','2차 면접 결과 확정 필요',`결과 미확정 ${secondResult.length}명 · 합격/불합격 선택 후 확정`,'결과 입력','openPositionResultModal',`openPositionResultModal(${positionId},3)`);
    }

    const gradeUnspecified = list.filter(c => [0,1,3,4].includes(Number(c.stage)) && isGradeBandUnspecified(c));
    if(gradeUnspecified.length) add('grade_band_unspecified','high','채용예정 직급군 지정 필요',`직급군 미지정 ${gradeUnspecified.length}명 · 지정 전에는 2차면접·처우협의로 이동할 수 없습니다.`,'포지션 수정','editPosition',`editPosition(${positionId})`);

    const offerStage = list.filter(c => c.stage === 4);
    if(offerStage.length) add('offer_negotiation','medium',hasHeadhunting?'처우협의 업체 확인 필요':'처우협의 결과 입력 필요',`${offerStage.length}명 · ${hasHeadhunting?'업체를 통한 협의 결과를 ':'협의 결과를 '}최종합격/불합격/협의중으로 입력하세요.`,'결과 입력','openPositionResultModal',`openPositionResultModal(${positionId},4)`);

    // 입사 안내는 목표 인원 충족 여부와 관계없이 최종합격자마다 필요하다(예전에는 목표를 채워야만 표시됐다).
    const noticePending = final.filter(c => Number(c.stage) === 5 && !isOnboardNoticeSent_(c));
    if(noticePending.length) add('onboard_pending','high','입사 안내 발송 필요',`최종합격 ${final.length}명 / 목표 ${target}명 · 안내 미발송 ${noticePending.length}명${final.length >= target ? ' · 입사 안내 후 충원완료 처리하세요.' : ''}`,'입사 안내','openOnboardingFromPosition',`openOnboardingFromPosition(${positionId})`);
    if(final.length >= target) {
      // 입사 안내를 보내지 않은 최종합격자가 있으면 칸반의 '안내대기'와 어긋나지 않도록
      // 충원완료 처리보다 안내 발송을 먼저 안내한다.
      if(!noticePending.length) add('fill_complete','high','최종합격자 있음 → 충원완료 처리 필요',`최종합격 ${final.length}명 / 목표 ${target}명 · 포지션을 충원완료로 마감하세요.`,'충원완료 처리','closePosition',`closePosition(${positionId})`);
    }
    else if(final.length && remain > 0) add('partial_fill','low','부분충원 상태',`최종합격 ${final.length}명 · 잔여 seat ${remain}명`,'지원자 추가','addCandToPos',`addCandToPos(${positionId})`);
  }
  // 종료(충원완료·미채용·채용중단) 포지션은 남은 지원자·발송 실패 건까지 모두 종료로 보고 처리 안내를 만들지 않는다.
  // 계속 진행하려면 포지션을 진행중으로 복원하거나 지원자를 다른 포지션으로 옮긴다.

  const pri = { high:0, medium:1, low:2 };
  return items.sort((a,b) => pri[a.priority] - pri[b.priority]);
}

function getPositionProcessStatus(positionId) {
  const d = getPositionProjectData(positionId);
  if(!d) return [];
  const { pos, list, final } = d;
  const short = isShortProcessEtype(pos.etype);
  const r1 = positionRoundData(positionId, 1);
  const r2 = positionRoundData(positionId, 3);
  const refCands = list.filter(c => c.stage >= 2 && c.stage !== 6);
  // 레퍼런스 단계는 대상자(간부급 정규직) 기준으로 판정한다. 대상자가 없으면 '완료'가 아니라 판정 보류다.
  // 2차면접 이상 지원자가 있는데 대상자가 한 명도 없으면(전원 사원급 등) 레퍼런스 단계를 생략으로 표시한다.
  const allRefEligible = list.filter(c => c.stage !== 6 && requiresReferenceCheck(c));
  const refEligible = refCands.filter(requiresReferenceCheck);
  const refSkip = short || (refCands.length > 0 && allRefEligible.length === 0);
  const refAll = test => refEligible.length > 0 && refEligible.every(test);
  const flow = getPositionFlow(pos);
  const activeOrPassed = list.filter(c => c.stage !== 6);
  const allPast = stage => activeOrPassed.length > 0 && activeOrPassed.every(c =>
    flowIndex(c.stage, flow) > flowIndex(stage, flow) || (c.stage !== 0 && Number(c.lastCompletedStage) >= Number(stage))
  );
  const pastInt1 = allPast(1);
  const pastInt2 = !short && allPast(3);
  // 면접 일정이 실제로 확정됐다면(확정·완료 면접 존재) 그 앞 단계(면접관 일정 확인·지원자 가능일 확인)는
  // 끝난 것이다 — '면접관 회신 확인 완료'를 누르지 않았거나 개별 예외 일정으로 잡은 경우에도 '예정'으로 남지 않게 한다.
  const roundScheduled = r => r.confirmed.length > 0 && (!r.candidates.length || r.candidates.every(c => r.confirmed.some(i => Number(i.candId) === Number(c.id))));
  const int1PanelDone = !!pos.panel1AvailabilityConfirmedAt || pastInt1 || r1.confirmed.length > 0;
  const int2PanelDone = !!pos.panel2AvailabilityConfirmedAt || pastInt2 || r2.confirmed.length > 0;
  const checks = [
    { key:'register', title:'지원자 등록', done:list.length > 0, skip:false },
    { key:'int1_panel', title:'1차 면접관 일정 확인', done:int1PanelDone, skip:false },
    { key:'int1_slots', title:'1차 지원자 가능일 확인', done:(int1PanelDone && isRoundAvailabilityComplete(r1)) || pastInt1 || roundScheduled(r1), skip:false },
    // 일정 확정만으로 완료 처리하던 문제 — 확정된 면접 전원에게 지원자·면접관 안내가 모두 나가야 완료다.
    { key:'int1_notice', title:'1차 면접안내', done:isRoundNoticeComplete_(r1) || pastInt1, skip:false },
    { key:'int1_result', title:'1차 면접결과', done:pastInt1, skip:false },
    { key:'ref_req', title:'레퍼런스 체크 요청', done:refAll(c => c.ref !== '미시작'), skip:refSkip },
    // 2차면접이 레퍼런스와 병행 진행되므로 "stage가 2차면접 이상"이라는 사실만으로는
    // 더 이상 레퍼런스 완료를 의미하지 않는다 — 실제 ref 상태로만 판정한다.
    { key:'ref_done', title:'레퍼런스 완료', done:refAll(c => c.ref === '완료' || c.ref === '생략'), skip:refSkip },
    // 완료된 레퍼런스 보고서를 면접관에게 전달했는지(수동 전달 — 자동 첨부하지 않음).
    { key:'int2_panel', title:'2차 면접관 일정 확인', done:int2PanelDone, skip:short },
    { key:'int2_slots', title:'2차 지원자 가능일 확인', done:(int2PanelDone && isRoundAvailabilityComplete(r2)) || pastInt2 || roundScheduled(r2), skip:short },
    { key:'int2_notice', title:'2차 면접안내', done:isRoundNoticeComplete_(r2) || pastInt2, skip:short },
    { key:'int2_result', title:'2차 면접결과', done:pastInt2, skip:short },
    // 처우협의는 협의 중인 지원자가 남아 있으면 끝난 것이 아니다(예전에는 누군가 4단계에 들어가기만 해도 '완료').
    { key:'offer', title:'처우협의', done:final.length > 0 && !list.some(c => c.stage === 4 && !c.held), skip:false },
    { key:'final', title:'최종합격', done:final.length > 0 && !list.some(c => c.stage === 4 && !c.held), skip:false },
    // 입사안내는 최종합격자 전원 기준(입사 처리됐거나 충원완료로 입사 완료 간주된 사람은 완료로 본다).
    { key:'onboard', title:'입사안내', done:final.length > 0 && final.every(isOnboardNoticeSent_), skip:false },
  ];
  const actions = getPositionActionItems(positionId);
  const keyMap = {
    candidate_register:'register',
    first_panel_availability:'int1_panel', first_slots:'int1_slots', first_schedule:'int1_notice', first_schedule_reply:'int1_notice',
    first_panel_notice:'int1_notice', first_candidate_notice:'int1_notice',
    first_interview_done:'int1_result', first_result:'int1_result',
    reference_request:'ref_req', reference_resend:'ref_req', reference_remind:'ref_done', reference_complete:'ref_done',
    second_panel_availability:'int2_panel', second_slots:'int2_slots', second_schedule:'int2_notice',
    second_panel_notice:'int2_notice', second_candidate_notice:'int2_notice',
    second_result:'int2_result', offer_negotiation:'offer', fill_complete:'final', onboard_pending:'onboard'
  };
  // 충원완료·부분충원 마감으로 닫힌 포지션은 남은 단계가 없다 — 생략 단계를 제외하고 모두 완료로 표시한다.
  if(['filled','partial_closed'].includes(d.projectStatus)) checks.forEach(x => { if(!x.skip) x.done = true; });
  // 레퍼런스는 2차 면접과 병행하는 별도 트랙이라, 본 흐름과 레퍼런스 트랙에 각각 '현재 단계'를 둔다
  // (예전에는 레퍼런스 진행 중이면 확정된 2차 면접의 '면접안내'가 '예정'으로 보였다).
  const REF_TRACK = new Set(['ref_req','ref_done']);
  let firstOpen = -1, firstOpenRef = -1;
  checks.forEach((x, i) => {
    if(x.skip || x.done) return;
    // 레퍼런스 트랙은 2차면접(레퍼런스) 단계에 들어간 지원자가 있을 때만 '현재 단계'가 된다.
    // (예전에는 전원 서류합격인데도 레퍼런스 요청이 '현재 단계'라 2차 면접 카드가 '현재 진행'으로 보였다)
    if(REF_TRACK.has(x.key)) { if(firstOpenRef < 0 && refCands.length) firstOpenRef = i; }
    else if(firstOpen < 0) firstOpen = i;
  });
  return checks.map((x, i) => {
    if(x.skip) return { number:i + 1, title:x.title, status:'skipped', label:'생략', key:x.key };
    let status = x.done ? 'complete' : (i === firstOpen || i === firstOpenRef ? 'current' : 'upcoming');
    const action = actions.find(a => keyMap[a.type] === x.key);
    return {
      number:i + 1, title:x.title, status,
      label:status === 'complete' ? '완료' : status === 'current' ? '현재 단계' : status === 'delayed' ? '처리 필요' : '예정',
      key:x.key,
      actionLabel:action ? action.actionLabel : '',
      actionCall:action ? action.actionCall : ''
    };
  });
}

function renderPositionSummary(positionId) {
  const d = getPositionProjectData(positionId);
  if(!d) return '';
  const { pos, target, final, remain, rate, projectStatus, statusLabel, list, active, rejected } = d;
  const owner = pos.owner || pos.manager || '미지정';
  const requested = pos.requestDate || pos.createdAt || '';
  const targetDate = pos.targetDate || pos.dueDate || '미지정';
  const short = isShortProcessEtype(pos.etype);
  return `<section class="pp-section">
    <div class="pp-summary-top">
      <div class="pp-meta" style="margin-top:0"><span>${esc(pos.dept||'부서 미지정')}</span><span>${esc(pos.loc||'근무지 미지정')}</span><span class="etype ${ETYPE_CLS[pos.etype]||''}">${esc(pos.etype||'-')}</span><span>채용사유 ${esc(pos.hireReason||'충원')}</span><span>${esc(pos.role||'-')}</span><span>담당자 ${esc(owner)}</span><span>요청/생성일 ${fmtDate(requested)||'-'}</span><span>목표 충원일 ${fmtDate(targetDate)||esc(targetDate)}</span>${short?'<span style="color:var(--acc);font-weight:650">1차면접 프로세스</span>':''}${!isPositionOpen_(pos) && (pos.closeReason || pos.closeMemo) ? `<span style="color:var(--t2);font-weight:650">종료 사유 ${esc([pos.closeReason, pos.closeMemo].filter(Boolean).join(' · '))}</span>` : ''}</div>
      <div style="text-align:right"><span class="pp-status ${projectStatus}">${statusLabel}</span></div>
    </div>
    <div class="pp-kpis">
      <div class="pp-kpi"><div class="pp-kpi-val">${target}<small>명</small></div><div class="pp-kpi-lbl">채용목표</div></div>
      <div class="pp-kpi"><div class="pp-kpi-val" style="color:var(--green)">${final.length}<small>명</small></div><div class="pp-kpi-lbl">최종합격 (충원 seat)</div></div>
      <div class="pp-kpi"><div class="pp-kpi-val" style="color:${remain?'var(--amber)':'var(--green)'}">${remain}<small>명</small></div><div class="pp-kpi-lbl">미충원 seat</div></div>
      <div class="pp-kpi"><div class="pp-kpi-val">${rate}<small>%</small></div><div class="pp-kpi-lbl">충원율</div></div>
      <div class="pp-kpi"><div class="pp-kpi-val">${active.length}<small>명</small></div><div class="pp-kpi-lbl">진행중 지원자</div></div>
      <div class="pp-kpi"><div class="pp-kpi-val">${rejected.length}<small>명</small></div><div class="pp-kpi-lbl">불합격/종료</div></div>
    </div>
    <div class="pp-fillbar"><span style="width:${rate}%"></span></div>
  </section>`;
}

// 완료된 업무 중 결과를 다시 볼 수 있는 항목 → 조회용 작업 키
const PROCESS_REVIEW_TASKS_ = { int1_panel:'int1_panel_review', int2_panel:'int2_panel_review' };

function renderPositionProcessChecklist(positionId) {
  const d = getPositionProjectData(positionId);
  const steps = getPositionProcessStatus(positionId);
  const byKey = key => steps.find(s => s.key === key);
  const mergeTask = (title, keys, actionKey) => {
    const items = keys.map(byKey).filter(Boolean);
    const status = items.every(x=>x.status==='skipped') ? 'skipped'
      : items.every(x=>x.status==='complete'||x.status==='skipped') ? 'complete'
      : items.some(x=>x.status==='delayed') ? 'delayed'
      : items.some(x=>x.status==='current') ? 'current' : 'upcoming';
    return { title, actionKey, status, label:status==='complete'?'완료':status==='current'?'진행중':status==='delayed'?'지연':status==='skipped'?'생략':'예정' };
  };
  const refResendNeeded = d && d.list.some(c => [2,3].includes(c.stage) && c.ref==='진행중' && Number(c.refD||0)===0 && ensureRefDetails(c).length===0);
  const refRequestTitle = refResendNeeded ? '레퍼런스 재요청' : '레퍼런스 요청';
  // 레퍼런스는 더 이상 별도 카드가 아니라 2차 면접과 병행되는 체크리스트 항목이다.
  const groups = [
    { title:'서류합격', stage:0, tasks:[mergeTask('지원자 등록',['register'],'candidate_register')] },
    { title:'1차 면접', stage:1, tasks:[mergeTask('면접관 일정 확인',['int1_panel'],'int1_panel'),mergeTask('지원자 가능일 확인',['int1_slots'],'int1_slots'),mergeTask('면접안내',['int1_notice'],'int1_notice'),mergeTask('면접결과',['int1_result'],'int1_result')] },
    { title:'2차 면접', stage:3, tasks:[mergeTask('면접관 일정 확인',['int2_panel'],'int2_panel'),mergeTask('지원자 가능일 확인',['int2_slots'],'int2_slots'),mergeTask('면접안내',['int2_notice'],'int2_notice'),mergeTask(refRequestTitle,['ref_req'],'ref_request'),mergeTask('레퍼런스 완료',['ref_done'],'ref_complete'),mergeTask('면접결과',['int2_result'],'int2_result')] },
    { title:'처우협의', stage:4, tasks:[mergeTask('처우협의 및 결과 판단',['offer','final'],'offer_decision'),mergeTask('입사안내',['onboard'],'onboard')] },
  ];
  const flow = d ? getPositionFlow(d.pos) : FLOW;
  const candidateFlowIndexes = d ? d.list
    .filter(c => Number(c.stage) !== 6 && !c.held)
    .map(c => flowIndex(Number(c.stage), flow))
    .filter(idx => idx >= 0) : [];
  const alignGroupStatusWithCandidates = (groupStatus, groupStage) => {
    // A completed workflow group must not become current again just because a
    // candidate still carries that group's stage value.
    const targetIndex = flow.indexOf(groupStage);
    // 서류합격은 등록만 되면 업무가 끝나지만, 지원자가 아직 서류합격에 있으면 그 카드가 현재 단계다.
    if(targetIndex === 0 && candidateFlowIndexes.some(idx => idx === 0)) return 'current';
    if(groupStatus === 'complete' || groupStatus === 'skipped') return groupStatus;
    if(targetIndex < 0 || !candidateFlowIndexes.length) return groupStatus;
    // 아직 아무도 이 단계에 오지 않았는데 준비 업무(면접관 일정 확인 등)만 시작된 경우 — '현재 진행'이 아니라 '준비 중'.
    if(candidateFlowIndexes.every(idx => idx < targetIndex) && ['current','delayed','active'].includes(groupStatus)) return 'preparing';
    if(candidateFlowIndexes.every(idx => idx > targetIndex)) return 'complete';
    if(candidateFlowIndexes.some(idx => idx === targetIndex)) return groupStatus === 'delayed' ? 'delayed' : 'current';
    if(candidateFlowIndexes.some(idx => idx > targetIndex)) return groupStatus === 'delayed' ? 'delayed' : 'active';
    return groupStatus;
  };
  const shortNote = d && isShortProcessEtype(d.pos.etype)
    ? `<div class="pp-process-note">${esc(d.pos.etype)} 채용은 1차 면접까지만 진행합니다. 레퍼런스·2차 면접 항목은 생략됩니다.</div>`
    : '';
  return `<section class="pp-section" id="pp-position-process"><div class="pp-section-h"><div><div class="pp-section-title">프로세스 진행현황</div></div></div>
    ${shortNote}
    <div class="pp-process-groups">${groups.map(g=>{
      const tasks = g.tasks;
      const activeTasks = tasks.filter(s=>s.status!=='skipped');
      const taskGroupStatus = !activeTasks.length ? 'skipped'
        : activeTasks.every(s=>s.status==='complete') ? 'complete'
        : activeTasks.some(s=>s.status==='delayed') ? 'delayed'
        : activeTasks.some(s=>s.status==='current') ? 'current'
        : activeTasks.some(s=>s.status==='complete') ? 'active' : 'upcoming';
      const groupStatus = alignGroupStatusWithCandidates(taskGroupStatus, g.stage);
      const groupStatusLabel = groupStatus==='complete'?'완료':groupStatus==='current'?'현재 진행':groupStatus==='delayed'?'현재 진행':groupStatus==='preparing'?'준비 중':groupStatus==='active'?'진행 보유':groupStatus==='skipped'?'생략':'예정';
      const groupClass = groupStatus === 'preparing' ? 'active' : groupStatus;
      const targetIndex = flow.indexOf(g.stage);
      const fromStage = targetIndex > 0 ? flow[targetIndex-1] : -1;
      const moveCount = fromStage >= 0 ? d.list.filter(c=>c.stage===fromStage).length : 0;
      const moveButton = g.stage > 0 && groupStatus!=='skipped' && moveCount ? `<button class="btn btn-xs pp-group-move" title="${moveCount}명을 ${g.title} 단계로 이동" data-action="call" data-call="event.stopPropagation();changePositionProcessStage(${positionId},${g.stage})">다음</button>` : '';
      return `<div class="pp-process-group ${groupClass}"><div class="pp-group-head" data-action="call" data-call="togglePositionProcessGroup(this)" title="클릭하여 세부 업무 보기"><span class="pp-group-status"></span><span class="pp-group-title">${g.title}</span><span class="pp-group-count">${groupStatusLabel}</span>${moveButton}</div>
        <div class="pp-group-tasks">${tasks.map(s=>{ const reviewKey = s.status==='complete' && PROCESS_REVIEW_TASKS_[s.actionKey]; const clickable = (s.status!=='skipped' && s.status!=='complete') || !!reviewKey; const callKey = reviewKey || s.actionKey; return `<div class="pp-task ${s.status}${clickable?' actionable':''}" ${reviewKey?'title="클릭하면 회신 내역을 볼 수 있습니다"':''} ${clickable?`data-action="call" data-call="executePositionProcessTask(${positionId},'${callKey}')"`:''}><span class="pp-task-dot"></span><span class="pp-task-title">${esc(s.title)}</span><span class="pp-task-state">${s.label}</span></div>`; }).join('')}</div>
      </div>`;
    }).join('')}</div>
  </section>`;
}

function togglePositionProcessGroup(button) {
  const group = button && button.closest('.pp-process-group');
  if(group) group.classList.toggle('open');
}

function getPositionStageMoveBlockers(positionId, fromStage, toStage) {
  const targets = candidates.filter(c =>
    Number(c.posId) === Number(positionId) &&
    Number(c.stage) === Number(fromStage) &&
    !c.held
  );
  const blockers = [];
  const add = (label, list) => {
    if(!list.length) return;
    blockers.push({
      label,
      count:list.length,
      names:list.map(c=>c.name || `지원자 ${c.id}`)
    });
  };

  if(fromStage === 1 || fromStage === 3) {
    const round = fromStage === 1 ? '1차' : '2차';
    const interviewFor = c => interviews.find(i =>
      Number(i.candId) === Number(c.id) && i.type === round
    );
    add('일정 미확정', targets.filter(c => !hasConfirmedRoundSchedule(c.id, fromStage)));
    add('지원자 안내 미완료', targets.filter(c => !interviewFor(c)?.candidateNotified));
    add('면접관 안내 미완료', targets.filter(c => !interviewFor(c)?.panelNotified));
    add('결과 미입력', targets.filter(c => {
      const itv = interviewFor(c);
      return !c.decision && !itv?.result;
    }));
    add('불합격 판정 포함', targets.filter(c => {
      const result = c.decision || interviewFor(c)?.result || '';
      return result === 'fail' || result === '불합격';
    }));
  }

  // 직급군 미지정이면 레퍼런스 대상 여부를 정할 수 없으므로 2차면접(1→3)·처우협의(3→4) 이동 전에 지정하게 한다.
  if(fromStage === 1 || fromStage === 3) {
    add('채용예정 직급군 미지정', targets.filter(isGradeBandUnspecified));
  }

  // 레퍼런스는 2차면접과 병행 진행되므로 2차면접 진입 자체는 막지 않는다. 대신 처우협의로
  // 넘어가기 직전(3→4)에 완료(또는 생략 승인) 여부를 확인한다.
  if(fromStage === 3) {
    add('레퍼런스 미완료', targets.filter(c => requiresReferenceCheck(c) && c.ref !== '완료' && c.ref !== '생략'));
  }

  // (레거시 호환) 마이그레이션 전 남아있는 레퍼런스(2) 단계 레코드가 그룹 이동을 시도할 때도
  // 동일하게 완료 여부를 확인한다 — 새 FLOW는 2를 거치지 않으므로 실사용은 거의 없다.
  if(fromStage === 2) {
    add('레퍼런스 미완료', targets.filter(c => {
      const required = Number(c.refT) || 0;
      const responded = Number(c.refD) || 0;
      return c.ref !== '완료' || required <= 0 || responded < required;
    }));
  }

  if(fromStage === 4 && toStage === 5) {
    add('처우협의 결과 미입력', targets.filter(c => c.decision !== 'pass'));
  }

  return { ok:blockers.length === 0, targets, blockers };
}

// 단계 이동이 차단됐을 때 사유를 모달로 보여준다 (예전엔 alert() 텍스트였다).
let stageGateCtx = { positionId:null };

function openStageGateModal(positionId, fromStage, toStage, check) {
  stageGateCtx = { positionId };
  const total = check.targets.length;
  const summary = document.getElementById('sg-summary');
  if(summary) summary.innerHTML = `<b>${esc(stageLabel(fromStage))}</b> 단계의 필수 업무가 모두 완료되지 않아 <b>${esc(stageLabel(toStage))}</b> 단계로 이동할 수 없습니다. 아래 미완료 업무를 처리한 후 다시 시도하세요.`;
  const wrap = document.getElementById('sg-blockers');
  if(wrap) wrap.innerHTML = check.blockers.map(item => {
    const completed = Math.max(0, total - item.count);
    const names = item.names.slice(0, 5).join(', ');
    const more = item.names.length > 5 ? ` 외 ${item.names.length - 5}명` : '';
    return `<div style="padding:10px 12px;border:1px solid var(--rbd);border-radius:var(--rsm);background:var(--rbg)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:13px;color:var(--red)">
        <span>! ${esc(item.label)}</span><span style="flex-shrink:0">${completed}/${total}</span>
      </div>
      <div style="font-size:12px;color:var(--t2);margin-top:4px">${esc(names)}${esc(more)}</div>
    </div>`;
  }).join('');
  openModal('modal-stage-gate');
}

function focusStageGateBlockers() {
  const positionId = stageGateCtx.positionId;
  closeModal('modal-stage-gate');
  if(positionId == null) return;
  openPosDetail(Number(positionId));
  setTimeout(() => scrollPositionDetail('pp-position-candidates'), 300);
}

async function changePositionProcessStage(positionId, toStage) {
  const pos = positions.find(p => Number(p.id) === Number(positionId));
  if(!pos) return;
  const flow = getPositionFlow(pos);
  const targetIndex = flow.indexOf(Number(toStage));
  if(targetIndex <= 0) return;
  const fromStage = flow[targetIndex - 1];
  const targets = candidates.filter(c => Number(c.posId) === Number(positionId) && c.stage === fromStage);
  if(!targets.length) {
    toast(`${stageLabel(fromStage)} 단계에 이동할 지원자가 없습니다.`, 'tinfo');
    return;
  }
  const completionCheck = getPositionStageMoveBlockers(positionId, fromStage, Number(toStage));
  if(!completionCheck.ok) {
    openStageGateModal(positionId, fromStage, Number(toStage), completionCheck);
    return;
  }
  await batchStageChange(positionId, fromStage, Number(toStage));
  refreshOpenPositionDetail(positionId);
}

async function executePositionProcessTask(positionId, actionKey) {
  const d = getPositionProjectData(positionId);
  if(!d) return;
  const round = actionKey.startsWith('int1') ? 1 : actionKey.startsWith('int2') ? 2 : 0;
  const stageIdx = round === 1 ? 1 : round === 2 ? 3 : -1;
  if(actionKey === 'candidate_register') return addCandToPos(positionId);
  if(actionKey === 'int1_panel' || actionKey === 'int2_panel') return openCollectSlots(positionId, stageIdx);
  if(actionKey === 'int1_panel_review' || actionKey === 'int2_panel_review') return openPanelAvailabilityReview_(positionId, stageIdx);
  if(actionKey === 'int1_slots' || actionKey === 'int2_slots') {
    const roundData = positionRoundData(positionId, stageIdx);
    return isRoundAvailabilityComplete(roundData)
      ? openPositionRoundSchedule(positionId, stageIdx)
      : openCollectSlots(positionId, stageIdx);
  }
  if(actionKey === 'int1_confirm' || actionKey === 'int2_confirm') return openPositionRoundSchedule(positionId, stageIdx);
  if(actionKey === 'int1_notice' || actionKey === 'int2_notice') {
    const roundData = positionRoundData(positionId, stageIdx);
    if(!roundData.confirmed.length) return openPositionRoundSchedule(positionId, stageIdx);
    return openInterviewNoticeFlow(positionId, stageIdx, round);
  }
  if(actionKey === 'int1_done' || actionKey === 'int2_done') return completePositionInterviews(positionId, stageIdx);
  if(actionKey === 'int1_result' || actionKey === 'int2_result') return openPositionResultModal(positionId, stageIdx);
  if(actionKey === 'ref_request') return requestPositionReferences(positionId);
  if(actionKey === 'ref_complete') return completePositionReferences(positionId);
  if(actionKey === 'offer') return changePositionProcessStage(positionId, 4);
  if(actionKey === 'offer_decision') {
    if(d.list.some(c=>c.stage===4)) return openPositionResultModal(positionId,4);
    const flow=getPositionFlow(d.pos);
    const offerIndex=flow.indexOf(4);
    const previousStage=offerIndex>0?flow[offerIndex-1]:-1;
    if(previousStage>=0 && d.list.some(c=>c.stage===previousStage)) return changePositionProcessStage(positionId,4);
    return toast(d.list.some(c=>[5,7].includes(Number(c.stage))) ? '처우협의 결과가 이미 확정되었습니다.' : '처우협의로 넘길 지원자가 없습니다. 이전 단계 결과를 먼저 확정해 주세요.','tinfo');
  }
  if(actionKey === 'final') return openPositionResultModal(positionId, 4);
  if(actionKey === 'onboard') return openOnboardingFromPosition(positionId);
}

let positionResultCtx = { positionId:null, stageIdx:null };

function openPositionResultModal(positionId, stageIdx) {
  const pos = positions.find(p=>Number(p.id)===Number(positionId));
  const list = candidates.filter(c=>Number(c.posId)===Number(positionId)&&c.stage===Number(stageIdx));
  if(!pos || !list.length) { toast(stageIdx===4?'결과를 입력할 처우협의 대상자가 없습니다.':'결과를 입력할 면접 대상자가 없습니다.', 'tinfo'); return; }
  positionResultCtx = { positionId:Number(positionId), stageIdx:Number(stageIdx) };
  const isFinal = Number(stageIdx) === 4;
  document.getElementById('pr-title').textContent = `${isFinal?'처우협의 결과 입력':stageLabel(stageIdx)+' 결과 입력'} — ${pos.title} (${list.length}명)`;
  const help=document.getElementById('pr-help');
  if(help) help.textContent=isFinal
    ? '지원자별 처우협의 결과를 선택하세요. 최종합격자는 충원 seat에 반영된 후 입사 안내 화면으로 이어지고, 불합격자는 전형 종료되며, 협의중인 지원자는 처우협의 단계에 남습니다.'
    : `지원자별 결과를 선택하세요. 확정하면 합격자는 ${josa_(STAGES[nextFlowStage(Number(stageIdx), positionId)] || '다음 단계','으로','로')}, 불합격자는 전형 종료로 바로 반영됩니다. 미정인 지원자는 현재 단계에 남습니다.`;
  // 결과는 '확정' 한 번으로 반영한다. (예전 '판정 저장'은 단계 이동 없이 판정만 남겨, 처리 필요 목록에서
  // '결과 입력'이 사라진 채 지원자가 단계에 멈춰 있는 중간 상태를 만들었다)
  const confirmBtn=document.getElementById('pr-confirm-btn');
  if(confirmBtn) confirmBtn.textContent=isFinal?'처우협의 결과 확정':'결과 확정';
  document.getElementById('pr-list').innerHTML = list.map(c=>`
    <div style="display:grid;grid-template-columns:minmax(150px,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-size:12.5px;font-weight:700">${esc(c.name)}${headhunterSearchPill(c)}</div>
        <div style="font-size:10.5px;color:var(--t3)">${esc(c.email||'-')}</div>
        ${isFinal?`<label style="display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11px;color:var(--t2);font-weight:700">입사예정일 <input class="pr-join-date" data-cand-id="${c.id}" type="date" value="${esc(getCandidateJoinDate(c))}" style="height:28px;width:132px;border:1px solid var(--border2);border-radius:6px;padding:0 7px;font-size:11px"></label>`:''}
      </div>
      <div style="display:flex;gap:5px">
        <label class="btn btn-sm ${c.decision==='pass'?'btn-fill-green':''}" style="cursor:pointer"><input type="radio" name="pr-${c.id}" value="pass" ${c.decision==='pass'?'checked':''} style="display:none" data-onchange="selectPositionResult(this)">${isFinal?'최종합격':'합격'}</label>
        <label class="btn btn-sm ${c.decision==='fail'?'btn-fill-red':''}" style="cursor:pointer"><input type="radio" name="pr-${c.id}" value="fail" ${c.decision==='fail'?'checked':''} style="display:none" data-onchange="selectPositionResult(this)">불합격</label>
        <label class="btn btn-sm ${!c.decision?'btn-primary':''}" style="cursor:pointer"><input type="radio" name="pr-${c.id}" value="" ${!c.decision?'checked':''} style="display:none" data-onchange="selectPositionResult(this)">${isFinal?'협의중':'미정'}</label>
      </div>
    </div>`).join('');
  openModal('modal-position-result');
}

function selectPositionResult(input) {
  document.querySelectorAll(`input[name="${input.name}"]`).forEach(r=>{
    const label = r.closest('label');
    if(!label) return;
    label.classList.remove('btn-fill-green','btn-fill-red','btn-primary');
    if(r.checked) label.classList.add(r.value==='pass'?'btn-fill-green':r.value==='fail'?'btn-fill-red':'btn-primary');
  });
}

async function savePositionResults(confirmAndMove) {
  const { positionId, stageIdx } = positionResultCtx;
  const list = candidates.filter(c=>Number(c.posId)===Number(positionId)&&c.stage===Number(stageIdx));
  list.forEach(c=>{
    const selected = document.querySelector(`input[name="pr-${c.id}"]:checked`);
    c.decision = selected ? selected.value : '';
    if(Number(stageIdx) === 4 && c.decision === 'pass') {
      const joinInput = document.querySelector(`.pr-join-date[data-cand-id="${c.id}"]`);
      c.joinDate = joinInput ? joinInput.value || '' : c.joinDate || '';
    }
  });
  if(confirmAndMove) {
    if(!list.some(c => c.decision === 'pass' || c.decision === 'fail')) {
      toast(Number(stageIdx) === 4 ? '최종합격 또는 불합격을 선택한 지원자가 없습니다.' : '합격 또는 불합격을 선택한 지원자가 없습니다.', 'tw');
      return;
    }
    closeModal('modal-position-result');
    return confirmStageDecisions(positionId, stageIdx, {skipConfirm:true});
  }
  saveState();
  if(GS_CONFIG.scriptUrl) await settleSync(list.map(c=>()=>syncCandToGS(c)), stageIdx===4?'처우협의 결과 저장 동기화':'면접 결과 저장 동기화');
  closeModal('modal-position-result');
  refreshOpenPositionDetail(positionId);
}

async function completePositionInterviews(positionId, stageIdx) {
  const round = stageIdx === 1 ? '1차' : '2차';
  const ids = new Set(candidates.filter(c=>Number(c.posId)===Number(positionId)&&c.stage===stageIdx).map(c=>Number(c.id)));
  const targets = interviews.filter(i=>ids.has(Number(i.candId))&&i.type===round&&i.status==='confirmed');
  if(!targets.length) { toast('완료 처리할 확정 면접이 없습니다.', 'tinfo'); return; }
  const confirmed = await confirmActionModal({
    title:`${round} 면접 완료 처리`,
    message:`확정된 ${round} 면접 ${targets.length}건을 완료 상태로 변경합니다.`,
    items:targets.map(i => `${i.candName} · ${fmtItv(i.date)}`),
    confirmLabel:`${targets.length}건 완료 처리`,
  });
  if(!confirmed) return;
  targets.forEach(i=>{ i.status='done'; });
  saveState();
  if(GS_CONFIG.scriptUrl) await settleSync(targets.map(i=>()=>syncIntToGS(i)), `${round} 면접 완료 동기화`);
  refreshOpenPositionDetail(positionId); renderDashboard();
}

async function requestPositionReferences(positionId) {
  const targets = candidates.filter(c =>
    Number(c.posId) === Number(positionId) &&
    [2,3].includes(c.stage) &&
    (c.ref === '미시작' || (c.ref === '진행중' && Number(c.refD || 0) === 0))
  );
  if(!targets.length) { toast('레퍼런스를 요청할 지원자가 없습니다. (2차면접 단계 중 아직 요청하지 않았거나 추천인 등록이 없는 지원자가 대상입니다)', 'tinfo'); return; }
  const resendCount = targets.filter(c => c.ref === '진행중').length;
  const confirmed = await confirmActionModal({
    title:'레퍼런스 체크 안내 발송',
    message:`지원자 ${targets.length}명에게 추천인 등록 안내를 발송합니다.`,
    items:[...targets.map(c => `${c.name} · ${c.email || '이메일 없음'}`), ...(resendCount ? [`재요청 ${resendCount}명은 기존 진행 상태 유지`] : [])],
    confirmLabel:`${targets.length}명에게 발송`,
  });
  if(!confirmed) return;
  for(const c of targets) {
    referenceSendingIds.add(c.id);
    refreshOpenPositionDetail(positionId);
    await startRef(c.id, c.ref === '진행중');
    referenceSendingIds.delete(c.id);
  }
  refreshOpenPositionDetail(positionId);
}

async function completePositionReferences(positionId) {
  const targets = candidates.filter(c=>Number(c.posId)===Number(positionId)&&[2,3].includes(c.stage)&&c.ref==='진행중');
  if(!targets.length) { toast('완료 처리할 레퍼런스 진행 건이 없습니다.', 'tinfo'); return; }
  const eligible = targets.filter(c => ensureRefDetails(c).length > 0);
  if(!eligible.length) { toast('아직 등록된 추천인이 없어 완료 처리할 수 없습니다. 추천인 등록·응답을 기다려 주세요.', 'terr'); return; }
  const confirmed = await confirmActionModal({
    title:'레퍼런스 완료 처리',
    message:`지원자 ${eligible.length}명의 레퍼런스를 완료 상태로 변경합니다.`,
    items:eligible.map(c => `${c.name} · 응답 ${c.refD || 0}/${c.refT || 3}명`),
    confirmLabel:`${eligible.length}명 완료 처리`,
  });
  if(!confirmed) return;
  eligible.forEach(c=>{ c.ref='완료'; c.refD=c.refT; refDetails[c.id].forEach(r=>r.status='응답'); });
  saveState();
  if(GS_CONFIG.scriptUrl) await settleSync(eligible.map(c=>()=>syncCandToGS(c)), '레퍼런스 완료 동기화');
  refreshOpenPositionDetail(positionId); updateMetrics();
}

function renderPositionCandidates(positionId) {
  const d = getPositionProjectData(positionId);
  if(!d) return '';
  const short = isShortProcessEtype(d.pos.etype);
  const sorted = d.list.slice().sort((a,b)=>a.stage-b.stage||(a.name||'').localeCompare(b.name||'','ko'));
  const row = c => {
    const round = c.stage===1?'1차':c.stage===3?'2차':'';
    const itv = round ? interviews.find(i=>Number(i.candId)===Number(c.id)&&i.type===round) : null;
    const intState = !round ? '-' : !itv ? '미등록' : itv.status==='done'?'면접완료':itv.status==='confirmed'?'일정확정':'회신대기';
    const notice = itv ? (itv.candNotified?'지원자 발송완료':'미발송') : (c.notified?'발송':'-');
    const refSending = referenceSendingIds.has(c.id);
    const refCell = short ? '<div class="pp-cand-cell pp-secondary"><strong>레퍼런스</strong>해당없음</div>' : `<div class="pp-cand-cell pp-secondary"><strong>레퍼런스</strong>${refSending?'발송중':`${esc(c.ref||'미시작')}${c.refT?` ${c.refD||0}/${c.refT}`:''}`}</div>`;
    const dec = c.decision ? (c.decision==='pass'?' · 합격표시':' · 불합격표시') : '';
    return `<div class="pp-cand">
      <div><div class="pp-cand-name">${esc(c.name)}${headhunterSearchPill(c)}</div><div class="pp-cand-email">${esc(c.email||'-')}</div></div>
      <div class="pp-cand-cell"><strong>현재 단계</strong>${stageLabel(c.stage)}${dec}${Number(c.stage)===5?`<br>${esc(getCandidateJoinDateLabel(c))}`:''}</div>
      <div class="pp-cand-cell"><strong>면접일정</strong>${intState}${itv&&itv.date?` · ${fmtItv(itv.date)}`:''}</div>
      ${refCell}
      <div class="pp-cand-cell pp-secondary"><strong>안내 발송</strong>${notice}</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap"><button class="btn btn-xs" data-action="open-candidate" data-id="${c.id}">개별 처리</button><button class="btn btn-xs" data-action="edit-candidate" data-id="${c.id}">수정</button></div>
    </div>`;
  };
  return `<section class="pp-section" id="pp-position-candidates"><div class="pp-section-h"><div><div class="pp-section-title">지원자 현황</div><div class="pp-section-sub">개별 지원자 상태 확인 및 예외 처리</div></div><button class="btn btn-sm btn-primary" data-action="call" data-call="addCandToPos(${positionId})">+ 지원자 추가</button></div>
    <div class="pp-cand-list">${sorted.length?sorted.map(row).join(''):'<div class="empty">이 포지션에 연결된 지원자가 없습니다. 지원자를 추가해 채용 프로세스를 시작하세요.</div>'}</div>
  </section>`;
}

function scrollPositionDetail(id) {
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}

let currentPosDetailId = null;

function alignCandidateStagesWithStartedInterview_(positionId) {
  const pos = positions.find(p => Number(p.id) === Number(positionId));
  if(!pos) return [];
  const moved = [];
  const rules = [
    { started:!!pos.panel1AvailabilityRequestedAt, from:0, to:1 },
    { started:!!pos.panel2AvailabilityRequestedAt, from:2, to:3, eligible:c => c.ref === '완료' || c.ref === '생략' },
  ];
  rules.forEach(rule => {
    if(!rule.started) return;
    candidates
      .filter(c => Number(c.posId) === Number(positionId) && Number(c.stage) === rule.from && (!rule.eligible || rule.eligible(c)))
      .forEach(c => {
        preserveCompletedStage(c, rule.from);
        c.stage = rule.to;
        c.decision = '';
        syncReferralFromCandidate(c);
        moved.push(c);
      });
  });
  if(moved.length) saveState();
  return moved;
}

// 포지션 상세를 열 때만 단계를 맞추면 대시보드 칸반에는 상세를 열기 전까지 이전 단계로
// 보인다. 그래서 데이터 로드 직후에도 진행중 포지션 전체에 대해 한 번 맞추고 동기화한다.
function alignStartedInterviewStagesForActivePositions_() {
  const moved = positions
    .filter(p => isPositionOpen_(p))
    .flatMap(p => alignCandidateStagesWithStartedInterview_(p.id));
  if(moved.length && GS_CONFIG.scriptUrl) settleSync(moved.map(c => () => syncCandToGS(c)), '면접 진행단계 동기화');
  return moved;
}

// 지원자를 등록·수정한 직후 호출 — 이미 면접이 시작된 포지션이면 그 지원자도 바로 해당 단계로 맞춘다.
// 대상 지원자는 호출한 쪽에서 동기화하므로, 함께 맞춰진 다른 지원자만 여기서 동기화한다.
function alignStartedInterviewStagesAfterCandidateSave_(cand) {
  if(!cand || cand.posId == null) return false;
  const before = Number(cand.stage);
  const others = alignCandidateStagesWithStartedInterview_(cand.posId).filter(c => c !== cand);
  if(others.length && GS_CONFIG.scriptUrl) settleSync(others.map(c => () => syncCandToGS(c)), '면접 진행단계 동기화');
  return Number(cand.stage) !== before;
}

function openPosDetail(positionId) {
  currentPosDetailId = Number(positionId);
  const aligned = alignCandidateStagesWithStartedInterview_(currentPosDetailId);
  nav('posdetail');
  renderPosDetailSection(currentPosDetailId);
  if(aligned.length && GS_CONFIG.scriptUrl) {
    settleSync(aligned.map(c => () => syncCandToGS(c)), '면접 진행단계 동기화')
      .then(() => refreshOpenPositionDetail(currentPosDetailId));
  }
  window.scrollTo(0, 0);
}

async function posdetailClosePos(positionId) {
  const pos = positions.find(p => Number(p.id) === Number(positionId));
  if(!pos) return;
  const prevStatus = pos.status;
  const prevClosedAt = pos.closedAt;
  await closePosition(positionId);
  if(pos.status !== prevStatus || pos.closedAt !== prevClosedAt) nav('position');
}

async function posdetailStopPos(positionId) {
  const pos = positions.find(p => Number(p.id) === Number(positionId));
  if(!pos) return;
  const prevStatus = pos.status;
  const prevClosedAt = pos.closedAt;
  await stopPosition(positionId);
  if(pos.status !== prevStatus || pos.closedAt !== prevClosedAt) nav('position');
}

async function posdetailDeletePos(positionId) {
  const beforeCount = positions.length;
  await deletePosition(positionId);
  if(positions.length < beforeCount) nav('position');
}

function renderPosDetailSection(positionId) {
  const d = getPositionProjectData(positionId);
  if(!d) {
    const body = document.getElementById('posdetail-body');
    if(body) body.innerHTML = '<div style="padding:40px;text-align:center;color:var(--t3)">포지션 정보를 불러올 수 없습니다.</div>';
    return;
  }
  const title = document.getElementById('posdetail-title');
  if(title) title.textContent = (d.pos.dept ? d.pos.dept + ' · ' : '') + d.pos.title;
  const body = document.getElementById('posdetail-body');
  if(body) body.innerHTML = `<div class="pos-project">
    ${renderPositionSummary(positionId)}
    ${renderPositionProcessChecklist(positionId)}
    ${renderPositionCandidates(positionId)}
  </div>`;
  const footer = document.getElementById('posdetail-ft');
  if(footer) footer.innerHTML = renderPosDetailOperations(positionId);
}

function renderPosDetailOperations(positionId) {
  const d = getPositionProjectData(positionId);
  if(!d) return '';
  const active = d.isOpen;
  return `<div class="pp-footer-group"><span class="pp-footer-label">보조</span><button class="btn btn-sm" data-action="call" data-call="nav('position')">← 목록으로</button></div>
    <div class="pp-footer-group"><span class="pp-footer-label">관리</span><button class="btn btn-sm" data-action="call" data-call="editPosition(${positionId})">수정</button><button class="btn btn-sm btn-red" data-action="call" data-call="posdetailDeletePos(${positionId})">삭제</button></div>
    <div class="pp-footer-group" style="margin-left:auto"><span class="pp-footer-label">주요 처리</span>${active
      ? `<button class="btn btn-sm btn-green" data-action="call" data-call="posdetailClosePos(${positionId})">충원완료</button><button class="btn btn-sm" style="color:var(--amber)" data-action="call" data-call="nohirePosition(${positionId})">미채용 완료</button><button class="btn btn-sm" data-action="call" data-call="posdetailStopPos(${positionId})">채용 중단</button>`
      : `<button class="btn btn-sm" data-action="call" data-call="reopenPosition(${positionId});nav('position')">진행중으로 복원</button>`}</div>`;
}

// 포지션 상세 section이 지금 이 포지션을 보여주고 있을 때만 다시 그린다.
// 다른 화면을 보고 있거나 다른 포지션 상세를 보는 중이면 아무 것도 하지 않는다.
// 처리 필요 업무 카드에 면접관 회신 현황을 보여준다(실시간 변경 반영으로 채워지는 캐시 기준).
function panelReplyTaskText_(pos, stageIdx) {
  const fallback = '면접관 회신을 확인한 뒤 지원자 가능일 확인을 진행하세요.';
  const cached = typeof panelAvailabilityCache !== 'undefined' ? panelAvailabilityCache[panelAvailabilityCacheKey(pos.id, stageIdx)] : null;
  if(!Array.isArray(cached)) return fallback;
  const panelists = parsePanelists(pos[stageIdx === 1 ? 'panel1' : 'panel2']).filter(p => p.email);
  if(!panelists.length) return fallback;
  const byEmail = new Map(cached.map(r => [String(r.panelistEmail || '').toLowerCase(), r]));
  const replied = panelists.filter(p => ['RESPONDED','UNAVAILABLE'].includes(byEmail.get(String(p.email).toLowerCase())?.status)).length;
  return replied === panelists.length
    ? `면접관 응답 ${replied}/${panelists.length} 완료 · 공통 일정을 선택하고 [면접관 일정 확정]을 눌러주세요.`
    : `면접관 응답 ${replied}/${panelists.length} · 응답을 기다리고 있습니다.`;
}

function refreshOpenPositionDetail(positionId) {
  if(Number(currentPosDetailId) !== Number(positionId)) return;
  const posdetailSect = document.getElementById('sect-posdetail');
  if(posdetailSect && posdetailSect.classList.contains('on')) {
    renderPosDetailSection(Number(positionId));
  }
}

// ── 지원자 판정 확정/일괄 단계 변경 ──────────────────────────
// 포지션 단계 전체 판정 일괄 확정 (합격자→다음, 불합격자→탈락)
async function confirmStageDecisions(posId, stageIdx, options={}) {
  const skipConfirm = !!options.skipConfirm;
  const isFinalDecision = Number(stageIdx) === 4;
  const round = isFinalDecision ? '처우협의 결과' : STAGES[stageIdx];
  const posCands = candidates.filter(c => Number(c.posId) === Number(posId) && c.stage === stageIdx);
  if(!posCands.length) { toast(`${round} 판정을 확정할 지원자가 없습니다.`, 'tinfo'); return; }

  if(stageIdx === 1 || stageIdx === 3) {
    const missing = posCands.filter(c => !hasConfirmedRoundSchedule(c.id, stageIdx));
    if(missing.length) {
      const confirmed = await confirmActionModal({
        title:'미확정 면접 일정 확인',
        message:'일정 확정과 안내 없이 판정을 확정하면 해당 건이 처리 필요 목록에서 제외될 수 있습니다.',
        items:missing.map(c => `${c.name} · 면접 일정 미확정`),
        confirmLabel:'판정 계속',
        danger:true,
      });
      if(!confirmed) return;
    }
  }

  const undecided = posCands.filter(c => !c.decision);
  const passers = posCands.filter(c => c.decision === 'pass');
  const failers = posCands.filter(c => c.decision === 'fail');
  // 선택된 결과가 하나도 없으면 아무도 이동하지 않는 확인창 대신 결과 입력 창을 연다.
  if(!passers.length && !failers.length) return openPositionResultModal(posId, stageIdx);
  // 2차 면접(레퍼런스 병행)으로 보내려면 합격자의 채용예정 직급군이 정해져 있어야 한다(개별 단계 변경과 같은 기준).
  if(Number(stageIdx) === 1 && nextFlowStage(stageIdx, posId) === 3) {
    const noBand = passers.filter(isGradeBandUnspecified);
    if(noBand.length) {
      const open = await confirmActionModal({
        title:'채용예정 직급군 미지정',
        message:'2차 면접으로 이동하려면 합격자의 채용예정 직급군(레퍼런스 대상 판정 기준)을 먼저 지정해 주세요.',
        items:noBand.map(c => `${c.name} · 직급군 미지정`),
        confirmLabel:'포지션 수정 열기',
      });
      if(open) editPosition(Number(posId));
      return;
    }
  }

  if(undecided.length && !skipConfirm) {
    const confirmed = await confirmActionModal({
      title:isFinalDecision ? '처우협의 일부 확정' : '일부 지원자 판정 확정',
      message:isFinalDecision ? '결과가 선택된 인원만 확정하고 협의 중인 지원자는 현재 단계에 남깁니다.' : '판정된 인원만 이동하고 미판정자는 현재 단계에 남깁니다.',
      items:undecided.map(c => `${c.name} · ${isFinalDecision ? '협의 중' : '미판정'}`),
      confirmLabel:'선택 인원만 확정',
    });
    if(!confirmed) return;
  } else if(!skipConfirm) {
    const confirmed = await confirmActionModal({
      title:isFinalDecision ? '처우협의 결과 확정' : `${round} 판정 확정`,
      message:isFinalDecision ? '최종 결과를 확정해 합격자는 입사 안내로, 불합격자는 전형 종료로 이동합니다.' : '면접 판정을 확정해 합격자는 다음 단계로, 불합격자는 전형 종료로 이동합니다.',
      items:[`${isFinalDecision ? '최종합격' : '합격'} ${passers.length}명`, `불합격 ${failers.length}명`, ...(isFinalDecision ? [`협의 중 유지 ${undecided.length}명`] : [])],
      confirmLabel:'판정 확정',
    });
    if(!confirmed) return;
  }

  const nx = nextFlowStage(stageIdx, posId);
  if(nx === 5 && passers.length) {
    const posId = passers[0].posId;
    if(posId != null) {
      const info = getPosSeatInfo(posId);
      if(info && info.passed + passers.length > info.headcount) {
        const confirmed = await confirmActionModal({
          title:'모집인원 초과 확인',
          message:'이번 판정 확정 후 최종합격자가 목표 인원을 초과합니다.',
          items:[`현재 최종합격 ${info.passed}명`, `이번 합격 ${passers.length}명`, `처리 후 ${info.passed + passers.length}명 / 목표 ${info.headcount}명`],
          confirmLabel:'초과 승인',
          danger:true,
        });
        if(!confirmed) return;
      }
    }
  }
  let passCnt = 0, failCnt = 0;
  const rejectionInfo = failers.length ? await askRejectReason(failers.length, { askMail:true }) : null;
  if(failers.length && !rejectionInfo) return;
  const decidedInterviews = [];
  [...passers, ...failers].forEach(c => {
    const itv = preserveCompletedStage(c, stageIdx, c.decision);
    if(itv) decidedInterviews.push(itv);
  });
  passers.forEach(c => {
    c.stage = nx;
    if(nx === 5 && !c.joinDate) c.joinDate = '';
    if(nx === 5) c.finalAt = today();  // 최종합격일(리포트·이력용) — 예전에는 어디서도 기록되지 않았다
    c.decision = '';  // 판정 초기화 (다음 단계에서 새로 판정)
    passCnt++;
  });
  // 불합격자 → 탈락(6)
  failers.forEach(c => {
    c.stage = 6;
    recordRejection(c, rejectionInfo.reason, rejectionInfo.memo);
    c.decision = '';
    // 진행중 면접·레퍼런스 정리
    interviews = interviews.filter(i => !(Number(i.candId)===Number(c.id) && (i.status||'pending')==='pending'));
    if(c.ref === '진행중') { c.ref = '미시작'; c.refD = 0; c.refT = 0; delete refDetails[c.id]; }
    failCnt++;
  });
  // 사내추천 상태(합격/불합격)도 함께 맞춘다 — 개별 단계 변경에서만 반영되던 문제.
  if(typeof syncReferralFromCandidate === 'function') [...passers, ...failers].forEach(c => syncReferralFromCandidate(c));
  saveState();
  if(GS_CONFIG.scriptUrl) await settleSync([
    ...[...passers, ...failers].map(c => () => syncCandToGS(c)),
    ...decidedInterviews.map(i => () => syncIntToGS(i)),
  ], '판정 결과 동기화');
  // 일괄 확정은 개별 단계 변경과 달리 불합격 안내를 보내지 않아, 불합격자가 결과를 통보받지 못하고
  // 재발송 필요 표시도 남지 않았다. 사유 입력 창에서 발송을 선택하면 여기서 순서대로 보낸다.
  let rejectMailNote = '';
  if(failers.length && rejectionInfo?.sendMail) {
    const mail = await sendRejectionNotices_(failers);
    rejectMailNote = mail.failed ? ` · 불합격 안내 ${mail.sent}건 발송, ${mail.failed}건 재발송 필요` : ` · 불합격 안내 ${mail.sent}건 발송`;
  }
  renderPositions(); renderDashboard();
  // 다음 작업 창으로 바로 이어지는 경우에는 결과 알림을 띄우지 않는다(창이 다음 할 일을 보여 줌).
  // 단, 불합격 안내 메일 발송 실패는 다음 창에 나오지 않으므로 경고로 알린다.
  const warnRejectMailFailure_ = () => { if(rejectMailNote.includes('재발송')) toast(`불합격 안내 메일 일부를 보내지 못했습니다${rejectMailNote}. 처리 필요 업무에서 다시 보내 주세요.`, 'tw'); };
  if(isFinalDecision && passCnt > 0) {
    openOnboardingFromPosition(Number(posId));
    warnRejectMailFailure_();
  } else if(nx === 2 && passCnt > 0) {
    // 1차 면접 합격자는 레퍼런스 단계로 이동하는 즉시 추천인 등록 안내 발송 화면으로 이어간다.
    openPosDetail(Number(posId));
    toast(`결과 확정: 합격 ${passCnt}명 → ${STAGES[nx]}, 불합격 ${failCnt}명 종료${rejectMailNote}`, rejectMailNote.includes('재발송') ? 'tw' : 'tok');
    requestPositionReferences(Number(posId));
  } else if(nx === 3 && passCnt > 0) {
    // 1차 합격자가 2차 면접으로 넘어가면 바로 2차 면접관 일정 확인으로 이어간다
    // (면접관 회신 확인이 이미 끝났다면 openCollectSlots가 지원자 일정 요청 창을 연다).
    openPosDetail(Number(posId));
    openCollectSlots(Number(posId), 3);
    warnRejectMailFailure_();
  } else {
    openPosDetail(Number(posId));
    toast(isFinalDecision
      ? `처우협의 결과 확정: 최종합격 ${passCnt}명, 불합격 ${failCnt}명 종료${rejectMailNote}`
      : `결과 확정: 합격 ${passCnt}명 → ${STAGES[nx]}, 불합격 ${failCnt}명 종료${rejectMailNote}`, rejectMailNote.includes('재발송') ? 'tw' : 'tok');
  }
}

// 불합격 안내 메일을 순서대로 발송한다. 실패한 지원자는 '불합격 안내 재발송 필요'로 남겨 처리 필요 목록에 표시한다.
async function sendRejectionNotices_(list) {
  let sent = 0, failed = 0;
  showGlobalSyncProgress(`불합격 안내 메일을 발송하고 있습니다. (0/${list.length})`);
  try {
    for(const c of list) {
      updateGlobalSyncProgress(`불합격 안내 메일을 발송하고 있습니다. (${sent + failed + 1}/${list.length})`);
      const target = getCandidateMailTarget(c);
      const subject = `[우미건설] ${c.name}님 채용 결과 안내`;
      let ok = false;
      try {
        ok = await dispatchCandidateMail_(c, {
          subject, purpose: '불합격 안내', directBody: buildRejectEmail(c), logType: '불합격안내(업체경유)',
          sendDirect: () => sendGeneralEmailViaGmail(target.to, subject, buildRejectEmail(c), '불합격안내', c.name, {
            templateType: 'rejection', candidateName: c.name, positionText: c.pos
          })
        });
      } catch(error) { console.warn('[불합격 안내] 발송 오류', c.name, error); }
      if(ok === false) {
        c.mailPending = true;
        c.mailPendingLabel = '불합격 안내 재발송 필요';
        failed++;
      } else {
        c.mailPending = false;
        c.mailPendingLabel = '';
        c.notified = true;
        sent++;
      }
    }
    saveState();
    if(GS_CONFIG.scriptUrl) await Promise.allSettled(list.map(c => syncCandToGS(c)));
  } finally {
    hideGlobalSyncProgress();
  }
  return { sent, failed };
}

async function resendRejectionNotice(candId) {
  const c = candidates.find(x => Number(x.id) === Number(candId));
  if(!c) return;
  const result = await sendRejectionNotices_([c]);
  toast(result.sent ? `${c.name}님에게 불합격 안내 메일 발송 완료` : `${c.name}님 불합격 안내 메일을 보내지 못했습니다. 잠시 후 다시 시도해 주세요.`, result.sent ? 'tok' : 'terr');
}

function hasConfirmedRoundSchedule(candId, stageIdx) {
  const round = stageIdx === 1 ? '1차' : stageIdx === 3 ? '2차' : '';
  if(!round) return true;
  return interviews.some(i => Number(i.candId) === Number(candId) && i.type === round &&
    (i.status === 'confirmed' || i.status === 'done') && i.date);
}

function preserveCompletedStage(c, fromStage, decision='') {
  if(!c) return null;
  c.lastCompletedStage = Number(fromStage);
  c.lastStageChangedAt = new Date().toISOString();
  if(fromStage !== 1 && fromStage !== 3) return null;
  const round = fromStage === 1 ? '1차' : '2차';
  const itv = interviews.find(i => Number(i.candId)===Number(c.id) && i.type===round);
  if(!itv) return null;
  itv.status = 'done';
  if(decision) itv.result = decision;
  itv.evaluatedAt = new Date().toISOString();
  return itv;
}

function resetCandidateProgressForRollback(c, newStage) {
  const removedInterviewIds = [];
  if(!c) return removedInterviewIds;

  interviews = interviews.filter(i => {
    if(Number(i.candId) !== Number(c.id)) return true;
    const interviewStage = i.type === '1차' ? 1 : i.type === '2차' ? 3 : 99;
    const remove = newStage === 0 || interviewStage > newStage;
    if(remove) removedInterviewIds.push(i.id);
    return !remove;
  });

  if(newStage < 2) {
    c.ref = '미시작';
    c.refD = 0;
    c.refT = 0;
    delete refDetails[c.id];
    delete refReports[c.id];
  }

  c.lastCompletedStage = newStage > 0 ? newStage - 1 : null;
  c.lastStageChangedAt = new Date().toISOString();
  c.decision = '';
  c.finalAt = '';
  c.rejectedAt = '';
  c.rejectReason = '';
  c.rejectMemo = '';
  c.held = false;

  const remainingSchedule = interviews.find(i => Number(i.candId) === Number(c.id) && i.date);
  c.intDate = remainingSchedule ? remainingSchedule.date : '';
  if(newStage === 0) {
    c.notified = false;
    c.mailPending = false;
    c.mailPendingLabel = '';
  }
  return removedInterviewIds;
}

function resetPositionRoundForRollback(c, newStage) {
  if(!c || Number(newStage) !== 0) return null;
  const pos = positions.find(p => Number(p.id) === Number(c.posId));
  if(!pos) return null;
  const hasOtherProgressedCandidate = candidates.some(other =>
    Number(other.id) !== Number(c.id) &&
    Number(other.posId) === Number(c.posId) &&
    Number(other.stage) !== 6 &&
    flowIndex(Number(other.stage), getFlowForCandidate(other)) >= flowIndex(1, getFlowForCandidate(other))
  );
  if(hasOtherProgressedCandidate) return null;

  pos.panel1AvailabilityOptions = [];
  pos.panel1AvailabilityRequestedAt = '';
  pos.panel1AvailabilityConfirmedAt = '';
  delete panelAvailabilityCache[panelAvailabilityCacheKey(pos.id, 1)];
  return pos;
}

async function deletePanelAvailabilityRoundFromGS(positionId, stageIdx) {
  const round = Number(stageIdx) === 1 ? '1차' : '2차';
  const result = await gsFetch('getPanelAvailabilityResponses', '', { positionId, round }, { allowQueue:false });
  if(!result?.ok) throw new Error(result?.error || '면접관 일정 응답 조회 실패');
  const rows = (result.responses || []).filter(row => row?.id != null && row.id !== '');
  const deleted = await Promise.all(rows.map(row => gsDelete('PanelAvailability', row.id)));
  if(deleted.some(value => value == null || value?.error)) throw new Error('면접관 일정 응답 초기화 실패');
  return { ok:true, deleted:rows.length };
}

async function batchStageChange(posId, fromStage, toStage) {
  const targets = candidates.filter(c => Number(c.posId) === Number(posId) && c.stage === fromStage);
  if(!targets.length) { toast(`${STAGES[fromStage]} 단계에 이동할 지원자가 없습니다.`, 'tinfo'); return; }

  // 면접 단계 진입은 포지션 공통일정을 먼저 확정한 뒤 일괄 이동한다.
  if(toStage === 1 || toStage === 3) {
    const missing = targets.filter(c => !hasConfirmedRoundSchedule(c.id, toStage));
    if(missing.length) {
      const confirmed = await confirmActionModal({
        title:`${STAGES[toStage]} 일정 미확정`,
        message:'공통일정 요청과 안내 없이 지원자를 바로 이동합니다. 미완료 항목은 처리 필요 목록에 남습니다.',
        items:missing.map(c => `${c.name} · 일정 미확정`),
        confirmLabel:'일정 없이 이동',
        danger:true,
      });
      if(!confirmed) return;
    }
  }

  // 면접 단계에서 다음 단계로 일괄 이동할 때도 전원 일정 확정을 필수로 한다.
  if(fromStage === 1 || fromStage === 3) {
    const missing = targets.filter(c => !hasConfirmedRoundSchedule(c.id, fromStage));
    if(missing.length) {
      const confirmed = await confirmActionModal({
        title:'미확정 면접 일정 확인',
        message:'일정 확정과 안내 없이 다음 단계로 이동하면 해당 건이 처리 필요 목록에서 제외될 수 있습니다.',
        items:missing.map(c => `${c.name} · 일정 미확정`),
        confirmLabel:'다음 단계 이동',
        danger:true,
      });
      if(!confirmed) return;
    }
  }

  const confirmed = await confirmActionModal({
    title:'지원자 일괄 단계 이동',
    message:`지원자 ${targets.length}명을 ${STAGES[toStage]} 단계로 이동합니다.`,
    items:targets.map(c => `${c.name} · ${stageLabel(fromStage)} → ${stageLabel(toStage)}`),
    confirmLabel:`${targets.length}명 이동`,
  });
  if(!confirmed) return;
  const completedInterviews = [];
  const removedInterviewIds = [];
  const flow = positions.find(p => Number(p.id) === Number(posId)) ? getPositionFlow(positions.find(p => Number(p.id) === Number(posId))) : FLOW;
  const movingBackward = flowIndex(toStage, flow) < flowIndex(fromStage, flow);
  targets.forEach(c => {
    if(movingBackward) {
      removedInterviewIds.push(...resetCandidateProgressForRollback(c, toStage));
    } else {
      const itv = preserveCompletedStage(c, fromStage);
      if(itv) completedInterviews.push(itv);
    }
    c.stage = toStage;
    syncReferralFromCandidate(c);
  });
  saveState();
  if(GS_CONFIG.scriptUrl) await settleSync([
    ...targets.map(c => () => syncCandToGS(c)),
    ...completedInterviews.map(i => () => syncIntToGS(i)),
    ...removedInterviewIds.map(id => () => deleteIntFromGS(id)),
  ], movingBackward ? '단계 일괄 되돌리기 동기화' : '단계 일괄 이동 동기화');
  renderDashboard(); renderTracker(); renderPositions();
  toast(`${targets.length}명 ${STAGES[toStage]} 단계로 일괄 이동 완료`, 'tok');
}

</script>
