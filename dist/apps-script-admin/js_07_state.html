<script>
// ══════════════════════════════════════════════════════════════
// 상태 저장/복원 (localStorage + Google Sheets AuxState)
// UI 렌더링과 분리된 순수 persistence 계층. js_03_ui_dashboard.html에서 이동.
// ══════════════════════════════════════════════════════════════
const LS_KEY = 'woomic_recruit_v4';

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { lastLocalStateJson = raw; return JSON.parse(raw); }
  } catch(e) {}
  return null;
}

// 알림·활동 기록은 NotifyLog·ActivityLog 시트로 옮겨 줄 단위로 저장한다(아래 줄 동기화). 남은 보조 데이터는 추천인 응답 사본뿐이다.
function getAuxStateSnapshot() {
  return {
    updatedAt: auxUpdatedAt || new Date().toISOString(),
    refDetails,
  };
}

function getAuxFingerprint() {
  return JSON.stringify({ refDetails });
}

function chunkText(text, size=1400) {
  return String(text || '').match(new RegExp(`[\\s\\S]{1,${size}}`, 'g')) || [''];
}

async function syncAuxStateToGS() {
  if(!GS_CONFIG.scriptUrl || auxSyncSuspended) return;
  const json = JSON.stringify(getAuxStateSnapshot());
  const chunks = chunkText(json);
  // 청크마다 개별 upsert를 동시에 쏘면 전부 같은 LockService 락을 두고 경합하다가
  // 대기시간(10초)을 넘겨 여러 건이 한꺼번에 실패한다 — 배치 upsert 한 번으로 묶어서 보낸다.
  const rows = [
    {id:'auxState:meta', value:JSON.stringify({count:chunks.length,updatedAt:auxUpdatedAt})},
    ...chunks.map((value,i)=>({id:`auxState:${i}`,value})),
  ];
  await settleSync([() => gsBatchUpsert('Settings', rows)], '보조 데이터 동기화');
}

function scheduleAuxStateSync() {
  if(auxSyncSuspended || !GS_CONFIG.scriptUrl) return;
  clearTimeout(auxSyncTimer);
  auxSyncTimer = setTimeout(syncAuxStateToGS, 1800);
}

async function loadAuxStateFromGS() {
  if(!hasGsBridge_()) return false;
  const rows = await gsGetSettingsRowsShared_();
  const coreDeleted = applyRemoteGsTombstones(rows);
  if(coreDeleted) {
    renderDashboard();
    renderTracker();
    renderPositions();
  }
  const map = new Map(rows.map(r=>[String(r.id),String(r.value??'')]));
  let meta;
  try { meta = JSON.parse(map.get('auxState:meta') || ''); } catch(e) { return false; }
  if(!meta?.count) return false;
  let json = '';
  for(let i=0;i<meta.count;i++) json += map.get(`auxState:${i}`) || '';
  try {
    const remote = JSON.parse(json);
    if(auxUpdatedAt && remote.updatedAt && String(auxUpdatedAt) >= String(remote.updatedAt)) return false;
    // 입사 등록·처우 기록은 이제 각자 시트에서 받는다. 예전 덩어리에 남은 값은 시트를 아직 못 맞춘 경우(첫 이관)에만 쓴다.
    if(!rowSyncReady_ && Array.isArray(remote.onboardings) && remote.onboardings.length && !onboardings.length) onboardings = remote.onboardings;
    if(!rowSyncReady_ && Array.isArray(remote.offers) && remote.offers.length && !offers.length) offers = remote.offers;
    // 알림·활동 기록도 이제 각자 시트에서 받는다. 예전 덩어리 값은 첫 이관 때만 쓴다.
    if(!rowSyncReady_ && Array.isArray(remote.notifyLog) && remote.notifyLog.length && !notifyLog.length) notifyLog = remote.notifyLog;
    refDetails = remote.refDetails || refDetails;
    // 레퍼런스 결과 정리도 이제 RefReports 시트에서 받는다. 예전 덩어리 값은 첫 이관 때만 쓴다.
    if(!rowSyncReady_ && remote.refReports && Object.keys(remote.refReports).length && !Object.keys(refReports).length) refReports = remote.refReports;
    if(!rowSyncReady_ && Array.isArray(remote.activityLog) && remote.activityLog.length && !activityLog.length) activityLog = remote.activityLog;
    auxUpdatedAt = remote.updatedAt || meta.updatedAt || '';
    saveState();
    return true;
  } catch(e) {
    console.warn('보조 데이터 GS 로드 실패:', e);
    return false;
  }
}

function saveState() {
  let auxChanged = false;
  try {
    const auxFingerprint = getAuxFingerprint();
    auxChanged = auxFingerprint !== lastAuxFingerprint;
    if(auxChanged) {
      lastAuxFingerprint = auxFingerprint;
      if(!auxSyncSuspended) auxUpdatedAt = new Date().toISOString();
    }
    const data = JSON.stringify({ candidates, interviews, onboardings, offers, notifyLog: notifyLog.slice(0,200), refDetails, refReports, positions, referrals, rewards, refRules, employees, activityLog: activityLog.slice(0,300), auxUpdatedAt });
    if(data !== lastLocalStateJson) {
      localStorage.setItem(LS_KEY, data);
      lastLocalStateJson = data;
      // 데이터가 바뀌면 보이는 화면(프로세스 진행현황·대시보드·배지 등)을 한 번에 다시 그린다.
      if(typeof scheduleViewRefresh_ === 'function') scheduleViewRefresh_();
    }
    if(auxChanged) scheduleAuxStateSync();
    if(typeof scheduleRowSync_ === 'function') scheduleRowSync_();
  } catch(e) {
    if(e.name === 'QuotaExceededError' || e.code === 22) {
      notifyLog = notifyLog.slice(0, 50);
      activityLog = activityLog.slice(0, 100);
      try { localStorage.setItem(LS_KEY, JSON.stringify({ candidates, interviews, onboardings, offers, notifyLog, refDetails, refReports, positions, referrals, rewards, refRules, employees, activityLog, auxUpdatedAt })); if(auxChanged) scheduleAuxStateSync(); }
      catch(e2) { console.warn('localStorage 저장 실패:', e2); }
    }
  }
}

// ══════════════════════════════════════════════════════════════
// 입사 등록(Onboardings)·처우 기록(Offers): 한 줄씩 서버에 저장
// 예전에는 보조 데이터 덩어리(설정 시트 auxState)에 통째로 넣어, 두 PC가 거의 동시에 저장하면 나중에 저장한
// 쪽이 앞의 수정을 덮어쓸 수 있었다. 이제 바뀐 기록만 그 줄로 저장하고, 다른 PC의 변경은 변경 이력으로 받는다.
// ══════════════════════════════════════════════════════════════
const ROW_SYNC_SNAPSHOT_KEY_ = 'woomic_row_sync_snapshot_v1';
const ROW_SYNC_SHEETS_ = {
  Onboardings: {
    list:() => onboardings, set:v => { onboardings = v; },
    key:r => String(r.id ?? ''),
    toRow:r => ({ ...r }),
    fromRow:row => ({
      ...row, id:Number(row.id), candId:Number(row.candId),
      joinDate:rowSyncDate_(row.joinDate), preDeadline:rowSyncDate_(row.preDeadline), joinTime:rowSyncTime_(row.joinTime),
      notified:rowBool_(row.notified), deptNotified:rowBool_(row.deptNotified), rev:Number(row.rev) || 0,
    }),
  },
  Offers: {
    list:() => offers, set:v => { offers = v; },
    key:r => String(r.candId ?? ''),
    toRow:r => ({ ...r, id:String(r.candId), allowanceItems:JSON.stringify(r.allowanceItems || {}) }),
    fromRow:row => {
      let items = {};
      try { items = JSON.parse(row.allowanceItems || '{}') || {}; } catch(e) {}
      const out = { ...row, candId:Number(row.candId || row.id), allowanceItems:items, healthDeadline:rowSyncDate_(row.healthDeadline), rev:Number(row.rev) || 0 };
      delete out.id;
      return out;
    },
  },
  // 레퍼런스 결과 정리: 화면에서는 지원자 id를 키로 한 객체(refReports[candId])로 쓴다.
  RefReports: {
    list:() => Object.entries(refReports).map(([candId, r]) => {
      if(!r) return null;
      if(r.candId == null) r.candId = Number(candId);
      // 예전 기록은 화면 표시용 저장 시각을 updatedAt에 두었다 → savedAt으로 옮긴다(updatedAt은 줄 동기화가 쓴다).
      if(!r.savedAt && r.updatedAt && !String(r.updatedAt).includes('T')) r.savedAt = r.updatedAt;
      return r;
    }).filter(Boolean),
    set:v => { refReports = Object.fromEntries(v.map(r => [String(r.candId), r])); },
    key:r => String(r.candId ?? ''),
    toRow:r => ({ ...r, id:String(r.candId), aiApplied:r.aiApplied ? 'true' : '' }),
    fromRow:row => {
      const out = { ...row, candId:Number(row.candId || row.id), aiApplied:rowBool_(row.aiApplied), rev:Number(row.rev) || 0 };
      delete out.id;
      return out;
    },
  },
  // 알림·활동 기록: 최신순 배열. 추가만 하며, 최대 개수(200/300)와 보존기간을 넘긴 기록은 지우면 시트에서도 지워진다.
  NotifyLog: logRowSyncDef_(() => notifyLog, v => { notifyLog = v; }, 200),
  ActivityLog: logRowSyncDef_(() => activityLog, v => { activityLog = v; }, 300),
};

// 알림·활동 기록 줄 동기화 정의. id가 없는 예전 기록은 내용으로 id를 만든다(두 PC가 같은 예전 기록을 올려도 한 줄).
function logRowSyncDef_(get, setList, cap) {
  return {
    list:() => get().map(entry => { if(entry && !entry.id) entry.id = legacyLogEntryId_(entry); return entry; }).filter(Boolean),
    set:v => { setList(sortLogEntries_(v).slice(0, cap)); },
    key:r => String(r.id ?? ''),
    toRow:r => ({ ...r }),
    fromRow:row => ({ ...row }),
  };
}
function newLogEntryId_() { return 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function legacyLogEntryId_(entry) {
  const text = JSON.stringify([entry.date, entry.time, entry.ch, entry.type, entry.target, entry.to, entry.action, entry.detail, entry.entityType, entry.entityId]);
  let hash = 5381;
  for(let i = 0; i < text.length; i++) hash = ((hash * 33) ^ text.charCodeAt(i)) >>> 0;
  return 'H' + hash.toString(36) + text.length.toString(36);
}
// 정렬 시각: 새 기록은 at(ISO), 예전 기록은 date + time('오후 02:30' 같은 한국어 시각).
function logEntrySortTime_(entry) {
  const at = Date.parse(entry?.at || '');
  if(Number.isFinite(at)) return at;
  const m = String(entry?.time || '').match(/(오전|오후)?s*(d{1,2}):(d{2})/);
  let hour = m ? Number(m[2]) : 0;
  if(m && m[1] === '오후' && hour < 12) hour += 12;
  if(m && m[1] === '오전' && hour === 12) hour = 0;
  const day = Date.parse(String(entry?.date || '') + 'T00:00:00');
  return (Number.isFinite(day) ? day : 0) + hour * 3600000 + (m ? Number(m[3]) : 0) * 60000;
}
function sortLogEntries_(list) {
  return (list || []).slice().sort((a, b) => logEntrySortTime_(b) - logEntrySortTime_(a));
}
function rowBool_(v) { return v === true || String(v).toLowerCase() === 'true'; }
let rowSyncReady_ = false;      // 서버 기록을 한 번 불러와 맞춘 뒤에만 올린다(오래된 값을 올리지 않게)
let rowSyncTimer_ = null;
let rowSyncRunning_ = false;
let rowSyncSnapshot_ = {};       // 시트별 { key: 마지막으로 서버와 맞춘 내용 }
try { rowSyncSnapshot_ = JSON.parse(localStorage.getItem(ROW_SYNC_SNAPSHOT_KEY_) || '{}') || {}; } catch(e) { rowSyncSnapshot_ = {}; }
function persistRowSyncSnapshot_() {
  try { localStorage.setItem(ROW_SYNC_SNAPSHOT_KEY_, JSON.stringify(rowSyncSnapshot_)); } catch(e) {}
}
// 비교용 내용: 저장 시각(updatedAt)은 빼고 키 순서를 고정한다.
function rowSyncFingerprint_(sheet, rec) {
  const row = ROW_SYNC_SHEETS_[sheet].toRow(rec);
  return JSON.stringify((GS_SCHEMA[sheet] || Object.keys(row)).filter(k => k !== 'updatedAt' && k !== 'rev').map(k => String(row[k] == null ? '' : row[k])));
}
// 시트가 날짜·시각으로 바꿔 돌려준 값을 화면 형식으로 되돌린다(2026-10-14T15:00:00Z → 2026-10-15, 1899-12-30T00:00Z → 09:00).
function rowSyncDate_(v) {
  const s = String(v || '');
  return /^\d{4}-\d{2}-\d{2}T/.test(s) ? localYmd_(new Date(s)) : s;
}
function rowSyncTime_(v) {
  const s = String(v || '');
  if(!/^\d{4}-\d{2}-\d{2}T/.test(s)) return s;
  const d = new Date(s);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// 서버의 줄 기록을 불러와 이 브라우저 기록과 맞춘다. 서버가 비어 있고 이 브라우저에만 있으면(첫 이관) 올린다.
async function loadRowSyncSheets_() {
  if(!hasGsBridge_()) return false;
  for(const [sheet, def] of Object.entries(ROW_SYNC_SHEETS_)) {
    const result = await gsGetAllResult(sheet, { force:true });
    if(!result) return false; // 못 불러오면 올리지 않고 다음 기회에 다시
    const server = new Map((result.data || []).map(row => { const rec = def.fromRow(row); return [def.key(rec), rec]; }));
    const snap = rowSyncSnapshot_[sheet] || {};
    const merged = [];
    def.list().forEach(local => {
      const key = def.key(local);
      if(!key) return;
      const remote = server.get(key);
      if(remote) {
        // 마지막 동기화 뒤 이 브라우저에서 고친 기록이면 이 브라우저 것을, 아니면 서버 것을 쓴다.
        const localEdited = snap[key] !== undefined && snap[key] !== rowSyncFingerprint_(sheet, local);
        merged.push(localEdited ? local : remote);
        server.delete(key);
      } else if(snap[key] === undefined) {
        merged.push(local); // 아직 서버에 없는 새 기록(첫 이관 포함) — 아래에서 올린다
      } // 예전에 서버와 맞춘 적 있는데 서버에 없으면 다른 PC에서 지운 것 — 버린다
    });
    server.forEach(remote => merged.push(remote));
    def.set(merged);
    rowSyncSnapshot_[sheet] = Object.fromEntries((result.data || []).map(row => { const rec = def.fromRow(row); return [def.key(rec), rowSyncFingerprint_(sheet, rec)]; }));
  }
  persistRowSyncSnapshot_();
  rowSyncReady_ = true;
  saveState();          // 화면 갱신 + 남은 차이(첫 이관·이 브라우저 수정)를 올린다
  scheduleRowSync_(0);
  return true;
}

function scheduleRowSync_(delay = 1200) {
  if(!rowSyncReady_ || !hasGsBridge_()) return;
  clearTimeout(rowSyncTimer_);
  rowSyncTimer_ = setTimeout(flushRowSync_, delay);
}

// 마지막으로 서버와 맞춘 내용과 다른 기록만 올리고, 사라진 기록은 서버에서도 지운다.
async function flushRowSync_() {
  if(rowSyncRunning_) { scheduleRowSync_(); return; }
  rowSyncRunning_ = true;
  try {
    for(const [sheet, def] of Object.entries(ROW_SYNC_SHEETS_)) {
      const snap = rowSyncSnapshot_[sheet] || (rowSyncSnapshot_[sheet] = {});
      const current = new Map(def.list().filter(r => def.key(r)).map(r => [def.key(r), r]));
      const changed = [...current.entries()].filter(([key, rec]) => snap[key] !== rowSyncFingerprint_(sheet, rec));
      const removed = Object.keys(snap).filter(key => !current.has(key));
      if(changed.length) {
        const keys = changed.map(([key]) => key);
        const recOf = key => def.list().find(r => def.key(r) === key);
        const now = new Date().toISOString();
        changed.forEach(([, rec]) => { rec.updatedAt = now; });
        const send = () => gsFetch('batchUpsert', sheet, keys.map(recOf).filter(Boolean).map(rec => gsSchemaPayload(sheet, def.toRow(rec))), { allowQueue:false });
        let result = await send();
        // 다른 PC가 같은 기록을 먼저 고쳤으면(rev 충돌) 필드별로 합친 뒤 다시 저장한다:
        // 마지막 동기화 뒤 이 PC에서 바꾼 칸은 이 PC 값, 나머지 칸은 서버 최신값.
        for(let attempt=0; attempt<2 && result?.error === 'revision_conflict' && Array.isArray(result.conflicts); attempt++) {
          result.conflicts.forEach(conflict => {
            const key = String(conflict.id ?? '');
            const local = recOf(key);
            if(!local || !conflict.data) return;
            replaceRowSyncRecord_(sheet, key, mergeRowSyncRecord_(sheet, local, conflict.data));
            snap[key] = rowSyncFingerprint_(sheet, def.fromRow(conflict.data));
          });
          console.info('[GS] 버전 충돌 자동 병합 후 재저장:', sheet, result.conflicts.map(c => c.id));
          result = await send();
        }
        if(result == null || result?.error) {
          if(result?.error === 'revision_conflict') showRevisionConflict_(sheet, result);
          scheduleRowSync_(15000);
          continue;
        }
        keys.forEach(key => {
          const rec = recOf(key);
          if(!rec) return;
          if(result.revs && result.revs[key] != null) rec.rev = Number(result.revs[key]) || 0;
          snap[key] = rowSyncFingerprint_(sheet, rec);
        });
      }
      for(const key of removed) {
        const result = await gsFetch('deleteRow', sheet, { id:key }, { allowQueue:false });
        if(result == null || result?.error) { scheduleRowSync_(15000); continue; }
        delete snap[key];
      }
    }
    persistRowSyncSnapshot_();
  } finally {
    rowSyncRunning_ = false;
  }
}

// 다른 PC에서 바뀐 줄(변경 이력)을 반영한다. 반영한 내용은 기준으로 기억해 다시 올리지 않는다.
function applyRowSyncChange_(sheet, change) {
  const def = ROW_SYNC_SHEETS_[sheet];
  if(!def || !rowSyncReady_) return false;
  const snap = rowSyncSnapshot_[sheet] || (rowSyncSnapshot_[sheet] = {});
  const id = String(change.id ?? change.data?.id ?? '');
  if(!id) return false;
  const list = def.list();
  if(change.action === 'delete') {
    def.set(list.filter(r => def.key(r) !== id));
    delete snap[id];
  } else {
    const rec = def.fromRow(change.data || {});
    const key = def.key(rec);
    const idx = list.findIndex(r => def.key(r) === key);
    // 이 PC가 이미 더 새 버전을 저장한 뒤 도착한 예전 변경(자기 저장의 늦은 회신 등)은 무시한다.
    if(idx >= 0 && rec.rev && rec.rev < (Number(list[idx].rev) || 0)) return true;
    // 이 PC에서 고치고 아직 올리지 못한 기록이면 덮어쓰지 않고 합친다(올릴 때 서버 rev 기준으로 저장된다).
    const localPending = idx >= 0 && snap[key] !== undefined && snap[key] !== rowSyncFingerprint_(sheet, list[idx]);
    replaceRowSyncRecord_(sheet, key, localPending ? mergeRowSyncRecord_(sheet, list[idx], change.data || {}) : rec);
    snap[key] = rowSyncFingerprint_(sheet, rec);
    if(localPending) scheduleRowSync_();
  }
  persistRowSyncSnapshot_();
  return true;
}

// 같은 기록을 두 PC가 고쳤을 때 필드별 병합. 기준(base)은 마지막으로 서버와 맞춘 내용(snapshot)이다.
// base와 다른 칸(이 PC가 바꾼 칸)은 이 PC 값, 나머지는 서버 값을 쓰고, rev는 서버 값을 따른다.
// base가 없으면(서버와 맞춘 적 없는 기록) 이 PC 값을 모두 쓴다.
function mergeRowSyncRecord_(sheet, local, serverRow) {
  const def = ROW_SYNC_SHEETS_[sheet];
  const fields = (GS_SCHEMA[sheet] || []).filter(k => k !== 'updatedAt' && k !== 'rev');
  const key = def.key(local);
  let base = null;
  try { base = rowSyncSnapshot_[sheet]?.[key] ? JSON.parse(rowSyncSnapshot_[sheet][key]) : null; } catch(e) { base = null; }
  const localRow = def.toRow(local);
  const merged = def.toRow(def.fromRow(serverRow)); // 서버 값도 화면 형식(날짜 등)으로 맞춘 뒤 비교
  fields.forEach((field, index) => {
    const localValue = String(localRow[field] == null ? '' : localRow[field]);
    if(!base || localValue !== base[index]) merged[field] = localRow[field];
  });
  merged.rev = Number(serverRow.rev) || 0;
  merged.updatedAt = localRow.updatedAt || serverRow.updatedAt || '';
  return def.fromRow(merged);
}

// 기존 객체를 그 자리에서 바꾼다(열려 있는 화면이 같은 객체를 참조하고 있을 수 있다).
function replaceRowSyncRecord_(sheet, key, rec) {
  const def = ROW_SYNC_SHEETS_[sheet];
  const list = def.list();
  const target = list.find(r => def.key(r) === key);
  if(!target) { def.set(list.concat([rec])); return; }
  Object.keys(target).forEach(k => { delete target[k]; });
  Object.assign(target, rec);
}

</script>
