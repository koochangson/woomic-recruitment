<script>
// ══════════════════════════════════════════════════════════════
// 포지션 목록·CRUD·상태 전환
// js_02_positions_interviews.html에서 분리 (Phase 2).
// ══════════════════════════════════════════════════════════════
// positions, editingPosId: 전역 선언됨

// ── 포지션 렌더링 ───────────────────────────────────────────
function renderPositions() {
  const list = document.getElementById('pos-list');
  const countLabel = document.getElementById('pos-count-label');
  const nbPos = document.getElementById('nb-pos');
  if(!list) return;
  const candidatesByPos = {};
  candidates.forEach(c => {
    const key = Number(c.posId);
    (candidatesByPos[key] = candidatesByPos[key] || []).push(c);
  });

  // 부분 충원 마감(status 'partial')은 종료 포지션이다. 진행중 포지션은 status 'active'만 해당한다.
  const isDone = (pos) => !isPositionOpen_(pos);

  // 탭별 카운트
  const activeCount = positions.filter(p => !isDone(p)).length;
  const doneCount   = positions.filter(p =>  isDone(p)).length;
  const setCnt = (id,v) => { const el=document.getElementById(id); if(el) el.textContent = `(${v})`; };
  setCnt('pos-cnt-active', activeCount);
  setCnt('pos-cnt-done',   doneCount);
  setCnt('pos-cnt-all',    positions.length);

  if(countLabel) countLabel.textContent = `진행중 ${activeCount}개 · 완료 ${doneCount}개 · 전체 ${positions.length}개`;
  if(nbPos) nbPos.textContent = activeCount;  // 사이드바 배지는 진행중 기준
  updateSidebarUrgency();

  const orgBar=document.getElementById('pos-org-filter');
  const orgLabel=document.getElementById('pos-org-filter-label');
  if(orgBar) orgBar.style.display=positionOrgFilter?'flex':'none';
  if(orgLabel&&positionOrgFilter) orgLabel.textContent=`채용현황 필터: ${positionOrgFilter.location} · ${positionOrgFilter.empType} · ${positionOrgFilter.team||positionOrgFilter.jobType}`;

  // 필터 적용
  const filtered = positions.filter(p => {
    if(positionOrgFilter && !(p.location===positionOrgFilter.location&&(p.etype||'정규직')===positionOrgFilter.empType&&(!positionOrgFilter.team||p.team===positionOrgFilter.team)&&(!positionOrgFilter.jobType||p.jobType===positionOrgFilter.jobType))) return false;
    if(posFilter === 'active') return !isDone(p);
    if(posFilter === 'done')   return  isDone(p);
    return true;
  });

  if(!positions.length) {
    list.innerHTML = empty('등록된 포지션이 없습니다','포지션을 등록하면 채용 진행 현황과 다음 업무를 확인할 수 있습니다.','<button class="btn btn-sm btn-primary" data-action="call" data-call="openAddPosition()">+ 포지션 추가</button>');
    return;
  }
  if(!filtered.length) {
    list.innerHTML = empty(posFilter==='done' ? '완료된 포지션이 없습니다.' : '진행중인 포지션이 없습니다.');
    return;
  }

  const renderPositionCard = (pos) => {
    const posCandidates = candidatesByPos[Number(pos.id)] || [];
    const active = posCandidates.filter(c => Number(c.stage) < 5 && isActivePipelineCand(c));
    const passed = posCandidates.filter(isSeatFilledCand_);
    const done = isDone(pos);
    const progress = getPositionCardProgress(pos, posCandidates);
    const actions = getPositionActionItems(pos.id);
    const nextAction = actions.find(a => a.priority === 'high') || actions.find(a => a.priority === 'medium');
    const risk = !!actions.find(a => a.priority === 'high');
    let actionCall = nextAction ? nextAction.actionCall : '';
    if(actionCall && actionCall.startsWith('scrollPositionDetail(')) actionCall = `openPosDetail(${pos.id});${actionCall}`;
    const actionTitle = nextAction ? compactPositionActionTitle(nextAction.title) : '처리 없음';
    const actionLabel = nextAction ? compactPositionActionLabel(nextAction.actionLabel) : '';
    const finalJoinSummary = passed.length ? getPositionFinalJoinSummary(posCandidates) : '';

    return `<div class="card pos-manage-card ${risk?'is-risk':''}" role="button" tabindex="0" data-onkeydown="kbActivate(event)" data-action="open-position" data-id="${pos.id}" aria-label="${esc(pos.title)} 상세보기" style="${done?'opacity:.75':''}">
      <div class="pos-card-main">
        <div class="pos-card-head">
          <div class="pos-card-title" title="${esc(pos.title)}">${esc(pos.title)}</div>
          <div class="pos-card-title-meta">${esc(pos.hireReason || '충원')} · 채용${passed.length} · 지원${active.length}${finalJoinSummary?' · '+esc(finalJoinSummary):''}</div>
          <span class="pos-card-stage ${progress.className}">${esc(progress.label)}</span>
        </div>
        <div class="pos-card-action ${nextAction?'':'pos-card-action-ok'}">
          <div class="pos-card-action-label"><span class="pos-card-action-dot"></span><strong title="${esc(nextAction ? nextAction.title : '처리할 업무 없음')}">${esc(actionTitle)}</strong></div>
          ${nextAction ? `<button class="btn btn-xs btn-primary" data-action="call" data-call="${esc(actionCall)}">${esc(actionLabel)}</button>` : ''}
        </div>
      </div>
    </div>`;
  };

  if(posFilter === 'done') {
    const byYear = {};
    filtered.forEach(pos => {
      const yr = pos.closedAt ? String(pos.closedAt).slice(0,4) : '날짜미상';
      (byYear[yr] = byYear[yr] || []).push(pos);
    });
    const years = Object.keys(byYear).sort((a,b) => b.localeCompare(a));
    list.innerHTML = years.map(yr => {
      const group = byYear[yr];
      const header = `<div style="grid-column:1/-1;font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.4px;padding:4px 2px;border-bottom:1px solid var(--border);margin-bottom:2px">${yr === '날짜미상' ? '날짜 미상' : yr + '년'} <span style="font-weight:500">(${group.length}건)</span></div>`;
      return header + group.map(renderPositionCard).join('');
    }).join('');
  } else {
    list.innerHTML = filtered.map(renderPositionCard).join('');
  }
}

// 포지션 상세에서 입사 안내 - 지원자 본인
function getDeptLeadRecipients(dept) {
  const normalized = String(dept || '').trim();
  if(!normalized || !Array.isArray(interviewers)) return [];
  const seen = new Set();
  return interviewers.filter(iv =>
    String(iv.dept || '').trim() === normalized &&
    /팀장|소장/.test(iv.rank || '') &&
    iv.email
  ).filter(iv => {
    const email = String(iv.email).trim().toLowerCase();
    if(seen.has(email)) return false;
    seen.add(email);
    return true;
  }).map(iv => ({ name:`${iv.name || ''} ${iv.rank || ''}`.trim(), email:iv.email }));
}

function getOnboardInternalRecipients(cand, onboarding) {
  const ob = onboarding || {};
  const teams = parseNotifyTeams();
  const hrEmail = document.getElementById('cfg-hr-email')?.value || '';
  const pos = positions.find(p => Number(p.id) === Number(cand.posId));
  const dept = ob.dept || (pos && pos.dept) || cand.dept || '';
  const leads = getDeptLeadRecipients(dept);
  const knownLeadEmails = new Set(leads.map(x=>String(x.email).trim().toLowerCase()));
  String(ob.deptLead || '').split(/[;,\n]+/).map(x=>x.trim()).filter(x=>x.includes('@')).forEach(email => {
    if(!knownLeadEmails.has(email.toLowerCase())) leads.push({ name:'배치 부서장/소장 추가 수신자', email });
  });
  const recipients = groupMailRecipients([...leads.map(x=>x.email), ...teams.map(t=>t.email), hrEmail]);
  const recipientNames = [...leads.map(x=>`${x.name}(배치 부서)`), ...teams.map(t=>t.name), ...(hrEmail?['피플팀 담당자']:[])].filter(Boolean);
  return { dept, leads, teams, hrEmail, recipients, recipientNames };
}

// 지원자를 포지션에 연결
function linkCandToPos(candId, posId) {
  const c = candidates.find(x => Number(x.id) === Number(candId));
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!c) { toast('지원자를 찾을 수 없습니다. 새로고침 후 다시 시도해 주세요.', 'terr'); return; }
  if(!pos) { toast('포지션을 찾을 수 없습니다. 새로고침 후 다시 시도해 주세요.', 'terr'); return; }
  c.posId = Number(posId);
  saveState();
  if(GS_CONFIG.scriptUrl) {
    syncCandToGS(c).then(() => {
      renderPositions();
      openPosDetail(Number(posId));
    });
  } else {
    renderPositions();
    openPosDetail(Number(posId));
  }
}

// ── 포지션 상태 필터 ──
let posFilter = 'active';
function setPosFilter(f, btn) {
  posFilter = f;
  document.querySelectorAll('.pos-tab').forEach(b => b.classList.remove('pos-tab-on'));
  if(btn) btn.classList.add('pos-tab-on');
  renderPositions();
}

async function holdResidualCandidates(posId, label, options={}) {
  const residual = candidates.filter(c => Number(c.posId) === Number(posId) && c.stage < 5 && !c.held);
  if(!residual.length) return 0;
  if(options.confirm !== false) {
    const confirmed = await confirmActionModal({
      title:'잔여 지원자 보류',
      message:`${label}의 진행 중 지원자 ${residual.length}명을 보류 처리합니다.`,
      items:residual.map(c => `${c.name} · ${stageLabel(c.stage)}`),
      confirmLabel:`${residual.length}명 보류`,
    });
    if(!confirmed) return null;
  }
  residual.forEach(c => { c.held = true; if(GS_CONFIG.scriptUrl) syncCandToGS(c); });
  logActivity('지원자 보류', `${label} 잔여 지원자 ${residual.length}명`, 'position', posId);
  return residual.length;
}

// 채용 완료 처리
async function closePosition(posId) {
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!pos) return;
  const hc = parseInt(pos.headcount) || 1;
  const passed = candidates.filter(c => Number(c.posId) === Number(posId) && isSeatFilledCand_(c)).length;
  // 최종합격자 없이 '충원완료'로 마감되던 문제(상태가 filled로 저장됨) — 미채용/중단으로 안내한다.
  if(passed === 0) {
    toast('최종합격자가 없어 충원완료로 마감할 수 없습니다. 미채용 완료 또는 채용 중단을 이용해 주세요.', 'tw');
    return;
  }
  const active = candidates.filter(c => Number(c.posId) === Number(posId) && c.stage < 5 && !c.held).length;
  // 마감하면 최종합격자는 입사 완료로 간주돼 '입사 안내 발송 필요'가 다시 나오지 않는다 — 미발송자를 미리 알린다.
  const noticeMissing = candidates.filter(c => Number(c.posId) === Number(posId) && Number(c.stage) === 5
    && !onboardings.some(o => Number(o.candId) === Number(c.id) && o.notified));
  const items = [`최종합격 ${passed}명 / 목표 ${hc}명`];
  if(noticeMissing.length) items.push(`⚠ 입사 안내 미발송 ${noticeMissing.length}명 (${noticeMissing.map(c => c.name).join(', ')}) — 마감 후에는 처리 필요 목록에 다시 나오지 않습니다`);
  items.push(`최종합격자 ${passed}명은 입사 완료로 처리 (입사일 미입력이어도 입사 목록에서 제외)`);
  if(active > 0) items.push(`진행 중 지원자 ${active}명은 보류 처리 (다음 단계에서 불합격 안내 여부 선택)`);
  if(passed < hc) items.push('목표 미달 상태로 부분 충원 마감');
  const confirmed = await confirmActionModal({
    title:'포지션 충원 완료',
    message:`'${pos.title}' 모집을 완료 처리합니다.`,
    items,
    confirmLabel:noticeMissing.length ? '입사 안내 없이 마감' : passed < hc ? '부분 충원 마감' : '충원 완료',
    danger:noticeMissing.length > 0,
  });
  if(!confirmed) return;
  const heldIds = candidates.filter(c => Number(c.posId) === Number(posId) && c.stage < 5 && !c.held).map(c => Number(c.id));
  await holdResidualCandidates(posId, pos.title, {confirm:false});
  pos.status = (passed > 0 && passed < hc) ? 'partial' : 'filled';
  pos.closedAt = new Date().toISOString().slice(0,10);
  logActivity(pos.status === 'partial' ? '부분충원 완료' : '충원완료', `${pos.title} ${passed}/${hc}명`, 'position', posId);
  saveState();
  if(GS_CONFIG.scriptUrl && typeof syncPosToGS === 'function') syncPosToGS(pos);
  renderPositions(); renderDashboard();
  toast(`'${pos.title}' ${pos.status === 'partial' ? '부분충원' : '충원완료'} 처리`, 'tok');
  // 보류만 하면 진행 중이던 지원자는 결과를 통보받지 못한다 — 마감 안내(불합격) 발송을 선택하게 한다.
  if(heldIds.length) await offerClosingRejection_(pos, heldIds, pos.status === 'partial' ? '부분충원' : '충원완료');
}

async function offerClosingRejection_(pos, ids, closeLabel) {
  const targets = candidates.filter(c => ids.includes(Number(c.id)) && c.held && Number(c.stage) < 5);
  if(!targets.length) return;
  const confirmed = await confirmActionModal({
    title:'진행 중이던 지원자 결과 안내',
    message:`모집이 마감되어 보류된 지원자 ${targets.length}명을 불합격(모집 마감)으로 처리하고 안내 메일을 보낼까요?\n취소하면 보류 상태로 남고, 포지션을 다시 진행중으로 복원할 때 되살릴 수 있습니다.`,
    items:targets.map(c => `${c.name} · ${stageLabel(c.stage)}`),
    confirmLabel:`${targets.length}명 불합격 안내`,
    danger:true,
  });
  if(!confirmed) return;
  targets.forEach(c => {
    c.stage = 6; c.held = false; c.decision = '';
    recordRejection(c, '포지션취소', `${josa_(closeLabel, '으로', '로')} 모집 마감`);
    interviews = interviews.filter(i => !(Number(i.candId) === Number(c.id) && (i.status || 'pending') === 'pending'));
    if(typeof syncReferralFromCandidate === 'function') syncReferralFromCandidate(c);
  });
  saveState();
  const mail = await sendRejectionNotices_(targets);
  toast(mail.failed
    ? `모집 마감 안내: ${mail.sent}명 발송, ${mail.failed}명 재발송 필요(처리 필요 목록 확인)`
    : `모집 마감 안내 ${mail.sent}명 발송 완료`, mail.failed ? 'tw' : 'tok');
}

// 미채용 — 마법사로 위임 (P0)
function nohirePosition(posId) { openNohireWizard(posId); }

// 채용 중단 (재모집 없이 종료)
async function stopPosition(posId) {
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!pos) return;
  // 최종합격자가 있는 채로 중단하면 합격자가 '입사 진행 중'으로 남아 입사 목록·처리 필요에 계속 나온다.
  const finals = candidates.filter(c => Number(c.posId) === Number(posId) && isSeatFilledCand_(c));
  if(finals.length) {
    toast(`최종합격자 ${finals.length}명(${finals.map(c => c.name).join(', ')})이 있는 포지션입니다. 입사를 진행하면 [충원완료]로 마감하고, 합격을 취소한다면 지원자 상세에서 먼저 불합격 처리한 뒤 중단해 주세요.`, 'tw');
    return;
  }
  const residual = candidates.filter(c => Number(c.posId) === Number(posId) && c.stage < 5 && !c.held);
  const confirmed = await confirmActionModal({
    title:'포지션 채용 중단',
    message:`'${pos.title}' 포지션을 재모집 없이 종료합니다.`,
    items:residual.length ? [`진행 중 지원자 ${residual.length}명 보류 처리 (다음 단계에서 불합격 안내 여부 선택)`] : ['진행 중 지원자 없음'],
    input:{ label:'중단 사유', placeholder:'예: 조직 개편으로 채용 계획 취소, 내부 인력 이동으로 충원', required:true },
    confirmLabel:'채용 중단',
    danger:true,
  });
  if(!confirmed) return;
  pos.closeReason = typeof confirmed === 'string' ? confirmed : '';
  const heldIds = residual.map(c => Number(c.id));
  await holdResidualCandidates(posId, pos.title, {confirm:false});
  pos.status = 'stopped';
  pos.closedAt = today();
  logActivity('채용 중단', `${pos.title}${pos.closeReason ? ' · ' + pos.closeReason : ''}`, 'position', posId);
  saveState();
  if(GS_CONFIG.scriptUrl && typeof syncPosToGS === 'function') syncPosToGS(pos);
  renderPositions(); renderDashboard();
  toast(`'${pos.title}' 채용 중단 처리`, 'tok');
  if(heldIds.length) await offerClosingRejection_(pos, heldIds, '채용 중단');
}

// 진행중으로 복원
async function reopenPosition(posId) {
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!pos) return;
  pos.status = 'active';
  delete pos.closedAt;
  // 이전 종료 사유는 활동 기록에 남아 있으므로 비운다(다음 마감 때 엉뚱한 사유가 표시되지 않게).
  pos.closeReason = ''; pos.closeMemo = '';
  logActivity('포지션 복원', pos.title, 'position', posId);
  // 마감·중단 때 보류된 지원자를 되살릴 방법이 없었다 — 복원할 때 함께 진행 상태로 되돌릴지 묻는다.
  const held = candidates.filter(c => Number(c.posId) === Number(posId) && c.held && Number(c.stage) < 5);
  if(held.length) {
    const resume = await confirmActionModal({
      title:'보류된 지원자 복원',
      message:`포지션 마감·중단 때 보류된 지원자 ${held.length}명을 다시 진행 상태로 되돌릴까요?`,
      items:held.map(c => `${c.name} · ${stageLabel(c.stage)}`),
      confirmLabel:`${held.length}명 진행 재개`,
    });
    if(resume) held.forEach(c => { c.held = false; if(GS_CONFIG.scriptUrl) syncCandToGS(c); });
  }
  saveState();
  if(GS_CONFIG.scriptUrl && typeof syncPosToGS === 'function') syncPosToGS(pos);
  renderPositions(); renderDashboard();
  toast(`'${esc(pos.title)}' 진행중으로 복원`, 'tok');
}

// ── 포지션 추가/편집 모달 열기 ─────────────────────────────
function openAddPosition() {
  try {
    editingPosId = null;
    document.getElementById('pos-modal-title').textContent = '포지션 추가';
    ['pos-title','pos-panel1','pos-panel2','pos-loc','pos-owner','pos-target-date','pos-memo'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.value = '';
    });
    document.getElementById('pos-etype').value = '정규직';
    const gradeBand = document.getElementById('pos-grade-band'); if(gradeBand) gradeBand.value = '';
    document.getElementById('pos-headcount').value = '1';
    document.getElementById('pos-hire-reason').value = '충원';
    document.querySelectorAll('input[name="pos-location"]').forEach(r=>{ r.checked=false; });
    const team = document.getElementById('pos-team'); if(team) team.value = '';
    const jobType = document.getElementById('pos-jobtype'); if(jobType) jobType.value = '';
    onPosLocationChange();
    // 면접관 태그 초기화
    const t1 = document.getElementById('pos-panel1-tags'); if(t1) t1.innerHTML = '';
    const t2 = document.getElementById('pos-panel2-tags'); if(t2) t2.innerHTML = '';
    const h1 = document.getElementById('pos-panel1'); if(h1) h1.value = '';
    const h2 = document.getElementById('pos-panel2'); if(h2) h2.value = '';
    const s1 = document.getElementById('pos-panel1-search'); if(s1) s1.value = '';
    const s2 = document.getElementById('pos-panel2-search'); if(s2) s2.value = '';
    loadInterviewerOptions();
    openModal('modal-position');
  } catch(err) {
    console.error('[openAddPosition] error:', err);
    toast(`포지션 정보를 불러오지 못했습니다. ${friendlyError_(err)}`, 'terr');
  }
}

function editPosition(posId) {
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!pos) return;
  editingPosId = posId;
  document.getElementById('pos-modal-title').textContent = '포지션 수정';
  document.getElementById('pos-title').value  = pos.title || '';
  document.getElementById('pos-etype').value  = pos.etype || '정규직';
  const gradeBand = document.getElementById('pos-grade-band'); if(gradeBand) gradeBand.value = normalizeGradeBand(pos.targetGradeBand, true);
  document.getElementById('pos-headcount').value = pos.headcount || 1;
  document.getElementById('pos-hire-reason').value = pos.hireReason || '충원';
  document.querySelectorAll('input[name="pos-location"]').forEach(r=>{ r.checked = r.value === (pos.location||''); });
  onPosLocationChange(pos.team || pos.dept || '', pos.jobType || '');
  restorePanelistTags(1, pos.panel1 || '');
  restorePanelistTags(2, pos.panel2 || '');
  loadInterviewerOptions();
  document.getElementById('pos-loc').value    = pos.loc    || '';
  document.getElementById('pos-owner').value  = pos.owner  || '';
  document.getElementById('pos-target-date').value = pos.targetDate || '';
  document.getElementById('pos-memo').value   = pos.memo   || '';
  openModal('modal-position');
}

function savePosition() {
  const title = document.getElementById('pos-title')?.value.trim();
  if(!title) { fieldError_('pos-title', '포지션명을 입력해 주세요.'); return; }
  const location = document.querySelector('input[name="pos-location"]:checked')?.value || '';
  const team = document.getElementById('pos-team')?.value || '';
  const jobType = document.getElementById('pos-jobtype')?.value || '';
  if(!location) { fieldError_('input[name="pos-location"]', '소속(본사/현장)을 선택해 주세요.'); return; }
  if(location==='본사' && !team) { fieldError_('pos-team', '본사 팀을 선택해 주세요.'); return; }
  if(location==='본사') {
    const validTeams = [...document.querySelectorAll('#pos-team-options option')].map(option=>option.value);
    if(!validTeams.includes(team)) { fieldError_('pos-team', `${josa_(team, '은', '는')} 팀 목록에 없습니다. 검색 목록에서 팀을 선택해 주세요.`); return; }
  }
  if(location==='현장' && !jobType) { fieldError_('pos-jobtype', '현장 직종을 선택해 주세요.'); return; }
  const etype = document.getElementById('pos-etype')?.value || '정규직';
  const targetGradeBand = normalizeGradeBand(document.getElementById('pos-grade-band')?.value, true);
  // 신규 정규직 포지션은 채용 대상 직급을 반드시 고른다. 기존 포지션은 담당자가 수정할 때 지정한다.
  if(!editingPosId && etype === '정규직' && !targetGradeBand) { fieldError_('pos-grade-band', '채용 대상 직급(사원급/간부급/혼합)을 선택해 주세요.'); return; }
  const existingPos = editingPosId ? (positions.find(p => Number(p.id) === Number(editingPosId)) || {}) : {};

  // 수정 시 폼에 없는 필드(면접관 일정 발송·확정 기록, 후보일정, rev 등)를 그대로 유지한다 —
  // 예전에는 폼 값만으로 새 객체를 만들어, 포지션을 수정할 때마다 면접관 일정 진행 기록이 지워졌다.
  const posData = {
    ...existingPos,
    id:        editingPosId || nextId(),
    title,
    etype,
    targetGradeBand,
    role:      existingPos.role || '',
    headcount: parseInt(document.getElementById('pos-headcount')?.value) || 1,
    hireReason: document.getElementById('pos-hire-reason')?.value || '충원',
    dept:      location==='본사' ? team : (existingPos.dept || jobType || ''),
    location,
    team:      location==='본사' ? team : null,
    jobType:   location==='현장' ? jobType : null,
    panel1:    document.getElementById('pos-panel1')?.value  || '',
    panel2:    document.getElementById('pos-panel2')?.value  || '',
    loc:       document.getElementById('pos-loc')?.value     || '',
    owner:     document.getElementById('pos-owner')?.value   || '',
    targetDate: document.getElementById('pos-target-date')?.value || '',
    memo:      document.getElementById('pos-memo')?.value    || '',
    createdAt: existingPos.createdAt || today(),
    status: existingPos.status || 'active',
    closedAt: existingPos.closedAt || '',
    parentPosId: existingPos.parentPosId != null ? existingPos.parentPosId : null,
    closeReason: existingPos.closeReason || '',
    closeMemo: existingPos.closeMemo || '',
  };

  if(editingPosId) {
    const idx = positions.findIndex(p => p.id === editingPosId);
    if(idx >= 0) positions[idx] = posData;
  } else {
    positions.push(posData);
    logActivity('포지션 등록', title, 'position', posData.id);
  }

  closeModal('modal-position');
  saveState();
  if(GS_CONFIG.scriptUrl && typeof syncPosToGS === 'function') syncPosToGS(posData);
  renderPositions();
  renderDashboard(); // 대시보드 칸반(미배정 스트립 포함) 즉시 반영
  if(currentPosDetailId && Number(currentPosDetailId) === Number(posData.id) && document.getElementById('sect-posdetail')?.classList.contains('on')) {
    renderPosDetailSection(posData.id);
  }
}

async function deletePosition(posId) {
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!pos) return;
  const linked = candidates.filter(c => Number(c.posId) === Number(posId)).length;
  const confirmed = await confirmActionModal({
    title:'포지션 삭제',
    message:`'${pos.title}' 포지션을 삭제합니다. 이 작업은 되돌릴 수 없습니다.`,
    items:linked > 0 ? [`연결된 지원자 ${linked}명의 포지션 연결 해제`] : ['연결된 지원자 없음'],
    confirmLabel:'포지션 삭제',
    danger:true,
  });
  if(!confirmed) return;
  if(linked > 0) {
    const unlinked = candidates.filter(c => Number(c.posId) === Number(posId));
    unlinked.forEach(c => { c.posId = null; });
    if(GS_CONFIG.scriptUrl && typeof syncCandToGS === 'function') await settleSync(unlinked.map(c => () => syncCandToGS(c)), '지원자 연결 해제 동기화');
  }
  positions = positions.filter(p => p.id !== posId);
  saveState();
  if(GS_CONFIG.scriptUrl && typeof deletePosFromGS === 'function') await deletePosFromGS(posId);
  renderPositions(); renderDashboard();
  toast(`${esc(pos.title)} 삭제 완료`, 'tok');
}

</script>
