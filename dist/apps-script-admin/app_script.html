// 면접 일정 확정 / 완료 처리
// ══════════════════════════════════════════════════════════════
let confirmingIntId = null;
let returnToPosId = null;

// 중복 면접 정리: 같은 지원자+같은 type은 1건만 유지
// 우선순위: done > confirmed > pending, 동일 상태면 최신(가장 큰 id)
function dedupeInterviews() {
  const cleaned = uniqueInterviewRecords(interviews);
  const removed = interviews.length - cleaned.length;
  if(removed > 0) {
    interviews.length = 0;
    cleaned.forEach(i => interviews.push(i));
    saveState();
  }
  return removed;
}

// 확정 취소 (포지션에서 진입한 경우 복귀)
function cancelInterviewConfirm() {
  closeModal('modal-confirm-int');
  if(returnToPosId != null) {
    const pid = returnToPosId;
    returnToPosId = null;
    setTimeout(() => openPosDetail(pid), 300);
  }
}

function confirmInterview(intId) {
  const itv = interviews.find(i => i.id === intId);
  if(!itv) return;
  confirmingIntId = intId;

  document.getElementById('ci-cand-info').textContent = `${itv.candName} · ${itv.type} 면접`;

  // 후보 일정이 있으면 선택 버튼 제공
  const picker = document.getElementById('ci-slot-picker');
  if(itv.slots && itv.slots.length > 0) {
    picker.innerHTML = '<div style="font-size:11px;color:var(--t3);margin-bottom:6px">후보 일정 중 선택:</div>' +
      itv.slots.map(s => {
        const d = new Date(s);
        const label = d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'}) + ' ' +
                      d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
        return `<button class="btn btn-sm" style="margin:0 6px 6px 0" data-action="call" data-call="document.getElementById('ci-datetime').value='${s.slice(0,16)}'">${label}</button>`;
      }).join('');
  } else {
    picker.innerHTML = '';
  }

  // 기존 확정 일시/장소 채우기
  const dt = document.getElementById('ci-datetime');
  if(itv.date && itv.date.indexOf('미정') === -1) {
    dt.value = itv.date.replace(' ', 'T').slice(0,16);
  } else {
    dt.value = '';
  }
  const locEl = document.getElementById('ci-loc');
  locEl.value = (itv.loc && itv.loc.indexOf('미정') === -1) ? itv.loc : '린스퀘어';

  closeModal('modal-detail');
  openModal('modal-confirm-int');
}

async function applyInterviewConfirm() {
  const itv = interviews.find(i => i.id === confirmingIntId);
  if(!itv) return;
  const dt  = document.getElementById('ci-datetime').value;
  const loc = document.getElementById('ci-loc').value.trim();
  if(!dt)  { toast('확정 일시를 선택하세요.', 'terr'); return; }
  if(!loc) { toast('면접 장소를 입력하세요.', 'terr'); return; }

  itv.date = dt.replace('T', ' ');
  itv.loc  = loc;
  itv.status = 'confirmed';
  itv.memo = '일정 확정됨';

  // 지원자 intDate 동기화
  const c = candidates.find(x => x.id === itv.candId);
  saveState();
  if(GS_CONFIG.scriptUrl) {
    const result = await settleSync([
      syncIntToGS(itv),
      ...(c ? [syncCandToGS(c)] : []),
    ], `${itv.type} 면접 일정 저장`);
    if(result.failed) return;
  }
  closeModal('modal-confirm-int');
  if(typeof renderIntTable === 'function') renderIntTable();
  renderTracker(); updateMetrics(); renderPositions();
  toast(`${itv.candName} ${itv.type} 면접 일정 확정 (${itv.date})`, 'tok');
  setTimeout(() => sendCandSchedule(itv.id), 300);
  // 포지션 상세에서 진입한 경우 다시 열기
  if(returnToPosId != null) {
    const pid = returnToPosId;
    returnToPosId = null;
    setTimeout(() => openPosDetail(pid), 700);
  }
}

function markInterviewDone(intId) {
  const itv = interviews.find(i => i.id === intId);
  if(!itv) return;
  if(!confirm(`${itv.candName} ${itv.type} 면접을 완료 처리하시겠습니까?`)) return;
  itv.status = 'done';
  if(GS_CONFIG.scriptUrl) syncIntToGS(itv);
  saveState();
  if(typeof renderIntTable === 'function') renderIntTable();
  closeModal('modal-detail');
  toast(`${itv.candName} ${itv.type} 면접 완료 처리`, 'tok');
}

// 포지션 상세에서 일정 확정 (확정 후 포지션 상세로 복귀)
// ── (이하 면접 일괄 배치) ──
let batchScheduleCtx = { posId: null, stageIdx: null, sourceStage: null, moveAfterApply: false };

function openPositionRoundSchedule(posId, stageIdx) {
  const prevStage = stageIdx === 1 ? 0 : 2;
  const prevCount = candidates.filter(c => Number(c.posId) === Number(posId) && c.stage === prevStage).length;
  openBatchSchedule(posId, stageIdx, prevCount ? prevStage : stageIdx, prevCount > 0);
}

function openBatchSchedule(posId, stageIdx, sourceStage = stageIdx, moveAfterApply = false) {
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!pos) return;
  const round = stageIdx === 1 ? '1차' : '2차';
  const targets = candidates.filter(c => Number(c.posId) === Number(posId) && c.stage === sourceStage);
  if(targets.length === 0) {
    toast(`${STAGES[sourceStage]} 단계 지원자가 없습니다.`, 'terr');
    return;
  }
  const orderedIds = targets.slice().sort((a,b) => a.name.localeCompare(b.name,'ko')).map(c => Number(c.id));
  batchScheduleCtx = { posId, stageIdx, sourceStage, moveAfterApply, order:orderedIds };
  document.getElementById('bs-title').textContent = `${round} 면접 공통일정 확정${moveAfterApply?' 후 단계 이동':''} — ${pos.title} (${targets.length}명)`;
  // 기본값 설정
  const dateEl = document.getElementById('bs-date');
  if(dateEl && !dateEl.value) {
    const d = new Date(); d.setDate(d.getDate() + 3); // 기본 3일 후
    dateEl.value = d.toISOString().slice(0,10);
  }
  document.getElementById('bs-start').value = '10:00';
  document.getElementById('bs-interval').value = '30';
  document.getElementById('bs-loc').value = '린스퀘어';
  // 포지션 상세는 뒤에 유지해 취소·적용 후 즉시 복귀한다.
  renderBatchPreview();
  // 입력 변경 시 미리보기 갱신
  ['bs-date','bs-start','bs-interval','bs-loc'].forEach(id => {
    const el = document.getElementById(id);
    if(el) { el.oninput = renderBatchPreview; el.onchange = renderBatchPreview; }
  });
  openModal('modal-batch-schedule');
}

function computeBatchSlots() {
  const { posId, sourceStage } = batchScheduleCtx;
  const date     = document.getElementById('bs-date')?.value;
  const start    = document.getElementById('bs-start')?.value || '10:00';
  const interval = parseInt(document.getElementById('bs-interval')?.value || '30');
  const source = candidates.filter(c => Number(c.posId) === Number(posId) && c.stage === sourceStage);
  const order = Array.isArray(batchScheduleCtx.order) ? batchScheduleCtx.order : [];
  const targets = source.slice().sort((a,b) => {
    const ai = order.indexOf(Number(a.id));
    const bi = order.indexOf(Number(b.id));
    return (ai < 0 ? 9999 : ai) - (bi < 0 ? 9999 : bi) || a.name.localeCompare(b.name,'ko');
  });

  if(!date) return { targets, slots: [] };

  const [sh, sm] = start.split(':').map(Number);
  const slots = targets.map((c, i) => {
    const total = sh * 60 + sm + i * interval;
    const hh = String(Math.floor(total / 60) % 24).padStart(2,'0');
    const mm = String(total % 60).padStart(2,'0');
    const period = Number(hh) < 12 ? 'AM' : 'PM';
    const round = batchScheduleCtx.stageIdx === 1 ? '1차' : '2차';
    const itv = interviews.find(item => Number(item.candId) === Number(c.id) && item.type === round);
    const availabilityKey = `${date}|${period}`;
    const availability = itv?.availabilityStatus === 'UNAVAILABLE' ? 'unavailable'
      : itv?.availabilityStatus !== 'RESPONDED' ? 'unknown'
      : (itv.availabilitySelections || []).includes(availabilityKey) ? 'available' : 'conflict';
    return { cand: c, time: `${hh}:${mm}`, datetime: `${date} ${hh}:${mm}`, availability };
  });
  return { targets, slots };
}

function moveBatchCandidate(candId, direction) {
  const order = batchScheduleCtx.order || [];
  const index = order.indexOf(Number(candId));
  const next = index + Number(direction);
  if(index < 0 || next < 0 || next >= order.length) return;
  [order[index], order[next]] = [order[next], order[index]];
  renderBatchPreview();
}

function renderBatchPreview() {
  const el = document.getElementById('bs-preview');
  if(!el) return;
  const { slots } = computeBatchSlots();
  if(!slots.length) {
    el.innerHTML = '<div style="color:var(--t3);padding:8px">면접 날짜를 선택하세요.</div>';
    return;
  }
  const loc = document.getElementById('bs-loc')?.value || '미정';
  el.innerHTML = slots.map((s,i) => `
    <div style="display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--border)">
      <span style="width:20px;color:var(--t3);font-size:11px">${i+1}</span>
      <span style="font-family:'DM Mono',monospace;font-weight:700;color:var(--blue);min-width:54px">${s.time}</span>
      <span style="flex:1;font-weight:600">${s.cand.name}</span>
      <span class="b ${s.availability==='available'?'bgreen':s.availability==='conflict'||s.availability==='unavailable'?'bred':'bgray'}">${s.availability==='available'?'가능':s.availability==='conflict'?'응답 불일치':s.availability==='unavailable'?'개별조율':'미응답'}</span>
      <span style="font-size:11px;color:var(--t3)">${s.cand.email}</span>
      <span style="display:flex;gap:3px"><button type="button" class="btn btn-xs" title="순서를 위로" data-action="call" data-call="moveBatchCandidate(${s.cand.id},-1)">↑</button><button type="button" class="btn btn-xs" title="순서를 아래로" data-action="call" data-call="moveBatchCandidate(${s.cand.id},1)">↓</button></span>
    </div>`).join('') +
    `<div style="padding:8px 4px 2px;font-size:11px;color:var(--t3)">📍 장소: ${loc} · 총 ${slots.length}명 · 종료 예정 ${slots[slots.length-1].time} 이후</div>`;
}

async function applyBatchSchedule() {
  const { posId, stageIdx, sourceStage, moveAfterApply } = batchScheduleCtx;
  const date = document.getElementById('bs-date')?.value;
  const loc  = document.getElementById('bs-loc')?.value || '미정';
  if(!date) { toast('면접 날짜를 선택하세요.', 'terr'); return; }

  const pos = positions.find(p => Number(p.id) === Number(posId));
  const round = stageIdx === 1 ? '1차' : '2차';
  const { slots } = computeBatchSlots();
  if(!slots.length) { toast('배치할 지원자가 없습니다.', 'terr'); return; }
  const conflicts = slots.filter(slot => slot.availability !== 'available');
  if(conflicts.length && !confirm(`선택한 날짜·시간대와 지원자 응답이 일치하지 않거나 미응답인 대상이 ${conflicts.length}명 있습니다.\n\n${conflicts.map(slot => `${slot.cand.name}: ${slot.availability==='conflict'?'응답 불일치':slot.availability==='unavailable'?'개별 조율 필요':'미응답'}`).join('\n')}\n\n그래도 일정을 확정할까요?`)) return;

  const panel = stageIdx === 1
    ? parsePanelists(pos.panel1).map(p => p.name).join(', ')
    : parsePanelists(pos.panel2).map(p => p.name).join(', ');

  let created = 0, updated = 0;
  slots.forEach(s => {
    // 기존 면접 있으면 갱신, 없으면 생성
    const existing = interviews.find(i => i.candId === s.cand.id && i.type === round);
    if(existing) {
      existing.date = s.datetime;
      existing.loc  = loc;
      existing.panel = panel || '미정';
      existing.status = 'confirmed';
      existing.notified = false;
      updated++;
    } else {
      interviews.push({
        id: nextId(),
        candId: s.cand.id, candName: s.cand.name,
        type: round,
        date: s.datetime,
        loc: loc,
        panel: panel || '미정',
        memo: `포지션 일괄 배치 (${pos.title})`,
        status: 'confirmed',
        notified: false,
      });
      created++;
    }
    s.cand.intDate = s.datetime;
    if(moveAfterApply && s.cand.stage === sourceStage) s.cand.stage = stageIdx;
  });

  saveState();
  if(GS_CONFIG.scriptUrl) {
    const syncTasks = slots.map(s => syncCandToGS(s.cand));
    // 이번 배치로 생성/갱신된 면접 동기화
    slots.forEach(s => {
      const itv = interviews.find(i => i.candId === s.cand.id && i.type === round);
      if(itv) syncTasks.push(syncIntToGS(itv));
    });
    const result = await settleSync(syncTasks, `${round} 면접 일정 동기화`);
    if(result.failed) return;
  }
  closeModal('modal-batch-schedule');
  renderDashboard(); renderTracker(); renderPositions();
  if(typeof renderIntTable === 'function') renderIntTable();
  toast(`${round} 면접 공통일정 ${slots.length}명 확정${moveAfterApply?' · 단계 이동 완료':''} (신규 ${created} / 갱신 ${updated})`, 'tok');
  setTimeout(() => sendCandidateThenPanelNotices(posId, stageIdx, round === '1차' ? 1 : 2, true), 400);
  // 적용 결과를 반영한 포지션 상세 화면으로 즉시 복귀
  refreshOpenPositionDetail(posId);
}

// 확정된 지원자 전체에게 개인별 일정 안내 (순차 발송)
function getConfirmedPositionInterviews(posId, stageIdx) {
  const round = stageIdx === 1 ? '1차' : '2차';
  const stageCands = candidates.filter(c => Number(c.posId) === Number(posId) && c.stage === stageIdx);
  return stageCands
    .map(c => interviews.find(i => i.candId === c.id && i.type === round && (i.status==='confirmed'||i.status==='done')))
    .filter(Boolean);
}

function sendAllCandSchedule(posId, stageIdx, skipConfirm) {
  const confirmedItvs = getConfirmedPositionInterviews(posId, stageIdx);
  if(!confirmedItvs.length) { toast('확정된 일정이 있는 지원자가 없습니다.', 'terr'); return; }
  if(!skipConfirm && !confirm(`확정된 ${confirmedItvs.length}명에게 각각 면접 일정 안내 메일을 작성합니다.\n${confirmedItvs.length}개의 메일 작성창이 순서대로 열립니다. 진행할까요?`)) return 0;

  // 페이지를 유지하는 순차 발송 방식으로 열어 이후 면접관 안내가 중단되지 않게 한다.
  confirmedItvs.forEach((itv, idx) => {
    setTimeout(() => sendCandSchedule(itv.id, true), idx * 650);
  });
  toast(`${confirmedItvs.length}명 안내 메일 작성창을 엽니다. 각 창에서 전송하세요.`, 'toutlook');
  return confirmedItvs.length;
}

function sendCandidateThenPanelNotices(posId, stageIdx, round, skipConfirm=false) {
  const pos = positions.find(p=>Number(p.id)===Number(posId));
  const confirmedItvs = getConfirmedPositionInterviews(posId, stageIdx);
  if(!confirmedItvs.length) { toast('확정된 일정이 있는 지원자가 없습니다.', 'terr'); return; }
  const panelists = parsePanelists(stageIdx===1 ? pos?.panel1 : pos?.panel2);
  const panelText = panelists.length ? `이후 면접관 ${panelists.length}명 단체 안내 메일이 열립니다.` : '등록된 면접관이 없어 지원자 안내만 진행됩니다.';
  if(!skipConfirm && !confirm(`지원자 ${confirmedItvs.length}명에게 개인별 면접 일정 안내 메일을 엽니다.\n${panelText}\n\n계속할까요?`)) return;
  const sentCount = sendAllCandSchedule(posId, stageIdx, true) || 0;
  if(sentCount && panelists.length) {
    setTimeout(()=>sendPanelNotice(posId, round), sentCount * 650 + 350);
  }
}

let interviewNoticeFlowCtx = { posId:null, stageIdx:null, round:null };

function openInterviewNoticeFlow(posId, stageIdx, round) {
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!pos) return;
  const confirmed = getConfirmedPositionInterviews(posId, stageIdx);
  if(!confirmed.length) { toast('확정된 일정이 있는 지원자가 없습니다.', 'terr'); return; }
  interviewNoticeFlowCtx = { posId:Number(posId), stageIdx:Number(stageIdx), round:Number(round) };
  document.getElementById('inf-title').textContent = `${round}차 면접 안내 — ${pos.title}`;
  renderInterviewNoticeFlow();
  openModal('modal-interview-notice-flow');
}

function renderInterviewNoticeFlow() {
  const { posId, stageIdx, round } = interviewNoticeFlowCtx;
  const pos = positions.find(p => Number(p.id) === Number(posId));
  const schedule = getConfirmedPositionInterviews(posId, stageIdx);
  const panelists = parsePanelists(stageIdx === 1 ? pos?.panel1 : pos?.panel2).filter(p => p.email && p.email.includes('@'));
  const candDone = schedule.length > 0 && schedule.every(i => i.candidateNotified || i.candNotified);
  const panelDone = schedule.length > 0 && schedule.every(i => i.panelNotified || i.notified);
  const el = document.getElementById('inf-status');
  if(!el) return;
  const card = (title, desc, done, action, label, disabled) => `<div style="border:1px solid ${done?'var(--gbd)':'var(--border)'};border-radius:var(--r);padding:13px;background:${done?'var(--gbg)':'var(--surface)'}">
    <div style="font-size:12.5px;font-weight:700;margin-bottom:4px">${title}</div>
    <div style="font-size:11px;color:var(--t3);min-height:34px;margin-bottom:10px">${desc}</div>
    <button class="btn btn-sm ${done?'btn-green':'btn-primary'}" data-action="call" data-call="${action}" ${disabled?'disabled':''}>${done?'발송 완료':label}</button>
  </div>`;
  el.innerHTML =
    card('지원자 개인 안내', `확정 일정 지원자 ${schedule.length}명에게 개인별 메일 발송`, candDone, `sendInterviewNoticeCandidates()`, '지원자 메일 열기', !schedule.length) +
    card('면접관 단체 안내', panelists.length ? `면접관 ${panelists.length}명에게 일정 전체를 한 메일로 발송` : '포지션에 면접관 이메일이 등록되지 않았습니다.', panelDone, `sendInterviewNoticePanel()`, '면접관 메일 열기', !panelists.length || !schedule.length);
}

function sendInterviewNoticeCandidates() {
  const { posId, stageIdx } = interviewNoticeFlowCtx;
  sendAllCandSchedule(posId, stageIdx);
  setTimeout(renderInterviewNoticeFlow, 300);
}

function sendInterviewNoticePanel() {
  const { posId, round } = interviewNoticeFlowCtx;
  sendPanelNotice(posId, round, false);
  setTimeout(renderInterviewNoticeFlow, 300);
}

// 지원자에게 확정 면접 일정 개인 안내 (면접 30분 전 도착 안내 포함)
async function sendCandSchedule(intId, sequential) {
  const itv = interviews.find(i => i.id === intId);
  if(!itv) { toast('면접 정보를 찾을 수 없습니다.', 'terr'); return; }
  const c = candidates.find(x => Number(x.id) === Number(itv.candId));
  if(!c) { toast('지원자를 찾을 수 없습니다.', 'terr'); return; }
  if(!itv.date || itv.date.indexOf('미정') !== -1) { toast('확정된 일정이 없습니다.', 'terr'); return; }

  const roundLabel = itv.type === '1차' ? '1차 실무면접' : '2차 임원면접';

  const target = getCandidateMailTarget(c);
  const subject = `[우미건설] ${esc(c.name)}님 ${roundLabel} 일정 안내`;

  const sent = await dispatchCandidateMail_(c, {
    subject, purpose: `${roundLabel} 일정`, directBody: buildIntEmail(itv, c), logType: `${itv.type}면접업체경유안내`,
    sendDirect: () => sendGeneralEmailViaGmail(target.to, subject, buildIntEmail(itv, c), `${itv.type}면접지원자안내`, c.name, {
      templateType: itv.type === '1차' ? 'interview_first' : 'interview_second',
      candidateName: c.name, positionText: c.pos,
      interviewDateTime: itv.date || '', location: itv.loc || '', panelNames: itv.panel || '', memo: itv.memo || ''
    })
  });
  if(sent === false) return;

  itv.candidateNotified = true;
  itv.candNotified = true; // 기존 로컬 데이터 호환
  c.notified = true;
  logNotify('Gmail', `${itv.type}면접${isHeadhuntingCandidate(c)?'업체경유':'지원자'}안내`, c.name, target.to);
  saveState();
  if(GS_CONFIG.scriptUrl) { syncIntToGS(itv); syncCandToGS(c); }
  toast(`${esc(c.name)}님에게 ${roundLabel} 일정 안내 메일 발송 완료`, 'tok');
}

async function sendPanelSchedule(posId, stageIdx, returnToPosition=true) {
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!pos) return;
  const round = stageIdx === 1 ? '1차' : '2차';
  const registeredPanelists = stageIdx === 1 ? parsePanelists(pos.panel1) : parsePanelists(pos.panel2);
  const panelists = registeredPanelists.filter(p => p.email && p.email.includes('@'));
  if(!panelists.length) { toast('이메일이 등록된 면접관이 없습니다. 포지션의 면접관 정보를 확인하세요.', 'terr'); return; }

  // 확정된 면접만 시간순 정렬
  const stageCands = candidates.filter(c => Number(c.posId) === Number(posId) && c.stage === stageIdx);
  const schedule = stageCands
    .map(c => interviews.find(i => i.candId === c.id && i.type === round && (i.status==='confirmed'||i.status==='done')))
    .filter(Boolean)
    .sort((a,b) => a.date.localeCompare(b.date));
  if(!schedule.length) { toast('확정된 면접 일정이 없습니다.', 'terr'); return; }

  const loc = schedule[0].loc;
  // 날짜 포맷: 2026-06-05 → 2026. 6. 5(금)
  const d = new Date(schedule[0].date.replace(' ', 'T'));
  const wk = ['일','월','화','수','목','금','토'][d.getDay()];
  const dateLabel = `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}(${wk})`;

  // 시간 범위
  const times = schedule.map(i => i.date.split(' ')[1]).filter(Boolean);
  const startT = times[0];
  // 마지막 면접 + 30분을 종료시각으로 추정
  const lastD = new Date(schedule[schedule.length-1].date.replace(' ','T'));
  lastD.setMinutes(lastD.getMinutes() + 30);
  const endT = `${String(lastD.getHours()).padStart(2,'0')}:${String(lastD.getMinutes()).padStart(2,'0')}`;

  // 면접일정 = 날짜 + 시간범위
  const scheduleLabel = `${dateLabel} ${startT}~${endT}`;

  // 면접위원 명단 (이름 + 직급)
  const panelNames = panelists.map(p => {
    const iv = interviewers.find(x => x.email === p.email);
    return iv ? `${iv.name} ${iv.rank}` : p.name;
  }).join(', ');

  const roundLabel = round === '1차' ? '1차 실무면접' : '2차 임원면접';

  // 면접 대상 (순서 + 시간 + 이름)
  const targetText = schedule.map((i, idx) =>
    `   ${idx+1}. ${i.date.split(' ')[1]}  ${esc(i.candName)} (${esc(pos.title)})`).join('\n');

  const subject = `[우미건설] ${esc(pos.title)} ${roundLabel} 면접 안내 (${scheduleLabel})`;
  const panelTemplate = document.getElementById('tpl-panel')?.value || '';
  const body = panelTemplate
    ? panelTemplate
      .replace(/\{포지션\}/g, pos.title || '')
      .replace(/\{부서\}/g, pos.dept || pos.title || '')
      .replace(/\{채용형태\}/g, pos.etype || '')
      .replace(/\{면접유형\}/g, roundLabel)
      .replace(/\{면접일정\}/g, scheduleLabel)
      .replace(/\{장소\}/g, loc || '')
      .replace(/\{면접대상\}/g, targetText)
      .replace(/\{대상인원\}/g, String(schedule.length))
      .replace(/\{면접관\}/g, panelNames)
    : `면접위원님께,\n\n${pos.dept || pos.title} ${roundLabel} 일정입니다.\n\n${scheduleLabel}\n${loc}\n\n${targetText}`;

  const emails = groupMailRecipients(panelists.map(p => p.email));
  const targetList = schedule.map(i => `${i.candName} (${pos.title})`).join('\n');
  const sent = await sendGeneralEmailViaGmail(emails, subject, body, `${round}면접관일정안내`, pos.title, {
    templateType: 'panel_schedule',
    dept: pos.dept || pos.title || '',
    etype: pos.etype || '',
    interviewType: roundLabel,
    scheduleText: scheduleLabel,
    location: loc || '',
    targetCount: schedule.length,
    panelNames,
    targetList
  });
  if(sent === false) return;

  schedule.forEach(i => { i.notified = true; i.panelNotified = true; });
  panelists.forEach(p => logNotify('Gmail', `${round}면접관일정안내`, p.name, p.email));
  saveState();
  if(GS_CONFIG.scriptUrl) schedule.forEach(i => syncIntToGS(i));
  toast(`면접위원 ${panelists.length}명에게 ${roundLabel} 안내 메일 발송 완료`, 'tok');
  if(returnToPosition) setTimeout(() => openPosDetail(posId), 300);
}

// ── (이하 기존 면접관 DB 연동) ──

// 면접관 목록 로드 (API → 전역 캐시 → 드롭다운 반영)
async function loadInterviewers() {
  const url = GS_CONFIG.interviewerUrl;
  if (GS_CONFIG.scriptUrl) {
    try {
      const rows = await gsGetAll('Interviewers', {force:true});
      if (Array.isArray(rows) && rows.length) {
        interviewers = rows.map(normalizeInterviewerForUi).filter(iv => iv.email);
        syncTeamMasterFromInterviewers(false);
        loadInterviewerOptions();
        return;
      }
    } catch(e) {
      console.warn('[loadInterviewers] GS Interviewers 로드 실패:', e.message);
    }
  }
  if (isAppsScriptDashboard_()) {
    try {
      const data = await adminApiRun_({ action:'getInterviewersFromDirectory', data:{ url } });
      if (data?.success) {
        interviewers = (data.interviewers || []).map(normalizeInterviewerForUi).filter(iv => iv.email);
        syncTeamMasterFromInterviewers(false);
        loadInterviewerOptions();
        return;
      }
      if (data?.error) console.warn('[loadInterviewers] 직원DB 서버 조회 실패:', data.error);
    } catch(e) {
      console.warn('[loadInterviewers] 직원DB 서버 조회 오류:', e.message);
    }
  }
  if (!url) return;
  try {
    const res  = await fetch(url + '?action=getInterviewers');
    const data = await res.json();
    if (data.success) {
      interviewers = (data.interviewers || []).map(normalizeInterviewerForUi).filter(iv => iv.email);
      syncTeamMasterFromInterviewers(false);
      loadInterviewerOptions();
    }
  } catch(e) {
    console.warn('[loadInterviewers] 실패:', e.message);
  }
}

function normalizeInterviewerForUi(row) {
  row = row || {};
  return {
    id: row.id || row.email || row.empNo || '',
    empNo: row.empNo || row.employeeNo || '',
    name: row.name || '',
    email: String(row.email || '').trim().toLowerCase(),
    rank: row.rank || '',
    dept: row.dept || '',
    type: row.type || '',
    active: row.active !== false && row.active !== 'false',
    status: row.status || '',
    updatedAt: row.updatedAt || '',
    label: `${row.name || ''} ${row.rank || ''} · ${row.dept || ''}`.trim()
  };
}

// 드롭다운 옵션 (검색 콤보박스 방식에서는 캐시만 갱신)
function loadInterviewerOptions() {
  // 검색 방식에서는 별도 옵션 채우기 불필요 — filterInterviewers가 처리
  if (interviewers.length === 0 && GS_CONFIG.interviewerUrl) {
    loadInterviewers();
  }
}

// 검색어로 면접관 필터링 → 목록 표시
function filterInterviewers(round) {
  const input  = document.getElementById('pos-panel' + round + '-search');
  const listEl = document.getElementById('pos-panel' + round + '-list');
  if (!input || !listEl) return;

  const q = input.value.trim().toLowerCase();
  // 이미 추가된 면접관 제외
  const added = getPanelistsFromHidden(round).map(p => p.email);

  const matched = interviewers.filter(iv => {
    if (added.includes(iv.email)) return false;
    if (!q) return true;
    const hay = (iv.name + ' ' + iv.rank + ' ' + iv.dept + ' ' + iv.email).toLowerCase();
    return hay.includes(q);
  });

  if (interviewers.length === 0) {
    listEl.innerHTML = '<div style="padding:10px 12px;font-size:12px;color:var(--t3)">면접관 목록이 비어있습니다. 설정 탭에서 면접관 DB를 연결하세요.</div>';
    listEl.style.display = 'block';
    return;
  }

  if (matched.length === 0) {
    listEl.innerHTML = '<div style="padding:10px 12px;font-size:12px;color:var(--t3)">검색 결과가 없습니다.</div>';
    listEl.style.display = 'block';
    return;
  }

  listEl.innerHTML = matched.map(iv => {
    const payload = encodeURIComponent(JSON.stringify({ id: iv.id, name: iv.name, email: iv.email, rank: iv.rank }));
    return `<div data-action="select-interviewer" data-round="${round}" data-payload="${payload}"
      style="padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)"
     >
      👤 ${esc(iv.name)} <span style="color:var(--t3);font-size:11px">${esc(iv.rank)} · ${esc(iv.dept)}</span><br>
      <span style="color:var(--t3);font-size:11px">${esc(iv.email)}</span>
    </div>`;
  }).join('');
  listEl.style.display = 'block';
}

function hideInterviewerList(round) {
  const listEl = document.getElementById('pos-panel' + round + '-list');
  if (listEl) listEl.style.display = 'none';
}

// 검색 목록에서 면접관 선택 → 태그 추가
function selectInterviewer(round, payloadStr) {
  let iv;
  try {
    const decoded = payloadStr.startsWith('%7B') ? decodeURIComponent(payloadStr) : payloadStr.replace(/&quot;/g, '"');
    iv = JSON.parse(decoded);
  } catch(e) { return; }

  const existing = getPanelistsFromHidden(round);
  if (existing.some(p => p.email === iv.email)) {
    toast(iv.name + '은(는) 이미 추가됐습니다.', 'tw');
    return;
  }

  const tagsEl = document.getElementById('pos-panel' + round + '-tags');
  const tag = document.createElement('span');
  tag.style.cssText = 'display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--s2);border:1px solid var(--border);border-radius:12px;font-size:12px;cursor:default';
  tag.innerHTML = `👤 ${esc(iv.name)} <span style="color:var(--t3);font-size:11px">${esc(iv.rank)}</span> <button data-action="call" data-call="removePanelist(this,${round})" style="background:none;border:none;cursor:pointer;color:var(--t3);padding:0;font-size:13px;line-height:1;margin-left:2px">×</button>`;
  tag.dataset.email = iv.email;
  tag.dataset.name  = iv.name;
  tagsEl.appendChild(tag);

  syncPanelistHidden(round);

  // 검색창 초기화 및 목록 닫기
  const input = document.getElementById('pos-panel' + round + '-search');
  if (input) input.value = '';
  hideInterviewerList(round);
}

// (구) select 기반 addPanelist — 호환용 유지
function addPanelist(round) {
  const sel = document.getElementById('pos-panel' + round + '-sel');
  if (!sel || !sel.value) return;
  selectInterviewer(round, sel.value.replace(/"/g, '&quot;'));
  sel.value = '';
}

// 태그 제거
function removePanelist(btn, round) {
  btn.closest('span').remove();
  syncPanelistHidden(round);
}

// 태그 → hidden input (기존 parsePanelists 호환 형식: "이름 이메일, 이름 이메일")
function syncPanelistHidden(round) {
  const tagsEl   = document.getElementById('pos-panel' + round + '-tags');
  const hiddenEl = document.getElementById('pos-panel' + round);
  if (!tagsEl || !hiddenEl) return;
  const parts = Array.from(tagsEl.querySelectorAll('span[data-email]'))
    .map(t => t.dataset.name + ' ' + t.dataset.email);
  hiddenEl.value = parts.join(', ');
}

// hidden input → 태그 복원 (editPosition 시 기존 데이터 복원)
function restorePanelistTags(round, panelStr) {
  const tagsEl   = document.getElementById('pos-panel' + round + '-tags');
  const hiddenEl = document.getElementById('pos-panel' + round);
  if (!tagsEl) return;
  tagsEl.innerHTML = '';
  if (!panelStr) return;
  parsePanelists(panelStr).forEach(p => {
    const tag = document.createElement('span');
    tag.style.cssText = 'display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--s2);border:1px solid var(--border);border-radius:12px;font-size:12px;cursor:default';
    tag.innerHTML = `👤 ${esc(p.name)} <span style="color:var(--t3);font-size:11px"></span> <button data-action="call" data-call="removePanelist(this,${round})" style="background:none;border:none;cursor:pointer;color:var(--t3);padding:0;font-size:13px;line-height:1;margin-left:2px">×</button>`;
    tag.dataset.email = p.email;
    tag.dataset.name  = p.name;
    tagsEl.appendChild(tag);
  });
  if (hiddenEl) hiddenEl.value = panelStr;
}

// hidden input 현재값 파싱
function getPanelistsFromHidden(round) {
  const el = document.getElementById('pos-panel' + round);
  return el ? parsePanelists(el.value) : [];
}

// 면접관 API 연결 테스트
async function testInterviewerConnection() {
  const url    = document.getElementById('cfg-interviewer-url')?.value?.trim();
  const status = document.getElementById('interviewer-conn-status');
  if (!url) { if(status) status.textContent = 'URL을 입력하세요.'; return; }
  if(status) status.textContent = '테스트 중...';
  try {
    GS_CONFIG.interviewerUrl = url;
    await loadInterviewers();
    if (interviewers.length) {
      if(status) status.textContent = `✅ 연결 성공 — 면접관 ${interviewers.length}명 로드`;

// 구글시트(레퍼런스상태)에서 접수/응답 현황을 가져와 candidates에 반영
async function syncRefFromGS() {
  const url = GS_CONFIG.refAutoUrl || document.getElementById('cfg-ref-auto-url')?.value?.trim();
  const status = document.getElementById('ref-auto-conn-status');
  if(!url) { toast('레퍼런스 자동화 URL을 먼저 입력하세요.', 'terr'); return; }
  if(status) status.textContent = '가져오는 중...';
  try {
    const res = await fetch(url + '?action=getRefStatus');
    const data = await res.json();
    if(!data || !Array.isArray(data.data)) { if(status) status.textContent='❌ 응답 오류'; return; }

    // surveySent 플래그 보존용으로 기존 refDetails 백업 후 전체 초기화
    const prevRefDetails = {};
    Object.keys(refDetails).forEach(id => { prevRefDetails[id] = refDetails[id]; delete refDetails[id]; });
    // 구글시트에 없는 지원자의 ref 상태도 초기화
    candidates.forEach(c => {
      if(c.ref === '진행중' || c.ref === '완료') {
        c.refT = 3; c.refD = 0; c.ref = '대기';
      }
    });

    let matched = 0, unmatched = 0;
    data.data.forEach(rs => {
      // 이름 + 이메일로 지원자 매칭
      const c = candidates.find(x =>
        String(x.name||'').trim() === String(rs.candName||'').trim() &&
        String(x.email||'').trim().toLowerCase() === String(rs.candEmail||'').trim().toLowerCase());
      if(!c) { unmatched++; return; }
      matched++;
      // 접수/응답 수 반영
      c.refT = rs.total || 3;
      c.refD = rs.responded || 0;
      c.ref  = rs.responded >= (rs.total||3) ? '완료' : (rs.registered>0 ? '진행중' : c.ref);
      // 추천인 상세 동기화 (surveySent 플래그 보존: 재동기화 시 중복 발송 방지)
      const prevRefs = prevRefDetails[c.id] || [];
      refDetails[c.id] = (rs.refs||[]).map(r => {
        const existing = prevRefs.find(x => String(x.email||'').toLowerCase() === String(r.refEmail||'').toLowerCase());
        return {
          name: r.refName, email: r.refEmail, relation: r.rel,
          status: r.status === '응답' ? '응답' : (r.status === '등록' ? '등록' : '대기'),
          remindCnt: r.remindCnt || 0,
          responseText: r.responseText || r.summary || r.comment || r.answer || r.response || r.notes || '',
          surveySent: existing?.surveySent || false,
        };
      }).filter(r => (r.name || r.email) && !isLegacyPlaceholderRef(r));
      const actualRefs = refDetails[c.id];
      c.refT = Number(rs.total) || actualRefs.length || 3;
      c.refD = actualRefs.filter(r => r.status === '응답').length;
      c.ref = c.refD >= c.refT && c.refT > 0 ? '완료' : (actualRefs.length ? '진행중' : c.ref);
    });
    // 응답 원문 동기화 (AI 요약 원본 데이터)
    const matchedCands = data.data
      .map(rs => candidates.find(x =>
        String(x.name||'').trim() === String(rs.candName||'').trim() &&
        String(x.email||'').trim().toLowerCase() === String(rs.candEmail||'').trim().toLowerCase()))
      .filter(Boolean);
    for (const c of matchedCands) {
      try {
        const rRes = await fetch(url + '?action=getRefResponses&candName=' + encodeURIComponent(c.name));
        const rData = await rRes.json();
        if (rData && Array.isArray(rData.data)) {
          rData.data.forEach(r => {
            const ref = (refDetails[c.id] || []).find(x =>
              String(x.email||'').toLowerCase() === String(r.refEmail||'').toLowerCase());
            if (ref) ref.responseText = r.responseText || '';
          });
        }
      } catch(_) {}
    }

    saveState();
    renderReference();
    updateMetrics();
    if(status) status.textContent = `✅ ${matched}명 동기화${unmatched ? ` · 미매칭 ${unmatched}건` : ''}`;
    toast(`레퍼런스 ${matched}명 동기화 완료${unmatched ? ` · 지원자 미매칭 ${unmatched}건` : ''}`, unmatched ? 'tw' : 'tok');
  } catch(e) {
    if(status) status.textContent = '❌ 실패: ' + e.message;
  }
}


// ── (기존 함수 계속)
function parsePanelists(str) {
  if(!str) return [];
  return str.split(',').map(s => s.trim()).filter(Boolean).map(s => {
    const parts = s.split(' ').filter(Boolean);
    const email = parts.find(p => p.includes('@')) || '';
    const name  = parts.filter(p => !p.includes('@')).join(' ');
    return { name, email };
  }).filter(p => p.name);
}

// ── 면접관 안내 발송 (이메일 + Teams) ───────────────────────
// 면접관 참석 안내 — sendPanelSchedule로 통합 (round 1/2 → stageIdx 1/3 변환)
function sendPanelNotice(posId, round, returnToPosition=true) {
  const stageIdx = round === 1 ? 1 : 3;
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!pos) return;
  const roundLabel = round === 1 ? '1차' : '2차';

  // 확정된 면접 일정이 있는지 확인
  const stageCands = candidates.filter(c => Number(c.posId) === Number(posId) && c.stage === stageIdx);
  const confirmed = stageCands.filter(c =>
    interviews.some(i => i.candId === c.id && i.type === roundLabel && (i.status==='confirmed'||i.status==='done'))
  );

  if(stageCands.length === 0) { toast(`${roundLabel} 면접 대상 지원자가 없습니다.`, 'terr'); return; }
  if(confirmed.length === 0) {
    toast(`확정된 면접 일정이 없습니다. 먼저 지원자 일정을 확정하세요.`, 'terr');
    return;
  }
  if(confirmed.length < stageCands.length) {
    if(!confirm(`${stageCands.length}명 중 ${confirmed.length}명만 일정이 확정됐습니다.\n확정된 ${confirmed.length}명 기준으로 면접관에게 안내하시겠습니까?`)) return;
  }
  // 통합 함수 호출 (공문 양식 + 첨부 안내)
  sendPanelSchedule(posId, stageIdx, returnToPosition);
}

// ── 일괄 단계 변경 ────────────────────────────────────────────
function hasConfirmedRoundSchedule(candId, stageIdx) {
  const round = stageIdx === 1 ? '1차' : stageIdx === 3 ? '2차' : '';
  if(!round) return true;
  return interviews.some(i => Number(i.candId) === Number(candId) && i.type === round &&
    (i.status === 'confirmed' || i.status === 'done') && i.date);
}

function preserveCompletedStage(c, fromStage, decision='') {
  if(!c) return null;
  c.lastCompletedStage = Number(fromStage);
  c.lastStageChangedAt = new Date().toISOString();
  if(fromStage !== 1 && fromStage !== 3) return null;
  const round = fromStage === 1 ? '1차' : '2차';
  const itv = interviews.find(i => Number(i.candId)===Number(c.id) && i.type===round);
  if(!itv) return null;
  itv.status = 'done';
  if(decision) itv.result = decision;
  itv.evaluatedAt = new Date().toISOString();
  return itv;
}

function resetCandidateProgressForRollback(c, newStage) {
  const removedInterviewIds = [];
  if(!c) return removedInterviewIds;

  interviews = interviews.filter(i => {
    if(Number(i.candId) !== Number(c.id)) return true;
    const interviewStage = i.type === '1차' ? 1 : i.type === '2차' ? 3 : 99;
    const remove = newStage === 0 || interviewStage > newStage;
    if(remove) removedInterviewIds.push(i.id);
    return !remove;
  });

  if(newStage < 2) {
    c.ref = '미시작';
    c.refD = 0;
    c.refT = 0;
    delete refDetails[c.id];
    delete refReports[c.id];
  }

  c.lastCompletedStage = newStage > 0 ? newStage - 1 : null;
  c.lastStageChangedAt = new Date().toISOString();
  c.decision = '';
  c.finalAt = '';
  c.rejectedAt = '';
  c.rejectReason = '';
  c.rejectMemo = '';
  c.held = false;

  const remainingSchedule = interviews.find(i => Number(i.candId) === Number(c.id) && i.date);
  c.intDate = remainingSchedule ? remainingSchedule.date : '';
  if(newStage === 0) {
    c.notified = false;
    c.mailPending = false;
    c.mailPendingLabel = '';
  }
  return removedInterviewIds;
}

async function batchStageChange(posId, fromStage, toStage) {
  const targets = candidates.filter(c => Number(c.posId) === Number(posId) && c.stage === fromStage);
  if(!targets.length) { toast('대상 지원자가 없습니다.', 'terr'); return; }

  // 면접 단계 진입은 포지션 공통일정을 먼저 확정한 뒤 일괄 이동한다.
  if(toStage === 1 || toStage === 3) {
    const missing = targets.filter(c => !hasConfirmedRoundSchedule(c.id, toStage));
    if(missing.length) {
      if(!confirm(`${STAGES[toStage]} 공통일정이 확정되지 않았습니다.\n\n일정 요청·이메일 안내 없이 ${targets.length}명을 바로 이동할까요?\n미완료 항목은 대시보드 '처리 필요'에 표시됩니다.`)) return;
    }
  }

  // 면접 단계에서 다음 단계로 일괄 이동할 때도 전원 일정 확정을 필수로 한다.
  if(fromStage === 1 || fromStage === 3) {
    const missing = targets.filter(c => !hasConfirmedRoundSchedule(c.id, fromStage));
    if(missing.length) {
      if(!confirm(`면접 일정이 확정되지 않은 지원자가 ${missing.length}명 있습니다.\n\n일정 확정·안내 없이 다음 단계로 이동할까요?\n단계를 지나간 뒤에는 일정 미확정 건이 '처리 필요'에서 자동 추적되지 않을 수 있습니다.`)) return;
    }
  }

  if(!confirm(`${targets.length}명을 ${STAGES[toStage]} 단계로 이동하시겠습니까?`)) return;
  const completedInterviews = [];
  const removedInterviewIds = [];
  const flow = positions.find(p => Number(p.id) === Number(posId)) ? getPositionFlow(positions.find(p => Number(p.id) === Number(posId))) : FLOW;
  const movingBackward = flowIndex(toStage, flow) < flowIndex(fromStage, flow);
  targets.forEach(c => {
    if(movingBackward) {
      removedInterviewIds.push(...resetCandidateProgressForRollback(c, toStage));
    } else {
      const itv = preserveCompletedStage(c, fromStage);
      if(itv) completedInterviews.push(itv);
    }
    c.stage = toStage;
    syncReferralFromCandidate(c);
  });
  saveState();
  if(GS_CONFIG.scriptUrl) await settleSync([
    ...targets.map(c => syncCandToGS(c)),
    ...completedInterviews.map(i => syncIntToGS(i)),
    ...removedInterviewIds.map(id => deleteIntFromGS(id)),
  ], movingBackward ? '단계 일괄 되돌리기 동기화' : '단계 일괄 이동 동기화');
  renderDashboard(); renderTracker(); renderPositions();
  toast(`${targets.length}명 ${STAGES[toStage]} 단계로 일괄 이동 완료`, 'tok');
}

function savePosition() {
  const title = document.getElementById('pos-title')?.value.trim();
  if(!title) { toast('포지션명을 입력하세요.', 'terr'); return; }
  const location = document.querySelector('input[name="pos-location"]:checked')?.value || '';
  const team = document.getElementById('pos-team')?.value || '';
  const jobType = document.getElementById('pos-jobtype')?.value || '';
  if(!location) { toast('소속을 선택하세요.', 'terr'); return; }
  if(location==='본사' && !team) { toast('본사 팀을 선택하세요.', 'terr'); return; }
  if(location==='현장' && !jobType) { toast('현장 직종을 선택하세요.', 'terr'); return; }
  const existingPos = editingPosId ? (positions.find(p => Number(p.id) === Number(editingPosId)) || {}) : {};

  const posData = {
    id:        editingPosId || nextId(),
    title,
    etype:     document.getElementById('pos-etype')?.value   || '정규직',
    role:      existingPos.role || '',
    headcount: parseInt(document.getElementById('pos-headcount')?.value) || 1,
    hireReason: document.getElementById('pos-hire-reason')?.value || '충원',
    dept:      location==='본사' ? team : (existingPos.dept || jobType || ''),
    location,
    team:      location==='본사' ? team : null,
    jobType:   location==='현장' ? jobType : null,
    panel1:    document.getElementById('pos-panel1')?.value  || '',
    panel2:    document.getElementById('pos-panel2')?.value  || '',
    loc:       document.getElementById('pos-loc')?.value     || '',
    owner:     document.getElementById('pos-owner')?.value   || '',
    targetDate: document.getElementById('pos-target-date')?.value || '',
    memo:      document.getElementById('pos-memo')?.value    || '',
    createdAt: existingPos.createdAt || today(),
    status: existingPos.status || 'active',
    closedAt: existingPos.closedAt || '',
    parentPosId: existingPos.parentPosId != null ? existingPos.parentPosId : null,
    closeReason: existingPos.closeReason || '',
    closeMemo: existingPos.closeMemo || '',
  };

  if(editingPosId) {
    const idx = positions.findIndex(p => p.id === editingPosId);
    if(idx >= 0) positions[idx] = posData;
    toast(`${title} 수정 완료`, 'tok');
  } else {
    positions.push(posData);
    logActivity('포지션 등록', title, 'position', posData.id);
    toast(`${title} 등록 완료`, 'tok');
  }

  closeModal('modal-position');
  saveState();
  if(GS_CONFIG.scriptUrl && typeof syncPosToGS === 'function') syncPosToGS(posData);
  renderPositions();
  renderDashboard(); // 대시보드 칸반(미배정 스트립 포함) 즉시 반영
  if(currentPosDetailId && Number(currentPosDetailId) === Number(posData.id) && document.getElementById('sect-posdetail')?.classList.contains('on')) {
    renderPosDetailSection(posData.id);
  }
}

async function deletePosition(posId) {
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!pos) return;
  const linked = candidates.filter(c => Number(c.posId) === Number(posId)).length;
  if(linked > 0) {
    if(!confirm(`이 포지션에 연결된 지원자 ${linked}명이 있습니다. 삭제하면 연결이 해제됩니다. 계속할까요?`)) return;
    const unlinked = candidates.filter(c => Number(c.posId) === Number(posId));
    unlinked.forEach(c => { c.posId = null; });
    if(GS_CONFIG.scriptUrl && typeof syncCandToGS === 'function') await settleSync(unlinked.map(c => syncCandToGS(c)), '지원자 연결 해제 동기화');
  }
  positions = positions.filter(p => p.id !== posId);
  saveState();
  if(GS_CONFIG.scriptUrl && typeof deletePosFromGS === 'function') await deletePosFromGS(posId);
  renderPositions(); renderDashboard();
  toast(`${esc(pos.title)} 삭제 완료`, 'tok');
}

const LS_KEY = 'woomic_recruit_v4';



function showSyncStatus(msg, type='') {
  const colors = { ok:'var(--green)', warn:'var(--amber)', '':'var(--t3)' };
  const el = document.getElementById('gs-conn-status');
  if(el) { el.textContent = msg; el.style.color = colors[type]||colors['']; }
  const dot = document.getElementById('sb-sync-dot');
  const label = document.getElementById('sb-sync-label');
  const banner = document.getElementById('sync-fail-banner');
  const failed = type === 'warn' && /실패|응답 없음|연결 실패/.test(String(msg));
  const syncing = type === '' && /중|로드|확인/.test(String(msg));
  if(dot) dot.className = `sb-sync-dot${failed?' fail':type==='ok'?' ok':syncing?' ing':''}`;
  if(label) label.textContent = failed ? '동기화 실패 · 수동 확인 필요' : type === 'ok' ? `마지막 동기화 · ${now()}` : String(msg || '동기화 대기').replace(/^⚠\s*/,'');
  if(banner) banner.style.display = failed ? 'flex' : type === 'ok' ? 'none' : banner.style.display;
}

function getAuxStateSnapshot() {

    updatedAt: auxUpdatedAt || new Date().toISOString(),
    onboardings,
    notifyLog: notifyLog.slice(0,200),
    refDetails,
    refReports,
    activityLog: activityLog.slice(0,300),
  };
}

function getAuxFingerprint() {
  return JSON.stringify({
    onboardings,
    notifyLog: notifyLog.slice(0,200),
    refDetails,
    refReports,
    activityLog: activityLog.slice(0,300),
  });
}

function chunkText(text, size=1400) {
  return String(text || '').match(new RegExp(`[\\s\\S]{1,${size}}`, 'g')) || [''];
}

async function syncAuxStateToGS() {
  if(!GS_CONFIG.scriptUrl || auxSyncSuspended) return;
  const json = JSON.stringify(getAuxStateSnapshot());
  const chunks = chunkText(json);
  const tasks = [
    gsUpsert('Settings', {id:'auxState:meta', value:JSON.stringify({count:chunks.length,updatedAt:auxUpdatedAt})}),
    ...chunks.map((value,i)=>gsUpsert('Settings',{id:`auxState:${i}`,value})),
  ];
  await settleSync(tasks, '보조 데이터 동기화');
}

function scheduleAuxStateSync() {
  if(auxSyncSuspended || !GS_CONFIG.scriptUrl) return;
  clearTimeout(auxSyncTimer);
  auxSyncTimer = setTimeout(syncAuxStateToGS, 1800);
}

async function loadAuxStateFromGS() {
  if(!hasGsBridge_()) return false;
  const rows = await gsGetAll('Settings');
  const coreDeleted = applyRemoteGsTombstones(rows);
  if(coreDeleted) {
    renderDashboard();
    renderTracker();
    renderPositions();
  }
  const map = new Map(rows.map(r=>[String(r.id),String(r.value??'')]));
  let meta;
  try { meta = JSON.parse(map.get('auxState:meta') || ''); } catch(e) { return false; }
  if(!meta?.count) return false;
  let json = '';
  for(let i=0;i<meta.count;i++) json += map.get(`auxState:${i}`) || '';
  try {
    const remote = JSON.parse(json);
    if(auxUpdatedAt && remote.updatedAt && String(auxUpdatedAt) >= String(remote.updatedAt)) return false;
    onboardings = remote.onboardings || onboardings;
    notifyLog = remote.notifyLog || notifyLog;
    refDetails = remote.refDetails || refDetails;
    refReports = remote.refReports || refReports;
    activityLog = remote.activityLog || activityLog;
    auxUpdatedAt = remote.updatedAt || meta.updatedAt || '';
    saveState();
    return true;
  } catch(e) {
    console.warn('보조 데이터 GS 로드 실패:', e);
    return false;
  }
}

function saveState() {
  let auxChanged = false;
  try {
    const auxFingerprint = getAuxFingerprint();
    auxChanged = auxFingerprint !== lastAuxFingerprint;
    if(auxChanged) {
      lastAuxFingerprint = auxFingerprint;
      if(!auxSyncSuspended) auxUpdatedAt = new Date().toISOString();
    }
    const data = JSON.stringify({ candidates, interviews, onboardings, notifyLog: notifyLog.slice(0,200), refDetails, refReports, positions, referrals, rewards, refRules, employees, activityLog: activityLog.slice(0,300), auxUpdatedAt });
    if(data !== lastLocalStateJson) {
      localStorage.setItem(LS_KEY, data);
      lastLocalStateJson = data;
    }
    if(auxChanged) scheduleAuxStateSync();
  } catch(e) {
    if(e.name === 'QuotaExceededError' || e.code === 22) {
      notifyLog = notifyLog.slice(0, 50);
      activityLog = activityLog.slice(0, 100);
      try { localStorage.setItem(LS_KEY, JSON.stringify({ candidates, interviews, onboardings, notifyLog, refDetails, refReports, positions, referrals, rewards, refRules, employees, activityLog, auxUpdatedAt })); if(auxChanged) scheduleAuxStateSync(); }
      catch(e2) { console.warn('localStorage 저장 실패:', e2); }
    }
  }
}

// 시간 입력을 10분 단위로 보정 (정시 00분 기준)
function snapTo10(el) {
  if(!el || !el.value) return;
  const v = el.value;
  // datetime-local: "2026-06-05T14:23" / time: "14:23"
  const isDT = v.indexOf('T') !== -1;
  const timePart = isDT ? v.split('T')[1] : v;
  if(!timePart) return;
  let [h, m] = timePart.split(':').map(Number);
  if(isNaN(h) || isNaN(m)) return;
  // 가장 가까운 10분으로 반올림
  let snapped = Math.round(m / 10) * 10;
  if(snapped === 60) { snapped = 0; h = (h + 1) % 24; }
  const hh = String(h).padStart(2,'0');
  const mm = String(snapped).padStart(2,'0');
  el.value = isDT ? `${v.split('T')[0]}T${hh}:${mm}` : `${hh}:${mm}`;
}

// ── 날짜 형식 정규화 ─────────────────────────────────────────
function formatDate(val) {
  if(!val) return '';
  // ISO 형식 (2026-05-18T15:00:00.000Z) → YYYY-MM-DD
  if(typeof val === 'string' && val.includes('T')) {
    return val.split('T')[0];
  }
  // Excel 날짜 숫자 (46160 등) → YYYY-MM-DD
  if(typeof val === 'number' || (typeof val === 'string' && /^\d{5}$/.test(val))) {
    const num = parseInt(val);
    const date = new Date((num - 25569) * 86400 * 1000);
    return date.toISOString().split('T')[0];
  }
  // 이미 YYYY-MM-DD 형식
  return String(val).split('T')[0];
}

function today() { return new Date().toISOString().split('T')[0]; }

// ── 레퍼런스 메트릭 필터 ─────────────────────────────────────
function setRefFilter(filterType) {
  refMetricFilter = refMetricFilter === filterType ? '' : filterType;
  renderRefFilterPanel();
  renderReference();
  // 필터 패널으로 스크롤
  if(refMetricFilter) {
    const panel = document.getElementById('ref-filter-panel');
    if(panel) panel.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }
}

function renderRefFilterPanel() {
  const panel = document.getElementById('ref-filter-panel');
  const title = document.getElementById('ref-filter-panel-title');
  const body  = document.getElementById('ref-filter-panel-body');
  if(!panel || !title || !body) return;

  if(!refMetricFilter) {
    panel.style.display = 'none';
    return;
  }

  // 필터별 대상 결정
  const configs = {
    ready: { label:'발송 대기 — 레퍼런스 대상 미시작', color:'var(--blue)',
             list: candidates.filter(c=>requiresReferenceCheck(c)&&c.stage>=2&&c.ref==='미시작') },
    ing:   { label:'진행 중 — 레퍼런스 응답 수집 중', color:'var(--amber)',
             list: candidates.filter(c=>requiresReferenceCheck(c)&&c.ref==='진행중') },
    zero:  { label:'전무응답 — 추천인 0명 응답 (즉시 리마인드 필요)', color:'var(--red)',
             list: candidates.filter(c=>requiresReferenceCheck(c)&&c.ref==='진행중'&&c.refD===0) },
    done:  { label:'완료 — 전원 응답 완료', color:'var(--green)',
             list: candidates.filter(c=>requiresReferenceCheck(c)&&c.ref==='완료') },
    pend:  { label:'총 미응답 추천인 보유 — 리마인드 필요', color:'var(--amber)',
             list: candidates.filter(c=>requiresReferenceCheck(c)&&c.ref==='진행중'&&c.refD<c.refT) },
  };

  const cfg = configs[refMetricFilter];
  if(!cfg) { panel.style.display='none'; return; }

  panel.style.display = '';
  title.textContent   = `${cfg.label} (${cfg.list.length}명)`;
  title.style.color   = cfg.color;

  if(!cfg.list.length) {
    body.innerHTML = '<div style="padding:20px;text-align:center;color:var(--t3);font-size:12.5px">해당 대상자가 없습니다.</div>';
    return;
  }

  body.innerHTML = cfg.list.map(c => {
    const pct      = c.refT > 0 ? Math.round(c.refD/c.refT*100) : 0;
    const urgColor = c.refD===0?'var(--red)':c.refD<c.refT?'var(--amber)':'var(--green)';
    const refInfo  = c.ref==='미시작'
      ? '<span style="font-size:11px;color:var(--t3)">레퍼런스 미시작</span>'
      : `<div style="margin-top:5px">
          <div style="font-size:11px;font-weight:700;color:${urgColor};margin-bottom:3px">${c.refD}/${c.refT}명 응답 (${pct}%)</div>
          <div class="prog" style="height:4px"><div class="pf-bar" style="width:${pct}%;background:${urgColor}"></div></div>
         </div>`;

    const actionBtns = c.ref==='미시작'
      ? `<button class="btn btn-xs btn-primary" data-action="call" data-call="startRef(${c.id})">체크 시작</button>`
      : c.ref==='진행중'
        ? `<button class="btn btn-xs btn-outlook" data-action="call" data-call="remindRef(${c.id})">리마인드</button>
           <button class="btn btn-xs" data-action="call" data-call="selectRefCand(${c.id})">추적</button>`
        : '<span class="b bgreen" style="font-size:10px">✓ 완료</span>';

    return `<div style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border)">
      <div style="width:32px;height:32px;border-radius:50%;background:var(--acc-light);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--acc);flex-shrink:0">${c.name.charAt(0)}</div>
      <div style="flex:1">
        <div style="font-weight:700;font-size:13px">${esc(c.name)} ${etypePill(c.etype)}</div>
        <div style="font-size:11px;color:var(--t3)">${esc(c.pos)}${c.dept?' · '+c.dept:''} ${badge(c.stage)}</div>
        ${refInfo}
      </div>
      <div style="display:flex;gap:5px;flex-shrink:0">${actionBtns}</div>
    </div>`;
  }).join('');
}

let kanbanView = 'pos'; // 'pos'(기본) | 'stage'
function switchKanban(view){
  kanbanView = view;
  const stageOn = view === 'stage';
  const stageEl = document.getElementById('dash-stage-kanban');
  const posEl   = document.getElementById('dash-kanban');
  if(stageEl) stageEl.style.display = stageOn ? '' : 'none';
  if(posEl)   posEl.style.display   = stageOn ? 'none' : '';
  const ts = document.getElementById('kb-tab-stage'); if(ts) ts.classList.toggle('on', stageOn);
  const tp = document.getElementById('kb-tab-pos');   if(tp) tp.classList.toggle('on', !stageOn);
  stageOn ? renderStageKanban() : renderKanban();
}

// ── 대시보드 채용단계별 지원자 칸반 ──────────────────────────
function dashDropStage(e, stageIdx) {
  e.preventDefault();
  const col = e.currentTarget;
  if(col) col.classList.remove('drag-over');
  const candId = Number(e.dataTransfer.getData('text/plain'));
  const c = candidates.find(x => Number(x.id) === candId);
  if(!c) return;
  if(c.stage === stageIdx) return;
  requestStageChange(c.id, stageIdx);
}

function renderStageKanban() {
  const el = document.getElementById('dash-stage-kanban');
  if(!el) return;

  const cols = KANBAN_FLOW.map(idx => ({ idx, name: STAGES[idx] }));
  const activeCandidates = candidates.filter(isActivePipelineCand);

  if(!activeCandidates.length) {
    el.innerHTML = '<div style="padding:24px;text-align:center;font-size:12px;color:var(--t3)">진행 중인 지원자가 없습니다.</div>';
    return;
  }

  // 1패스 그룹화: stage → 지원자[] (단계별 전체 배열 반복 검색 제거)
  const byStage = {};
  activeCandidates.forEach(c => { (byStage[c.stage] = byStage[c.stage] || []).push(c); });
  // 알림 미발송 면접 보유 지원자 집합 (매 카드마다 interviews 순회하지 않도록 사전 계산)
  const intWarnSet = new Set(interviews.filter(i => !i.notified).map(i => Number(i.candId)));

  el.innerHTML = `<div class="stage-kanban">${cols.map(col => {
    const list = (byStage[col.idx] || [])
      .slice()
      .sort((a,b) => (a.name||'').localeCompare(b.name||'', 'ko'));
    const color = STAGE_COLORS[col.idx] || 'var(--t3)';

    return `<div class="stage-col"
                 data-ondragover="event.preventDefault();this.classList.add('drag-over')"
                 data-ondragleave="this.classList.remove('drag-over')"
                 data-ondrop="dashDropStage(event,${col.idx})">
      <div class="stage-col-h">
        <div class="stage-col-title" style="color:${color}">
          <span style="width:7px;height:7px;border-radius:50%;background:${color};display:inline-block"></span>
          ${col.name}
        </div>
        <div class="stage-col-count">${list.length}명</div>
      </div>
      <div class="stage-drop">
        ${list.length ? list.map(c => {
          const nextStage = nextFlowStage(c.stage, c.posId);
          const hasNext = nextStage !== c.stage;
          const refWarn = c.ref === '진행중' && Number(c.refD || 0) === 0;
          const intWarn = intWarnSet.has(Number(c.id));
          const joinInfo = Number(c.stage) === 5 ? `<span class="b ${getCandidateJoinDate(c)?'bgreen':'bamber'}" style="font-size:10px">${esc(getCandidateJoinDateLabel(c))}</span>` : '';
          return `<div class="stage-card"
                       draggable="true"
                       role="button" tabindex="0" data-onkeydown="kbActivate(event)"
                       data-ondragstart="event.dataTransfer.setData('text/plain','${c.id}')"
                       data-action="open-candidate" data-id="${c.id}">
            <div class="stage-card-name">${esc(c.name)} ${etypePill(c.etype)}</div>
            <div class="stage-card-meta">${esc(c.pos || '')}</div>
            <div class="stage-card-tags">
              ${c.role ? `<span class="role ${ROLE_CLS[c.role] || ''}">${esc(c.role)}</span>` : ''}
              ${joinInfo}
              ${refWarn ? '<span class="b bred" style="font-size:10px">레퍼런스 확인</span>' : ''}
              ${intWarn ? '<span class="b bamber" style="font-size:10px">면접안내 미발송</span>' : ''}
            </div>
            <div class="stage-card-actions">
              <button class="btn btn-xs btn-ghost" data-action="open-candidate" data-id="${c.id}" data-stop="true">상세</button>
              ${hasNext ? `<button class="btn btn-xs btn-primary" data-action="call" data-call="event.stopPropagation();requestStageChange(${c.id},${nextStage})">${STAGES[nextStage]} →</button>` : '<span style="font-size:10px;color:var(--t3)">최종 단계</span>'}
            </div>
          </div>`;
        }).join('') : '<div class="stage-empty">해당 단계 지원자 없음</div>'}
      </div>
    </div>`;
  }).join('')}</div>
  <div style="font-size:11px;color:var(--t3);margin-top:6px">카드를 클릭하면 상세정보를 확인할 수 있으며, 드래그하여 단계 변경도 가능합니다. 단계 변경 시 기존 확인 팝업이 표시됩니다.</div>`;
}

function updateMetrics() {
  const set = (id, v) => { const el=document.getElementById(id); if(el) el.innerHTML=v; };
  const active = candidates.filter(isActivePipelineCand);
  const activePos = positions.filter(p => ['active','partial'].includes(posStatus(p)));
  const activePositionIds = new Set(activePos.map(p => Number(p.id)));
  const pipeline = candidates.filter(c =>
    c.posId != null && c.posId !== '' &&
    activePositionIds.has(Number(c.posId)) &&
    Number(c.stage) >= 0 && Number(c.stage) < 5 &&
    isActivePipelineCand(c)
  );
  const needed = activePos.reduce((sum, pos) => {
    const target = parseInt(pos.headcount) || 1;
    const filled = candidates.filter(c =>
      Number(c.posId) === Number(pos.id) && Number(c.stage) === 5
    ).length;
    return sum + Math.max(0, target - filled);
  }, 0);
  const weekInt = getThisWeekInterviews().filter(i => i.status !== 'done').length;
  const unlinkedN = getUnlinkedCandidates().length;
  const mailPendingN = getMailPendingItems().length;
  const unit = (n,u) => `${n}<span class="mc-u">${u}</span>`;
  set('kpi-active-pos', unit(activePos.length,'개'));
  set('kpi-needed',     unit(needed,'명'));
  set('kpi-pipeline',   unit(pipeline.length,'명'));
  set('kpi-weekint',    unit(weekInt,'건'));
  set('m-unlinked',     unit(unlinkedN,'명'));
  set('m-pipeline',     unit(active.length,'명'));
  set('m-mail-pending', unit(mailPendingN,'건'));
  const neededEl = document.getElementById('kpi-needed');
  if(neededEl) {
    neededEl.classList.toggle('mc-val-risk', needed > 0);
    neededEl.classList.toggle('mc-val-ok', needed === 0);
  }

  set('kb-progress', `진행 ${pipeline.length}명`);
  set('nb-total', candidates.length);
  const pi = interviews.filter(i => !i.notified || i.mailPending).length;
  const ni = document.getElementById('nb-int');
  if(ni){ if(pi>0){ni.style.display='';ni.textContent=pi;}else ni.style.display='none'; }
  if(typeof updateReferralKpis === 'function') updateReferralKpis();
  updateSidebarUrgency();

  if(typeof renderFunnel==='function') renderFunnel();
  if(typeof renderUrgent==='function') renderUrgent();
}

function getThisWeekInterviews() {
  const now = new Date();
  const monday = new Date(now);
  monday.setHours(0,0,0,0);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  sunday.setHours(23,59,59,999);
  return interviews.filter(i => {
    const date = new Date(String(i.date || '').replace(' ','T'));
    return !Number.isNaN(date.getTime()) && date >= monday && date <= sunday;
  });
}

function compactDashboardActionDesc(action, pos) {
  const title = String(action?.title || '');
  const desc = String(action?.desc || '');
  if(/충원완료 처리 필요/.test(title)) return '최종합격자 있음 · 충원완료 처리 필요';
  if(/지원자 등록 필요|지원자 미배정/.test(title)) return '등록된 지원자 없음 · 지원자 등록 필요';
  if(/후보일정 안내 필요/.test(title)) return '면접전형 대기 · 후보일정 안내 필요';
  if(/공동일정 확정 필요|면접일정 확정 필요/.test(title)) return '회신 또는 일정 미확정 · 일정 확정 필요';
  if(/면접관 안내 미발송/.test(title)) return '확정 일정 있음 · 면접관 안내 필요';
  if(/지원자 안내 미발송/.test(title)) return '확정 일정 있음 · 지원자 안내 필요';
  if(/면접 실시 후 완료 처리 필요/.test(title)) return '면접 실시 후 완료 처리 필요';
  if(/면접 결과 입력 필요/.test(title)) return '면접 완료 · 결과 입력 필요';
  if(/레퍼런스/.test(title)) return `${desc.replace(/·.*/, '').trim() || '레퍼런스 확인 필요'} · ${compactPositionActionTitle(title)}`;
  if(/처우협의/.test(title)) return '처우협의 대상 있음 · 결과 입력 필요';
  return desc || '확인 필요';
}

function dashboardActionCategory(item) {
  const type = String(item?.type || '');
  const title = String(item?.title || '');
  const label = String(item?.label || '');
  if(/referral|reward/.test(type) || /사내추천|포상금/.test(title)) return '사내추천';
  if(/reference|ref_/.test(type) || /레퍼런스/.test(title) || /레퍼런스/.test(label)) return '레퍼런스';
  if(/mail|notice/.test(type) || /메일|발송|안내 확인|면접안내/.test(title) || label === '완료') return '메일 확인';
  if(/interview|schedule|slots|first_|second_/.test(type) || /면접|일정|후보일정/.test(title)) return '면접 운영';
  if(/candidate|fill|offer|residual|unlinked/.test(type) || /충원|지원자 등록|지원자 미배정|미연결|처우협의|잔여/.test(title)) return '포지션 관리';
  return '기타';
}

function renderDashboardActionList(items) {
  const order = ['포지션 관리','면접 운영','레퍼런스','사내추천','메일 확인','기타'];
  return order.map(category => {
    const group = items.filter(item => item.category === category);
    if(!group.length) return '';
    return `<div class="dash-ac-group">${esc(category)}<span class="dash-ac-group-count">${group.length}건</span></div>${group.map(item => `<div class="dash-ac-item">
      <span class="dash-ac-dot ${item.danger?'is-danger':''}"></span>
      <div class="dash-ac-main">
        <div class="dash-ac-top">
          <div class="dash-ac-name">${esc(item.title)}</div>
          <button class="btn btn-xs btn-primary" data-action="call" data-call="${esc(item.call)}">${esc(item.label)}</button>
        </div>
        <div class="dash-ac-lines">${formatDashboardActionLines(item.desc)}</div>
      </div>
    </div>`).join('')}`;
  }).join('');
}

function formatDashboardActionLines(desc) {
  const parts = String(desc || '확인 필요')
    .split('·')
    .map(v => v.trim())
    .filter(Boolean);
  if(parts.length <= 1) return `<div class="dash-ac-line">${esc(parts[0] || '확인 필요')}</div>`;
  return parts.slice(0, 2).map(part => `<div class="dash-ac-line">${esc(part)}</div>`).join('');
}

function getDashboardActionItems() {
  const { noInt, noRef, noNoti, unlinked, mailPending } = getActionItems();
  lastMailPendingItems = mailPending;
  const items = [];
  const positionTypes = new Set();
  positions.filter(p => ['active','partial'].includes(posStatus(p))).forEach(pos => {
    getPositionActionItems(pos.id).filter(a => a.priority === 'high' || a.type === 'candidate_register').forEach(a => {
      positionTypes.add(a.type);
      items.push({
        type:a.type, positionId:pos.id,
        title:pos.title || '포지션 미지정', desc:compactDashboardActionDesc(a,pos), label:compactPositionActionLabel(a.actionLabel),
        call:getDashboardActionCall(pos.id,a.actionCall), danger:false
      });
    });
  });
  const hasScheduleAction = ['first_schedule_reply','first_schedule','second_schedule'].some(type => positionTypes.has(type));
  if(noInt.length && !hasScheduleAction) items.push({type:'interview_schedule',title:`면접 대상 ${noInt.length}명`,desc:'공동일정 미확정 · 일정 확정 필요',label:'면접',call:"navBtn('interview')",danger:false});
  if(noRef.length && !positionTypes.has('reference_remind')) items.push({type:'reference_remind',title:`레퍼런스 대상 ${noRef.length}명`,desc:'미응답 있음 · 리마인드 또는 완료 확인 필요',label:'레퍼런스',call:"navBtn('reference')",danger:false});
  if(noNoti.length) items.push({type:'interview_notice',title:`면접안내 대상 ${noNoti.length}건`,desc:'안내 미발송 · 지원자/면접관 안내 확인',label:'면접',call:"navBtn('interview')",danger:true});
  if(unlinked.length) items.push({type:'unlinked',title:`합격자 ${unlinked.length}명`,desc:'포지션 미연결 · 포지션 연결 필요',label:'확인',call:'showUnlinkedList()',danger:true});
  if(typeof getReferralActionItems === 'function') {
    const rf = getReferralActionItems();
    const rfSubmitted = rf.filter(i => i.type === 'referral').length;
    const rfReward = rf.filter(i => i.type === 'reward').length;
    if(rfSubmitted) items.push({type:'referral',title:`사내추천 ${rfSubmitted}건`,desc:'접수 후 미처리 · 검토 필요',label:'사내추천',call:"navBtn('referral')",danger:true});
    if(rfReward) items.push({type:'reward',title:`포상금 ${rfReward}건`,desc:'마감 임박 · 재직확인/지급요청 필요',label:'포상금',call:"navBtn('referral');setReferralView('rewards')",danger:true});
  }
  mailPending.forEach((m,index) => items.push({type:'mail_pending',title:m.label || '메일 발송',desc:'기존 수동 발송 대기 · 발송 완료 확인',label:'완료',call:`confirmMailPendingAt(${index})`,danger:false}));
  return items.map(item => ({...item, category:dashboardActionCategory(item)}));
}

// 포지션별 단계 칸반보드
function getPositionKanbanStatus(pos, cands, cur) {
  const current = cands.filter(c=>c.stage===cur);
  if(cur===0) {
    const scheduled=current.filter(c=>interviews.some(i=>Number(i.candId)===Number(c.id)&&i.type==='1차')).length;
    return scheduled ? `일정수립 ${scheduled}/${current.length}` : `일정수립대기 ${current.length}명`;
  }
  if(cur===1 || cur===3) {
    const round=cur===1?'1차':'2차';
    const ids=new Set(current.map(c=>Number(c.id)));
    const list=interviews.filter(i=>ids.has(Number(i.candId))&&String(i.type||'').startsWith(round));
    const done=list.filter(i=>i.status==='done').length;
    const confirmed=list.filter(i=>i.status==='confirmed').length;
    const pending=list.filter(i=>(i.status||'pending')==='pending').length;
    const decided=current.filter(c=>c.decision).length;
    if(done && decided<current.length) return `결과대기 ${current.length-decided}명`;
    if(decided) return `판정완료 ${decided}/${current.length}`;
    if(confirmed) {
      const dates=[...new Set(list.filter(i=>i.status==='confirmed'&&i.date).map(i=>i.date))].sort();
      return dates.length ? `면접예정 ${fmtItv(dates[0])}${dates.length>1?` 외 ${dates.length-1}건`:''}` : `일정확정 ${confirmed}명`;
    }
    if(pending) return `회신대기 ${pending}명`;
    return `일정미등록 ${current.length}명`;
  }
  if(cur===2) {
    const total=current.reduce((n,c)=>n+(Number(c.refT)||3),0);
    const answered=current.reduce((n,c)=>n+(Number(c.refD)||0),0);
    const notStarted=current.filter(c=>c.ref==='미시작').length;
    if(notStarted===current.length) return `요청대기 ${notStarted}명`;
    if(answered<total) return `응답 ${answered}/${total}`;
    return `응답완료 ${answered}/${total}`;
  }
  if(cur===4) {
    const decided=current.filter(c=>c.decision).length;
    return decided ? `결과입력 ${decided}/${current.length}` : `협의중 ${current.length}명`;
  }
  if(cur===5) {
    const sent=current.filter(c=>c.notified||onboardings.some(o=>Number(o.candId)===Number(c.id)&&o.notified)).length;
    const joinText = getPositionFinalJoinInline(current);
    const suffix = joinText ? ` (${joinText})` : '';
    return sent<current.length ? `안내대기 ${current.length-sent}명${suffix}` : `안내완료 ${sent}명${suffix}`;
  }
  return `${current.length}명 진행중`;
}

function renderKanban() {
  const el = document.getElementById('dash-kanban');
  if(!el) return;
  if(!positions.length) {
    el.innerHTML = '<div style="padding:24px;text-align:center;font-size:12px;color:var(--t3)">등록된 포지션이 없습니다. 포지션 관리에서 추가하세요.</div>';
    return;
  }
  // 칸반 열: FLOW 단계 (서류합격~최종합격, 입사는 제외 — 입사 탭·지원자 관리에서 확인)
  const cols = KANBAN_FLOW.map(idx => ({ idx, name: STAGES[idx] }));
  const stageColor = i => STAGE_COLORS[i] || 'var(--t3)';

  // 진행중 + 부분충원 포지션 (추가 채용 진행중인 partial 포함)
  const activePos = positions.filter(p => ['active','partial'].includes(posStatus(p)));

  // posId → 비탈락 지원자 배열
  const byPos = {};
  candidates.forEach(x => { if(x.stage===6) return; (byPos[Number(x.posId)] = byPos[Number(x.posId)] || []).push(x); });

  // 각 진행중 포지션을 현재 단계(최고 단계) 컬럼에 1장씩 배치
  const colCards = {};            // stageIdx → [html]
  const emptyPos = [];            // 지원자 없는 진행중 포지션
  activePos.forEach(pos => {
    const cands = byPos[Number(pos.id)] || [];
    if(!cands.length) { emptyPos.push(pos); return; }
    const cur = Math.max(...cands.map(c=>c.stage));   // 현재 단계
    const col = stageColor(cur);
    const title = pos.title || '미지정 포지션';
    const titleSizeClass = title.length > 20 ? ' is-xlong' : (title.length > 14 ? ' is-long' : '');
    const progressStatus = getPositionKanbanStatus(pos,cands,cur);
    const card = `<div class="position-kanban-card" role="button" tabindex="0" data-onkeydown="kbActivate(event)" data-action="open-position" data-id="${pos.id}" style="border-left-color:${col}">
      <div class="position-kanban-title${titleSizeClass}" title="${esc(title)}">${esc(title)}</div>
      <div class="pk-status" style="color:${col}" title="${esc(progressStatus)}">${esc(progressStatus)}</div>
    </div>`;
    (colCards[cur] = colCards[cur] || []).push(card);
  });

  let html = '<div class="position-kanban">';
  cols.forEach(c => {
    const col = stageColor(c.idx);
    const cards = (colCards[c.idx] || []);
    html += `<div class="position-kanban-col ${cards.length ? '' : 'is-empty'}">
      <div class="position-kanban-col-h" style="color:${col}"><span class="position-kanban-col-title">${esc(c.name)}</span><span class="position-kanban-col-count" title="${cards.length}개 포지션" style="${cards.length ? `border-color:${col};color:${col};background:var(--surface)` : ''}">${cards.length}</span></div>
      <div class="position-kanban-list">${cards.join('') || '<div style="font-size:11px;color:var(--t3);text-align:center;padding:14px 0;opacity:.75">비어 있음</div>'}</div>
    </div>`;
  });
  html += '</div>';

  el.innerHTML = html;
}

const REFERRAL_STATUSES = ['SUBMITTED','REVIEWING','IN_PROCESS','PASSED','FAILED','POOLED','EXPIRED','REJECTED','WITHDRAWN','HIRED'];
const REWARD_STATUSES = ['SCHEDULED','RETENTION_OK','REQUESTED','PAID','CANCELED'];
const REFERRAL_ACTIVE_STATUSES = ['SUBMITTED','REVIEWING','IN_PROCESS','POOLED'];
const REFERRAL_COMPLETED_STATUSES = ['PASSED','FAILED','HIRED','REJECTED','WITHDRAWN','EXPIRED'];

function normalizeReferralEmail(value){ return String(value||'').trim().toLowerCase(); }
function normalizeReferralPhone(value){ return String(value||'').replace(/[^0-9]/g,''); }
function referralStatusLabel(status) {
  return ({SUBMITTED:'접수',REVIEWING:'검토중',IN_PROCESS:'전형진행',PASSED:'합격',FAILED:'불합격',POOLED:'인재풀',EXPIRED:'만료',REJECTED:'불인정',WITHDRAWN:'취소',HIRED:'입사'}[status] || status || '-');
}
function rewardStatusLabel(status) {
  return ({SCHEDULED:'예정',RETENTION_OK:'재직확인',REQUESTED:'지급요청',PAID:'지급완료',CANCELED:'취소'}[status] || status || '-');
}
function referralBadge(status) {
  const cls = status==='HIRED' ? 'bgreen' : ['FAILED','REJECTED','WITHDRAWN','EXPIRED'].includes(status) ? 'bred' : status==='PASSED' ? 'bgreen' : status==='POOLED' ? 'bamber' : 'bblue';
  return `<span class="b ${cls}">${esc(referralStatusLabel(status))}</span>`;
}
function rewardBadge(status) {
  const cls = status==='PAID' ? 'bgreen' : status==='CANCELED' ? 'bred' : status==='REQUESTED' ? 'bamber' : status==='RETENTION_OK' ? 'bblue' : 'bamber';
  return `<span class="b ${cls}">${esc(rewardStatusLabel(status))}</span>`;
}
function ensureDefaultReferralRules() {
  if(refRules.some(r=>r.recordType==='amount')) return;
  const nowIso = new Date().toISOString();
  refRules = [
    {id:'amount-CL1-CL3-2026',recordType:'amount',clFrom:'CL1',clTo:'CL3',amount3M:1000000,amount6M:1000000,effectiveFrom:'2026-01-01',effectiveTo:'',isActive:true,updatedAt:nowIso},
    {id:'amount-CL4-CL5-2026',recordType:'amount',clFrom:'CL4',clTo:'CL5',amount3M:1000000,amount6M:2000000,effectiveFrom:'2026-01-01',effectiveTo:'',isActive:true,updatedAt:nowIso},
    {id:'param-validMonths',recordType:'param',key:'validMonths',value:'6',isActive:true,updatedAt:nowIso},
    {id:'param-payCutoffDay',recordType:'param',key:'payCutoffDay',value:'15',isActive:true,updatedAt:nowIso},
  ];
  if(GS_CONFIG.scriptUrl) refRules.forEach(syncRefRuleToGS);
}
function getReferralParam(key, fallback) {
  const row = refRules.find(r=>r.recordType==='param' && r.key===key && r.isActive!==false);
  return row?.value || fallback;
}
function addMonths(dateString, months) {
  const d = new Date(dateString || today());
  const day = d.getDate();
  d.setMonth(d.getMonth() + Number(months||0));
  if(d.getDate() < day) d.setDate(0);
  return d.toISOString().split('T')[0];
}
function daysBetweenDates(a,b) {
  const da = new Date(formatDate(a));
  const db = new Date(formatDate(b));
  return Math.ceil((db.setHours(0,0,0,0)-da.setHours(0,0,0,0))/(24*60*60*1000));
}
function calculateReferralPaySchedule(dueDate) {
  const cutoffDay = Number(getReferralParam('payCutoffDay', 15));
  const d = new Date(dueDate);
  let y = d.getFullYear(), m = d.getMonth();
  if(d.getDate() > cutoffDay) { m += 1; if(m > 11) { m = 0; y += 1; } }
  const mm = String(m+1).padStart(2,'0');
  return {payMonth:`${y}-${mm}`, payCutoff:`${y}-${mm}-${String(cutoffDay).padStart(2,'0')}`};
}
function findReferralAmountRule(hireCL, hireDate) {
  const cl = Number(String(hireCL||'').replace(/[^0-9]/g,''));
  const hd = new Date(hireDate || today());
  const rules = refRules.filter(r=>{
    if(r.recordType!=='amount' || r.isActive===false) return false;
    const from = Number(String(r.clFrom||'').replace(/[^0-9]/g,''));
    const to = Number(String(r.clTo||'').replace(/[^0-9]/g,''));
    const ef = r.effectiveFrom ? new Date(r.effectiveFrom) : new Date('1900-01-01');
    const et = r.effectiveTo ? new Date(r.effectiveTo) : new Date('2999-12-31');
    return cl >= from && cl <= to && hd >= ef && hd <= et;
  }).sort((a,b)=>String(b.effectiveFrom).localeCompare(String(a.effectiveFrom)));
  return rules[0] || {amount3M:0,amount6M:0};
}
function getReferralDupFlag(ref) {
  const phone = normalizeReferralPhone(ref.candPhone);
  const email = normalizeReferralEmail(ref.candEmail);
  const sameReferral = referrals.some(r=>r.id!==ref.id && !r.deletedAt && !['REJECTED','WITHDRAWN'].includes(r.status) &&
    ((phone && normalizeReferralPhone(r.candPhone)===phone) || (email && normalizeReferralEmail(r.candEmail)===email)));
  const priorCandidate = candidates.some(c=>(phone && normalizeReferralPhone(c.phone||c.tel||'')===phone) || (email && normalizeReferralEmail(c.email)===email));
  return sameReferral ? '중복추천' : priorCandidate ? '기지원자' : '없음';
}
function isReferralExpired(ref, baseDate=today()) {
  if(!ref?.validUntil || ['HIRED','PASSED','FAILED','REJECTED','WITHDRAWN','EXPIRED'].includes(ref.status)) return false;
  return formatDate(ref.validUntil) < formatDate(baseDate);
}
function expireReferralStatuses(options={}) {
  let changed = 0;
  referrals.forEach(ref=>{
    if(isReferralExpired(ref)) {
      ref.status = 'EXPIRED';
      ref.rejectReason = ref.rejectReason || '유효기간 경과';
      ref.updatedAt = new Date().toISOString();
      changed++;
      if(options.sync && GS_CONFIG.scriptUrl) syncReferralToGS(ref);
    }
  });
  if(changed) saveState();
  return changed;
}
function sameReferralCandidate(a,b) {
  if(!a || !b || a.id===b.id) return false;
  const ap = normalizeReferralPhone(a.candPhone), bp = normalizeReferralPhone(b.candPhone);
  const ae = normalizeReferralEmail(a.candEmail), be = normalizeReferralEmail(b.candEmail);
  return (ap && bp && ap===bp) || (ae && be && ae===be);
}
function firstReferralForCandidate(ref) {
  const rows = referrals.filter(r=>!r.deletedAt && sameReferralCandidate(ref,r) && !['WITHDRAWN'].includes(r.status));
  rows.push(ref);
  return rows.sort((a,b)=>String(a.submittedAt||a.updatedAt).localeCompare(String(b.submittedAt||b.updatedAt)))[0] || ref;
}
function firstReferralNotice(ref) {
  const first = firstReferralForCandidate(ref);
  if(!first || first.id===ref.id) return '';
  return `<div class="alert aw" style="margin-top:10px"><span>선접수 추천 건: <b>${esc(first.id)}</b> (${esc(first.refName||'-')} · ${formatReferralDate(first.submittedAt)} 접수)</span></div>`;
}
function recalculateReferralFlags(options={}) {
  let changed = 0;
  referrals.forEach(ref=>{
    if(ref.deletedAt || ['REJECTED','WITHDRAWN'].includes(ref.status)) return;
    const next = getReferralDupFlag(ref);
    if(ref.dupFlag !== next) {
      ref.dupFlag = next;
      ref.updatedAt = new Date().toISOString();
      changed++;
      if(options.sync && GS_CONFIG.scriptUrl) syncReferralToGS(ref);
    }
  });
  if(changed) saveState();
  return changed;
}
function formatReferralDate(value) {
  const d = new Date(value || '');
  if(Number.isNaN(d.getTime())) return '-';
  return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function referralElapsedDays(ref) {
  if(!ref.submittedAt) return null;
  return Math.max(0, daysBetweenDates(ref.submittedAt, today()));
}
function referralElapsedBadge(ref) {
  const days = referralElapsedDays(ref);
  if(days == null) return '';
  const cls = days >= 5 && ['SUBMITTED','REVIEWING'].includes(ref.status) ? 'bred' : days >= 3 && ref.status==='SUBMITTED' ? 'bamber' : 'bgray';
  return `<span class="b ${cls}">D+${days}</span>`;
}
function referralDupBadge(ref) {
  if(!ref.dupFlag || ref.dupFlag==='없음') return '';
  const cls = ref.dupFlag==='확인필요' ? 'bamber' : 'bred';
  return `<span class="b ${cls}">${esc(ref.dupFlag)}</span>`;

function referralPosition(ref) { return positions.find(p=>Number(p.id)===Number(ref.posId)); }
function referralRewards(refId) { return rewards.filter(r=>String(r.referralId)===String(refId) && !r.deletedAt); }
function getReferralList() {
  const q = (document.getElementById('rf-search')?.value||'').toLowerCase();
  const status = document.getElementById('rf-status-filter')?.value || '';
  const dup = document.getElementById('rf-dup-filter')?.value || '';
  const viewStatuses = referralView === 'completed' ? REFERRAL_COMPLETED_STATUSES : referralView === 'inbox' ? REFERRAL_ACTIVE_STATUSES : null;
  return referrals.filter(r=>{
    if(r.deletedAt) return false;
    if(viewStatuses && !viewStatuses.includes(r.status)) return false;
    if(status && r.status!==status) return false;
    if(dup && (r.dupFlag||'없음')!==dup) return false;
    const hay = [r.refName,r.refEmail,r.refDept,r.candName,r.candEmail,r.posText,r.dupFlag].join(' ').toLowerCase();
    return !q || hay.includes(q);
  }).sort((a,b)=>{
    const rank = r => r.status==='SUBMITTED' ? 0 : r.status==='REVIEWING' ? 1 : r.status==='IN_PROCESS' ? 2 : 3;
    const ar = rank(a), br = rank(b);
    if(ar !== br) return ar - br;
    return String(a.submittedAt||a.updatedAt).localeCompare(String(b.submittedAt||b.updatedAt));
  });
}
function getReferralActionItems() {
  const nowDate = today();
  const items = [];
  referrals.forEach(r=>{
    if(r.deletedAt) return;
    if(r.status==='SUBMITTED' && r.submittedAt && daysBetweenDates(r.submittedAt, nowDate) >= 3) items.push({type:'referral', id:r.id});
  });
  rewards.forEach(r=>{
    if(r.deletedAt || ['PAID','CANCELED'].includes(r.status)) return;
    if(['SCHEDULED','RETENTION_OK'].includes(r.status) && r.payCutoff && daysBetweenDates(nowDate,r.payCutoff) <= 10) items.push({type:'reward', id:r.id});
  });
  return items;
}

  set('rf-kpi-hired', referrals.filter(r=>!r.deletedAt&&r.status==='FAILED').length);
