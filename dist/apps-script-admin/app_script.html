// ── 포지션 렌더링 ───────────────────────────────────────────
function renderPositions() {
  const list = document.getElementById('pos-list');
  const countLabel = document.getElementById('pos-count-label');
  const nbPos = document.getElementById('nb-pos');
  if(!list) return;
  const candidatesByPos = {};
  candidates.forEach(c => {
    const key = Number(c.posId);
    (candidatesByPos[key] = candidatesByPos[key] || []).push(c);
  });

  // 부분충원은 추가 채용이 진행 중이므로 진행중 그룹에 유지한다.
  const isDone = (pos) => !['active','partial'].includes(posStatus(pos));

  // 탭별 카운트
  const activeCount = positions.filter(p => !isDone(p)).length;
  const doneCount   = positions.filter(p =>  isDone(p)).length;
  const setCnt = (id,v) => { const el=document.getElementById(id); if(el) el.textContent = `(${v})`; };
  setCnt('pos-cnt-active', activeCount);
  setCnt('pos-cnt-done',   doneCount);
  setCnt('pos-cnt-all',    positions.length);

  if(countLabel) countLabel.textContent = `진행중 ${activeCount}개 · 완료 ${doneCount}개 · 전체 ${positions.length}개`;
  if(nbPos) nbPos.textContent = activeCount;  // 사이드바 배지는 진행중 기준
  updateSidebarUrgency();

  const orgBar=document.getElementById('pos-org-filter');
  const orgLabel=document.getElementById('pos-org-filter-label');
  if(orgBar) orgBar.style.display=positionOrgFilter?'flex':'none';
  if(orgLabel&&positionOrgFilter) orgLabel.textContent=`채용현황 필터: ${positionOrgFilter.location} · ${positionOrgFilter.empType} · ${positionOrgFilter.team||positionOrgFilter.jobType}`;

  // 필터 적용
  const filtered = positions.filter(p => {
    if(positionOrgFilter && !(p.location===positionOrgFilter.location&&(p.etype||'정규직')===positionOrgFilter.empType&&(!positionOrgFilter.team||p.team===positionOrgFilter.team)&&(!positionOrgFilter.jobType||p.jobType===positionOrgFilter.jobType))) return false;
    if(posFilter === 'active') return !isDone(p);
    if(posFilter === 'done')   return  isDone(p);
    return true;
  });

  if(!positions.length) {
    list.innerHTML = empty('등록된 포지션이 없습니다','포지션을 등록하면 채용 진행 현황과 다음 업무를 확인할 수 있습니다.','<button class="btn btn-sm btn-primary" data-action="call" data-call="openAddPosition()">+ 포지션 추가</button>');
    return;
  }
  if(!filtered.length) {
    list.innerHTML = empty(posFilter==='done' ? '완료된 포지션이 없습니다.' : '진행중인 포지션이 없습니다.');
    return;
  }

  const renderPositionCard = (pos) => {
    const posCandidates = candidatesByPos[Number(pos.id)] || [];
    const active = posCandidates.filter(c => Number(c.stage) < 5 && isActivePipelineCand(c));
    const passed = posCandidates.filter(c => Number(c.stage) === 5);
    const done = isDone(pos);
    const progress = getPositionCardProgress(pos, posCandidates);
    const actions = getPositionActionItems(pos.id);
    const nextAction = actions.find(a => a.priority === 'high') || actions.find(a => a.priority === 'medium');
    const risk = !!actions.find(a => a.priority === 'high');
    let actionCall = nextAction ? nextAction.actionCall : '';
    if(actionCall && actionCall.startsWith('scrollPositionDetail(')) actionCall = `openPosDetail(${pos.id});${actionCall}`;
    const actionTitle = nextAction ? compactPositionActionTitle(nextAction.title) : '처리 없음';
    const actionLabel = nextAction ? compactPositionActionLabel(nextAction.actionLabel) : '';
    const finalJoinSummary = passed.length ? getPositionFinalJoinSummary(posCandidates) : '';

    return `<div class="card pos-manage-card ${risk?'is-risk':''}" role="button" tabindex="0" data-onkeydown="kbActivate(event)" data-action="open-position" data-id="${pos.id}" aria-label="${esc(pos.title)} 상세보기" style="${done?'opacity:.75':''}">
      <div class="pos-card-main">
        <div class="pos-card-head">
          <div class="pos-card-info">
            <div class="pos-card-title" title="${esc(pos.title)}">${esc(pos.title)}</div>
            <div class="pos-card-title-meta">${esc(pos.hireReason || '충원')} · 채용${passed.length} · 지원${active.length}${finalJoinSummary?' · '+esc(finalJoinSummary):''}</div>
          </div>
          <span class="pos-card-stage ${progress.className}">${esc(progress.label)}</span>
        </div>
        <div class="pos-card-action ${nextAction?'':'pos-card-action-ok'}">
          <div class="pos-card-action-label"><span class="pos-card-action-dot"></span><strong title="${esc(nextAction ? nextAction.title : '처리할 업무 없음')}">${esc(actionTitle)}</strong></div>
          ${nextAction ? `<button class="btn btn-xs btn-primary" data-action="call" data-call="${esc(actionCall)}">${esc(actionLabel)}</button>` : ''}
        </div>
      </div>
    </div>`;
  };

  if(posFilter === 'done') {
    const byYear = {};
    filtered.forEach(pos => {
      const yr = pos.closedAt ? String(pos.closedAt).slice(0,4) : '날짜미상';
      (byYear[yr] = byYear[yr] || []).push(pos);
    });
    const years = Object.keys(byYear).sort((a,b) => b.localeCompare(a));
    list.innerHTML = years.map(yr => {
      const group = byYear[yr];
      const header = `<div style="grid-column:1/-1;font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.4px;padding:4px 2px;border-bottom:1px solid var(--border);margin-bottom:2px">${yr === '날짜미상' ? '날짜 미상' : yr + '년'} <span style="font-weight:500">(${group.length}건)</span></div>`;
      return header + group.map(renderPositionCard).join('');
    }).join('');
  } else {
    list.innerHTML = filtered.map(renderPositionCard).join('');
  }
}

// 포지션 상세에서 입사 안내 - 지원자 본인
function getDeptLeadRecipients(dept) {
  const normalized = String(dept || '').trim();
  if(!normalized || !Array.isArray(interviewers)) return [];
  const seen = new Set();
  return interviewers.filter(iv =>
    String(iv.dept || '').trim() === normalized &&
    /팀장|소장/.test(iv.rank || '') &&
    iv.email
  ).filter(iv => {
    const email = String(iv.email).trim().toLowerCase();
    if(seen.has(email)) return false;
    seen.add(email);
    return true;
  }).map(iv => ({ name:`${iv.name || ''} ${iv.rank || ''}`.trim(), email:iv.email }));
}

function getOnboardInternalRecipients(cand, onboarding) {
  const ob = onboarding || {};
  const teams = parseNotifyTeams();
  const hrEmail = document.getElementById('cfg-hr-email')?.value || '';
  const pos = positions.find(p => Number(p.id) === Number(cand.posId));
  const dept = ob.dept || (pos && pos.dept) || cand.dept || '';
  const leads = getDeptLeadRecipients(dept);
  const knownLeadEmails = new Set(leads.map(x=>String(x.email).trim().toLowerCase()));
  String(ob.deptLead || '').split(/[;,\n]+/).map(x=>x.trim()).filter(x=>x.includes('@')).forEach(email => {
    if(!knownLeadEmails.has(email.toLowerCase())) leads.push({ name:'배치 부서장/소장 추가 수신자', email });
  });
  const recipients = groupMailRecipients([...leads.map(x=>x.email), ...teams.map(t=>t.email), hrEmail]);
  const recipientNames = [...leads.map(x=>`${x.name}(배치 부서)`), ...teams.map(t=>t.name), ...(hrEmail?['피플팀 담당자']:[])].filter(Boolean);
  return { dept, leads, teams, hrEmail, recipients, recipientNames };
}

// 포지션 상세에서 입사 안내 - 사내 관련 부서(팀장·전산 등)
// ── 후보일정 일괄 수집 (포지션 단위) ──────────────────────
let collectSlotsCtx = { posId: null, stageIdx: null };

function openCollectSlots(posId, stageIdx) {
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!pos) return;
  const round = stageIdx === 1 ? '1차' : '2차';
  // 1차 후보일정 → 서류합격(0)·1차면접(1) 대상 / 2차 후보일정 → 레퍼런스(2)·2차면접(3) 대상
  const targetStages = stageIdx === 1 ? [0,1] : [2,3];
  const targets = candidates.filter(c => Number(c.posId) === Number(posId) && targetStages.includes(c.stage));
  if(!targets.length) {
    alert(`${round} 면접 후보일정을 안내할 대상이 없습니다.\n\n대상: ${targetStages.map(s=>STAGES[s]).join(' 또는 ')} 단계 지원자\n먼저 지원자를 해당 단계로 이동시켜 주세요.`);
    return;
  }

  collectSlotsCtx = { posId, stageIdx };
  document.getElementById('csl-title').textContent = `${round} 면접 후보일정 일괄 안내 — ${(pos.dept?pos.dept+' · ':'')+pos.title} (${targets.length}명)`;
  const optionKey = stageIdx === 1 ? 'panel1AvailabilityOptions' : 'panel2AvailabilityOptions';
  const requestedKey = stageIdx === 1 ? 'panel1AvailabilityRequestedAt' : 'panel2AvailabilityRequestedAt';
  const confirmedKey = stageIdx === 1 ? 'panel1AvailabilityConfirmedAt' : 'panel2AvailabilityConfirmedAt';
  const savedOptions = Array.isArray(pos[optionKey]) ? pos[optionKey] : [];
  // 저장된 면접관 확인 일정을 우선 사용하고, 없으면 기본 후보 날짜를 채운다.
  [1,2,3].forEach(n => {
    const saved = savedOptions[n - 1];
    const d = new Date(); d.setDate(d.getDate() + 2 + n);
    const dateEl = document.getElementById(`csl-date${n}`);
    if(dateEl) dateEl.value = saved?.date || d.toISOString().slice(0,10);
    const am = document.getElementById(`csl-date${n}-am`);
    const pm = document.getElementById(`csl-date${n}-pm`);
    if(am) am.checked = saved ? saved.periods?.includes('AM') : true;
    if(pm) pm.checked = saved ? saved.periods?.includes('PM') : true;
  });
  const deadline = new Date(); deadline.setDate(deadline.getDate() + 2);
  const deadlineEl = document.getElementById('csl-deadline');
  if(deadlineEl) deadlineEl.value = deadline.toISOString().slice(0,10);
  const panelConfirmed = document.getElementById('csl-panel-confirmed');
  if(panelConfirmed) panelConfirmed.checked = !!pos[confirmedKey];
  const panelStatus = document.getElementById('csl-panel-status');
  if(panelStatus) panelStatus.textContent = pos[confirmedKey]
    ? `면접관 확인 완료 · ${fmtDate(pos[confirmedKey])}`
    : pos[requestedKey] ? `확인 요청 발송 · ${fmtDate(pos[requestedKey])}` : '면접관 확인 전';
  document.getElementById('csl-loc').value = pos.loc || '';
  // 대상 목록
  const tw = document.getElementById('csl-targets');
  if(tw) tw.innerHTML = targets.map(c => {
    const existing = interviews.find(i => Number(i.candId) === Number(c.id) && i.type === round);
    const status = existing ? interviewAvailabilityStatusText(existing) : '미발송';
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">
      <span style="font-weight:600">${esc(c.name)}${headhunterSearchPill(c)}</span>
      <span style="color:var(--t3);flex:1">${esc(getCandidateMailTarget(c).to || c.email || '이메일 미입력')}</span>
      <span class="b ${existing?.availabilityStatus==='RESPONDED'?'bgreen':existing?.availabilityStatus==='UNAVAILABLE'?'bred':'bgray'}">${esc(status)}</span>
    </div>`;
  }).join('');
  closeModal('modal-pos-detail');
  openModal('modal-collect-slots');
}

function collectAvailabilityOptions() {
  return [1,2,3].map(n => {
    const date = document.getElementById(`csl-date${n}`)?.value || '';
    const periods = [];
    if(document.getElementById(`csl-date${n}-am`)?.checked) periods.push('AM');
    if(document.getElementById(`csl-date${n}-pm`)?.checked) periods.push('PM');
    return { date, periods };
  }).filter(item => item.date && item.periods.length);
}

function formatAvailabilityOptions(options) {
  return (options || []).map((item, index) => {
    const d = new Date(`${item.date}T00:00:00`);
    const wk = ['일','월','화','수','목','금','토'][d.getDay()];
    const periods = item.periods.map(v => v === 'AM' ? '오전' : '오후').join('·');
    return `${index + 1}. ${d.getMonth()+1}월 ${d.getDate()}일(${wk}) ${periods}`;
  }).join('\n');
}

function formatAvailabilitySelections(values) {
  if(!Array.isArray(values) || !values.length) return '';
  return values.map(value => {
    const [date, period] = String(value).split('|');
    const d = new Date(`${date}T00:00:00`);
    const wk = ['일','월','화','수','목','금','토'][d.getDay()];
    return `${d.getMonth()+1}/${d.getDate()}(${wk}) ${period==='AM'?'오전':'오후'}`;
  }).join(', ');
}

function interviewAvailabilityStatusText(itv) {
  if(itv?.availabilityStatus === 'RESPONDED') return formatAvailabilitySelections(itv.availabilitySelections) || '응답완료';
  if(itv?.availabilityStatus === 'UNAVAILABLE') return `모두 어려움${itv.availabilityNote ? ` · ${itv.availabilityNote}` : ''}`;
  if(itv?.availabilityStatus === 'SENT') return '응답대기';
  return '미발송';
}

function panelAvailabilityKeys(stageIdx) {
  return stageIdx === 1
    ? { options:'panel1AvailabilityOptions', requested:'panel1AvailabilityRequestedAt', confirmed:'panel1AvailabilityConfirmedAt', panel:'panel1' }
    : { options:'panel2AvailabilityOptions', requested:'panel2AvailabilityRequestedAt', confirmed:'panel2AvailabilityConfirmedAt', panel:'panel2' };
}

async function sendPanelAvailabilityRequest() {
  const { posId, stageIdx } = collectSlotsCtx;
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!pos) return;
  const options = collectAvailabilityOptions();
  if(!options.length) { toast('면접관에게 확인할 날짜와 오전·오후를 선택하세요.', 'terr'); return; }
  const keys = panelAvailabilityKeys(stageIdx);
  const panelists = parsePanelists(pos[keys.panel]).filter(p => p.email && p.email.includes('@'));
  if(!panelists.length) { toast('이메일이 등록된 면접관이 없습니다. 포지션의 면접관 정보를 확인하세요.', 'terr'); return; }
  const round = stageIdx === 1 ? '1차' : '2차';
  const optionText = formatAvailabilityOptions(options);
  const body = [
    '안녕하세요.', '',
    `${pos.title} 포지션 ${round} 면접 일정을 조율하고자 합니다.`,
    '아래 후보 일정 중 참석이 어려운 날짜 또는 시간대가 있으면 본 메일로 회신해 주세요.', '',
    optionText, '',
    '지원자 일정 확인 후 정확한 면접 시간과 순서를 다시 안내드리겠습니다.', '',
    '감사합니다.', '우미건설 피플팀 드림'
  ].join('\n');
  const recipients = groupMailRecipients(panelists.map(p => p.email));
  const sent = await sendGeneralEmailViaGmail(recipients, `[우미건설] ${pos.title} ${round} 면접 가능 일정 확인`, body, `${round}면접관후보일정확인`, pos.title, {
    templateType:'general_notice', title:`${round} 면접 가능 일정 확인`, recipientName:'면접위원님'
  });
  if(!sent) return;
  pos[keys.options] = options;
  pos[keys.requested] = new Date().toISOString();
  pos[keys.confirmed] = '';
  saveState();
  if(GS_CONFIG.scriptUrl) await syncPosToGS(pos);
  const checkbox = document.getElementById('csl-panel-confirmed');
  if(checkbox) checkbox.checked = false;
  const status = document.getElementById('csl-panel-status');
  if(status) status.textContent = `확인 요청 발송 · ${fmtDate(pos[keys.requested])}`;
  toast(`면접관 ${panelists.length}명에게 가능 일정 확인 메일을 발송했습니다.`, 'tok');
}

async function setPanelAvailabilityConfirmed() {
  const { posId, stageIdx } = collectSlotsCtx;
  const pos = positions.find(p => Number(p.id) === Number(posId));
  const checkbox = document.getElementById('csl-panel-confirmed');
  if(!pos || !checkbox) return;
  const keys = panelAvailabilityKeys(stageIdx);
  const options = collectAvailabilityOptions();
  if(checkbox.checked && !options.length) {
    checkbox.checked = false;
    toast('확인 완료로 처리할 면접 후보일정을 먼저 입력하세요.', 'terr');
    return;
  }
  pos[keys.options] = options;
  pos[keys.confirmed] = checkbox.checked ? new Date().toISOString() : '';
  saveState();
  if(GS_CONFIG.scriptUrl) await syncPosToGS(pos);
  const status = document.getElementById('csl-panel-status');
  if(status) status.textContent = checkbox.checked ? `면접관 확인 완료 · ${fmtDate(pos[keys.confirmed])}` : (pos[keys.requested] ? `확인 요청 발송 · ${fmtDate(pos[keys.requested])}` : '면접관 확인 전');
}

async function sendCollectSlots() {
  const { posId, stageIdx } = collectSlotsCtx;
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!pos) return;
  if(!hasGsBridge_()) { toast('지원자 응답 링크를 만들려면 Apps Script 연결이 필요합니다.', 'terr'); return; }
  if(!document.getElementById('csl-panel-confirmed')?.checked) {
    toast('면접관 가능 일정을 먼저 확인해 주세요.', 'terr');
    return;
  }
  const round = stageIdx === 1 ? '1차' : '2차';
  const roundLabel = round === '1차' ? '1차 실무면접' : '2차 임원면접';

  const options = collectAvailabilityOptions();
  if(!options.length) { toast('후보 날짜와 오전·오후를 1개 이상 선택하세요.', 'terr'); return; }
  const uniqueDates = new Set(options.map(item => item.date));
  if(uniqueDates.size !== options.length) { toast('같은 날짜가 중복되었습니다.', 'terr'); return; }
  const deadline = document.getElementById('csl-deadline')?.value || '';
  if(!deadline) { toast('응답 마감일을 입력하세요.', 'terr'); return; }
  const loc = document.getElementById('csl-loc')?.value || '';
  const slotText = formatAvailabilityOptions(options);
  const panelKeys = panelAvailabilityKeys(stageIdx);
  pos[panelKeys.options] = options;
  pos[panelKeys.confirmed] = pos[panelKeys.confirmed] || new Date().toISOString();
  saveState();
  if(GS_CONFIG.scriptUrl) {
    const positionSync = await syncPosToGS(pos);
    if(positionSync == null) return;
  }

  const targetStages = stageIdx === 1 ? [0,1] : [2,3];
  const targets = candidates.filter(c => Number(c.posId) === Number(posId) && targetStages.includes(c.stage));
  if(!targets.length) { toast('대상이 없습니다.', 'terr'); return; }

  // 각 지원자 pending 면접 생성/갱신 (가능 시간대 응답 전)
  targets.forEach(c => {
    let itv = interviews.find(i => Number(i.candId) === Number(c.id) && i.type === round);
    if(itv) {
      itv.slots = [];
      itv.availabilityOptions = options;
      itv.availabilitySelections = [];
      itv.availabilityStatus = '';
      itv.availabilityNote = '';
      itv.status = 'pending';
      itv.loc = loc || itv.loc || '미정 (응답 취합 후 확정)';
      itv.memo = '오전·오후 가능 시간대 응답 대기';
    } else {
      interviews.push({
        id: nextId(), candId: c.id, candName: c.name, type: round,
        date: '', loc: loc || '미정 (응답 취합 후 확정)', panel: '미정',
        memo: '오전·오후 가능 시간대 응답 대기', notified: false, status: 'pending', slots: [],
        availabilityOptions: options, availabilitySelections: [], availabilityStatus:'', availabilityNote:''
      });
    }
  });
  saveState();
  const syncResult = await settleSync(targets.map(c => {
    const itv = interviews.find(i => Number(i.candId) === Number(c.id) && i.type === round);
    return itv ? syncIntToGS(itv) : Promise.resolve(null);
  }), `${round} 면접 가능 시간대 저장`);
  if(syncResult.failed) return;

  // 순차 발송 큐 구성
  collectSendQueue = {
    posId, round, roundLabel, slotText, loc, options, deadline,
    list: targets.map(c => ({ id: c.id, name: c.name, email: c.email, pos: c.pos })),
    idx: 0,
  };
  closeModal('modal-collect-slots');
  renderCollectSendStep();
  openModal('modal-collect-send');
}

// 순차 발송 큐 상태
let collectSendQueue = null;

// 발송 진행 모달 렌더
function renderCollectSendStep() {
  const q = collectSendQueue;
  if(!q) return;
  const total = q.list.length;
  const done = q.idx;
  const cur = q.list[q.idx];
  const isLast = q.idx >= total - 1;
  const cand = candidates.find(c => Number(c.id) === Number(cur?.id));
  const target = getCandidateMailTarget(cand || cur);
  const body = document.getElementById('csend-body');
  if(!body) return;

  if(!cur) {
    // 전부 발송 완료
    body.innerHTML = `<div style="text-align:center;padding:24px 0">
      <div style="font-size:40px;margin-bottom:10px">✅</div>
      <div style="font-size:15px;font-weight:700;margin-bottom:6px">${total}명 전원 안내 완료</div>
      <div style="font-size:12px;color:var(--t3)">대상자별 발송 상태를 확인하세요.</div>
    </div>`;
    document.getElementById('csend-footer').innerHTML =
      `<button class="btn btn-primary" data-action="call" data-call="closeCollectSend()">완료</button>`;
    return;
  }

  body.innerHTML = `
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-bottom:4px">
        <span>진행 ${done}/${total}</span><span>${Math.round(done/total*100)}%</span>
      </div>
      <div class="prog" style="height:6px"><div class="pf-bar" style="width:${done/total*100}%;background:var(--outlook)"></div></div>
    </div>
    <div style="padding:16px;background:var(--s2);border-radius:var(--r);text-align:center">
      <div style="font-size:11px;color:var(--t3);margin-bottom:4px">다음 발송 대상 (${done+1}번째)</div>
      <div style="font-size:17px;font-weight:700;margin-bottom:2px">${cur.name}</div>
      <div style="font-size:12px;color:var(--t2)">${esc(target.label)} · ${esc(target.to || cur.email || '')}</div>
      <div style="font-size:11px;color:var(--t3);margin-top:4px">${cur.pos}</div>
    </div>
    <div style="font-size:11.5px;color:var(--t3);margin-top:12px;text-align:center">
      아래 버튼을 누르면 <b>${cur.name}</b>님 ${cand&&isHeadhuntingCandidate(cand)?'업체 경유 ':''}안내 메일이 발송됩니다.<br>발송 완료 토스트를 확인한 뒤 [${isLast?'완료':'다음 사람'}]을 누르세요.
    </div>`;

  const remaining = total - done;
  document.getElementById('csend-footer').innerHTML = `
    <button class="btn" data-action="call" data-call="skipCollectSend()" style="font-size:12px">이 사람 건너뛰기</button>
    <button class="btn btn-primary" data-action="call" data-call="doCollectSendCurrent()">✉ ${cand&&isHeadhuntingCandidate(cand)?'업체':'지원자'} 메일 발송</button>`;
}

// 현재 대상 메일 작성창 열기
async function doCollectSendCurrent() {
  const q = collectSendQueue;
  if(!q) return;
  const cur = q.list[q.idx];
  if(!cur) return;
  const cand = candidates.find(c => Number(c.id) === Number(cur.id));
  const itv = interviews.find(i => Number(i.candId) === Number(cur.id) && i.type === q.round);
  if(!itv) { toast('면접 응답 정보를 찾을 수 없습니다.', 'terr'); return; }
  const target = getCandidateMailTarget(cand || cur);
  const issue = await gsFetch('issueInterviewAvailabilityLink', '', {
    interviewId: itv.id,
    candId: cur.id,
    candName: cur.name,
    type: q.round,
    loc: q.loc || '',
    options: q.options,
    expiresAt: new Date(`${q.deadline}T23:59:59+09:00`).toISOString()
  }, { allowQueue:false });
  if(!issue?.ok || !issue.link) {
    toast(`응답 링크 생성 실패: ${issue?.error || 'Apps Script 설정을 확인하세요.'}`, 'terr');
    return;
  }
  itv.availabilityLink = issue.link;
  itv.availabilityExpiresAt = issue.tokenExpiresAt || '';
  itv.availabilityStatus = 'SENT';
  itv.availabilityOptions = q.options;
  itv.availabilitySelections = [];
  const subject = `[우미건설] ${cur.name}님 ${q.roundLabel} 가능 일정 확인`;
  const tpl = document.getElementById('tpl-collect')?.value;
  let body;
  if(tpl) {
    body = tpl
      .replace(/\{지원자명\}/g, cur.name||'')
      .replace(/\{포지션\}/g, cur.pos||'')
      .replace(/\{면접유형\}/g, q.roundLabel)
      .replace(/\{후보일정\}/g, q.slotText)
      .replace(/\{장소\}/g, q.loc ? '■ 장소: '+q.loc : '')
      .replace(/\{응답링크\}/g, issue.link)
      .replace(/\{응답마감\}/g, q.deadline);
  } else {
    body = `안녕하세요 ${cur.name}님,\n\n우미건설 ${cur.pos} 포지션 ${q.roundLabel}을 진행하고자 합니다.\n아래 링크에서 가능한 날짜의 오전·오후 시간대를 모두 선택해 주세요.\n\n${q.slotText}\n${q.loc ? '\n■ 장소: '+q.loc : ''}\n■ 응답 마감: ${q.deadline}\n\n응답 링크\n${issue.link}\n\n정확한 면접시간은 응답 취합 후 별도로 안내드리겠습니다.`;
  }
  const sent = await dispatchCandidateMail_(cand || cur, {
    subject, purpose: `${q.roundLabel} 후보일정 협의`, directBody: body, logType: `${q.round}후보일정(업체경유)`,
    sendDirect: () => sendGeneralEmailViaGmail(target.to || cur.email, subject, body, `${q.round}후보일정안내`, cur.name, {
      templateType: 'interview_slot_request',
      candidateName: cur.name,
      positionText: cur.pos,
      interviewType: q.roundLabel,
      slotOptions: q.slotText || '',
      location: q.loc || '',
      availabilityLink: issue.link,
      responseDeadline: q.deadline
    })
  });
  if(sent === false) return;
  saveState();
  logNotify('Gmail', `${q.round}후보일정${cand&&isHeadhuntingCandidate(cand)?'업체경유':'안내'}`, cur.name, target.to || cur.email);
  const isLast = q.idx >= q.list.length - 1;
  // 발송 요청 후 다음 대상 또는 완료 버튼으로 전환
  document.getElementById('csend-footer').innerHTML = `
    <span style="font-size:11.5px;color:var(--t3);align-self:center">${cur.name}님 발송 요청을 완료했습니다.</span>
    <button class="btn btn-primary" data-action="call" data-call="${isLast?'closeCollectSend()':'nextCollectSend()'}">${isLast?'완료':'다음 사람 →'}</button>`;
}

function nextCollectSend() {
  if(!collectSendQueue) return;
  collectSendQueue.idx++;
  saveState();
  renderCollectSendStep();
}
function skipCollectSend() {
  if(!collectSendQueue) return;
  collectSendQueue.idx++;
  renderCollectSendStep();
}
function closeCollectSend() {
  const posId = collectSendQueue ? collectSendQueue.posId : null;
  collectSendQueue = null;
  closeModal('modal-collect-send');
  if(posId != null) openPosDetail(Number(posId));
}

// 면접 합격/불합격 판정 '표시' (단계 이동 X, decision만 설정)
// 포지션 단계 전체 판정 일괄 확정 (합격자→다음, 불합격자→탈락)
async function confirmStageDecisions(posId, stageIdx, options={}) {
  const skipConfirm = !!options.skipConfirm;
  const isFinalDecision = Number(stageIdx) === 4;
  const round = isFinalDecision ? '처우협의 결과' : STAGES[stageIdx];
  const posCands = candidates.filter(c => Number(c.posId) === Number(posId) && c.stage === stageIdx);
  if(!posCands.length) { toast('대상 지원자가 없습니다.', 'terr'); return; }

  if(stageIdx === 1 || stageIdx === 3) {
    const missing = posCands.filter(c => !hasConfirmedRoundSchedule(c.id, stageIdx));
    if(missing.length) {
      if(!confirm(`면접 일정이 확정되지 않은 지원자가 ${missing.length}명 있습니다.\n\n일정 확정·안내 없이 판정을 확정하고 다음 단계로 이동할까요?\n단계를 지나간 뒤에는 일정 미확정 건이 '처리 필요'에서 자동 추적되지 않을 수 있습니다.`)) return;
    }
  }

  const undecided = posCands.filter(c => !c.decision);
  const passers = posCands.filter(c => c.decision === 'pass');
  const failers = posCands.filter(c => c.decision === 'fail');

  if(undecided.length && !skipConfirm) {
    if(!confirm(isFinalDecision
      ? `처우협의 중인 지원자가 ${undecided.length}명 있습니다.\n(${undecided.map(c=>c.name).join(', ')})\n\n결과가 선택된 인원만 확정하고, 협의중인 지원자는 처우협의 단계에 남깁니다.\n계속할까요?`
      : `아직 판정하지 않은 지원자가 ${undecided.length}명 있습니다.\n(${undecided.map(c=>c.name).join(', ')})\n\n판정된 인원만 이동시키고, 미판정자는 현재 단계에 남깁니다.\n계속할까요?`)) return;
  } else if(!skipConfirm) {
    if(!confirm(isFinalDecision
      ? `처우협의 결과를 확정합니다.\n\n· 최종합격 ${passers.length}명 → 충원 seat 반영 후 입사 안내로 이동\n· 불합격 ${failers.length}명 → 전형 종료\n· 협의중 ${undecided.length}명 → 처우협의 유지\n\n진행할까요?`
      : `'${round}' 단계 판정을 확정합니다.\n\n· 합격 ${passers.length}명 → 다음 단계 이동\n· 불합격 ${failers.length}명 → 전형 종료\n\n진행할까요?`)) return;
  }

  const nx = nextFlowStage(stageIdx, posId);
  if(nx === 5 && passers.length) {
    const posId = passers[0].posId;
    if(posId != null) {
      const info = getPosSeatInfo(posId);
      if(info && info.passed + passers.length > info.headcount) {
        if(!confirm(`⚠ Seat 초과 경고\n최종합격 ${info.passed}명 + 이번 합격 ${passers.length}명 = ${info.passed + passers.length}명\n목표 ${info.headcount}명\n\n계속할까요?`)) return;
      }
    }
  }
  let passCnt = 0, failCnt = 0;
  const rejectionInfo = failers.length ? await askRejectReason(failers.length) : null;
  if(failers.length && !rejectionInfo) return;
  const decidedInterviews = [];
  [...passers, ...failers].forEach(c => {
    const itv = preserveCompletedStage(c, stageIdx, c.decision);
    if(itv) decidedInterviews.push(itv);
  });
  passers.forEach(c => {
    c.stage = nx;
    if(nx === 5 && !c.joinDate) c.joinDate = '';
    c.decision = '';  // 판정 초기화 (다음 단계에서 새로 판정)
    passCnt++;
  });
  // 불합격자 → 탈락(6)
  failers.forEach(c => {
    c.stage = 6;
    recordRejection(c, rejectionInfo.reason, rejectionInfo.memo);
    c.decision = '';
    // 진행중 면접·레퍼런스 정리
    interviews = interviews.filter(i => !(Number(i.candId)===Number(c.id) && (i.status||'pending')==='pending'));
    if(c.ref === '진행중') { c.ref = '미시작'; c.refD = 0; c.refT = 0; delete refDetails[c.id]; }
    failCnt++;
  });
  saveState();
  if(GS_CONFIG.scriptUrl) await settleSync([
    ...[...passers, ...failers].map(c => syncCandToGS(c)),
    ...decidedInterviews.map(i => syncIntToGS(i)),
  ], '판정 결과 동기화');
  renderPositions(); renderDashboard();
  if(isFinalDecision && passCnt > 0) {
    openOnboardingFromPosition(Number(posId));
    toast(`처우협의 결과 확정: 최종합격 ${passCnt}명 · 입사 안내로 이동`, 'tok');
  } else {
    openPosDetail(Number(posId));
    toast(isFinalDecision
      ? `처우협의 결과 확정: 최종합격 ${passCnt}명, 불합격 ${failCnt}명 종료`
      : `판정 확정: 합격 ${passCnt}명 → ${STAGES[nx]}, 불합격 ${failCnt}명 종료`, 'tok');
  }
}

// 포지션 단계의 미확정 면접 일정을 전체 확정
// 포지션 상세에서 합격 처리 (다음 단계로 + 복귀)
// 포지션 상세에서 불합격 처리 (전형 종료 + 복귀)
// 지원자를 포지션에 연결
function linkCandToPos(candId, posId) {
  const c = candidates.find(x => Number(x.id) === Number(candId));
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!c) { toast('지원자를 찾을 수 없습니다 (id: '+candId+')', 'terr'); return; }
  if(!pos) { toast('포지션을 찾을 수 없습니다 (id: '+posId+')', 'terr'); return; }
  c.posId = Number(posId);
  saveState();
  if(GS_CONFIG.scriptUrl) {
    syncCandToGS(c).then(() => {
      renderPositions();
      openPosDetail(Number(posId));
    });
  } else {
    renderPositions();
    openPosDetail(Number(posId));
  }
  toast(`${esc(c.name)}님을 '${esc(pos.title)}'에 연결했습니다.`, 'tok');
}

// ── 포지션 상태 필터 ──
let posFilter = 'active';
function setPosFilter(f, btn) {
  posFilter = f;
  document.querySelectorAll('.pos-tab').forEach(b => b.classList.remove('pos-tab-on'));
  if(btn) btn.classList.add('pos-tab-on');
  renderPositions();
}

function holdResidualCandidates(posId, label) {
  const residual = candidates.filter(c => Number(c.posId) === Number(posId) && c.stage < 5 && !c.held);
  if(!residual.length) return 0;
  if(!confirm(`진행중 지원자 ${residual.length}명을 보류 처리할까요?\n취소를 선택하면 현재 상태를 유지합니다.`)) return 0;
  residual.forEach(c => { c.held = true; if(GS_CONFIG.scriptUrl) syncCandToGS(c); });
  logActivity('지원자 보류', `${label} 잔여 지원자 ${residual.length}명`, 'position', posId);
  return residual.length;
}

// 채용 완료 처리
function closePosition(posId) {
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!pos) return;
  const hc = parseInt(pos.headcount) || 1;
  const passed = candidates.filter(c => Number(c.posId) === Number(posId) && c.stage === 5).length;
  const active = candidates.filter(c => Number(c.posId) === Number(posId) && c.stage < 5 && !c.held).length;
  let msg = `'${pos.title}' 모집을 완료 처리하시겠습니까?`;
  if(active > 0) msg += `\n\n⚠ 아직 진행중인 지원자가 ${active}명 있습니다.`;
  if(passed < hc) msg += `\n⚠ 최종합격 ${passed}명 / 목표 ${hc}명 (부분 충원)`;
  if(!confirm(msg)) return;
  holdResidualCandidates(posId, pos.title);
  pos.status = (passed > 0 && passed < hc) ? 'partial' : 'filled';
  pos.closedAt = new Date().toISOString().slice(0,10);
  logActivity(pos.status === 'partial' ? '부분충원 완료' : '충원완료', `${pos.title} ${passed}/${hc}명`, 'position', posId);
  saveState();
  if(GS_CONFIG.scriptUrl && typeof syncPosToGS === 'function') syncPosToGS(pos);
  renderPositions(); renderDashboard();
  toast(`'${esc(pos.title)}' ${pos.status === 'partial' ? '부분충원' : '충원완료'} 처리`, 'tok');
}

// 미채용 — 마법사로 위임 (P0)
function nohirePosition(posId) { openNohireWizard(posId); }

// 채용 중단 (재모집 없이 종료)
function stopPosition(posId) {
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!pos) return;
  if(!confirm(`'${pos.title}' 포지션을 채용 중단 처리하시겠습니까?`)) return;
  holdResidualCandidates(posId, pos.title);
  pos.status = 'stopped';
  pos.closedAt = today();
  saveState();
  if(GS_CONFIG.scriptUrl && typeof syncPosToGS === 'function') syncPosToGS(pos);
  closeModal('modal-pos-detail');
  renderPositions(); renderDashboard();
  toast(`'${esc(pos.title)}' 채용 중단 처리`, 'tok');
}

// 진행중으로 복원
function reopenPosition(posId) {
  const pos = positions.find(p => Number(p.id) === Number(posId));
  if(!pos) return;
  pos.status = 'active';
  delete pos.closedAt;
  saveState();
  if(GS_CONFIG.scriptUrl && typeof syncPosToGS === 'function') syncPosToGS(pos);
  renderPositions(); renderDashboard();
  toast(`'${esc(pos.title)}' 진행중으로 복원`, 'tok');
}

// ── 포지션 상세 모달 ────────────────────────────────────────
// ── 포지션 상세 v2: 채용 프로젝트 관리 화면 ────────────────
function getPositionProjectData(positionId) {
  const pos = positions.find(p => Number(p.id) === Number(positionId));
  if(!pos) return null;
  const list = candidates.filter(c => Number(c.posId) === Number(positionId));
  const target = parseInt(pos.headcount) || 1;
  const final = list.filter(c => c.stage === 5);
  const rejected = list.filter(c => c.stage === 6);
  const active = list.filter(c => c.stage < 5 && !c.held);
  const filled = Math.min(target, final.length);
  const remain = Math.max(0, target - filled);
  const rate = target ? Math.min(100, Math.round(filled / target * 100)) : 0;
  const rawStatus = posStatus(pos);
  const projectStatus = rawStatus === 'active' && filled > 0 && remain > 0 ? 'partial' : rawStatus;
  const statusLabels = { active:'진행중', partial:'부분충원', filled:'충원완료', nohire:'미채용', stopped:'중단' };
  return { pos, list, target, final, rejected, active, filled, remain, rate, projectStatus, statusLabel:statusLabels[projectStatus] || posStatusLabel(pos) };
}

function positionRoundData(positionId, stageIdx) {
  const round = stageIdx === 1 ? '1차' : '2차';
  const candidateStages = stageIdx === 1 ? [0,1] : [2,3];
  const positionCands = candidates.filter(c => Number(c.posId) === Number(positionId));
  const roundCands = positionCands.filter(c => candidateStages.includes(c.stage));
  const positionIds = new Set(positionCands
    .filter(c => c.stage !== 0 && (c.stage >= stageIdx || Number(c.lastCompletedStage) >= stageIdx))
    .map(c => Number(c.id)));
  const roundInterviews = interviews.filter(i => positionIds.has(Number(i.candId)) && i.type === round);
  return {
    round, candidates:roundCands, interviews:roundInterviews,
    pending:roundInterviews.filter(i => (i.status||'pending') === 'pending'),
    confirmed:roundInterviews.filter(i => i.status === 'confirmed' || i.status === 'done'),
    done:roundInterviews.filter(i => i.status === 'done'),
    candidateNotified:roundInterviews.filter(i => i.candidateNotified || i.candNotified),
    panelNotified:roundInterviews.filter(i => i.panelNotified || i.notified),
  };
}

function getPositionActionItems(positionId) {
  const d = getPositionProjectData(positionId);
  if(!d) return [];
  const { pos, list, target, final, remain, projectStatus } = d;
  const short = isShortProcessEtype(pos.etype);
  const r1 = positionRoundData(positionId, 1);
  const r2 = positionRoundData(positionId, 3);
  const hasHeadhunting = list.some(isHeadhuntingCandidate);
  const routeNoticeText = hasHeadhunting ? '업체 경유 안내' : '지원자 안내';
  const items = [];
  const add = (type, priority, title, desc, actionLabel, action, actionCall) =>
    items.push({ type, priority, title, desc, actionLabel, action, actionCall });

  if(!list.length) add('candidate_register','high','지원자 미배정','등록된 지원자 없음 · 지원자 등록 필요','지원자 추가','addCandToPos',`addCandToPos(${positionId})`);

  const stage0 = list.filter(c => c.stage === 0);
  if(stage0.length && !pos.panel1AvailabilityConfirmedAt) add('first_panel_availability','high',pos.panel1AvailabilityRequestedAt?'1차 면접관 가능 일정 회신 확인 필요':'1차 면접관 가능 일정 확인 필요',pos.panel1AvailabilityRequestedAt?'면접관 회신을 확인한 뒤 지원자 가능일 확인을 진행하세요.':'면접관에게 공통 후보 날짜의 참석 가능 여부를 먼저 확인하세요.','면접관 일정 확인','openCollectSlots',`openCollectSlots(${positionId},1)`);
  if(stage0.length && pos.panel1AvailabilityConfirmedAt && !r1.interviews.length) add('first_slots','high',`1차 지원자 가능일 ${routeNoticeText} 필요`,`${stage0.length}명 · 면접관 확인이 완료된 후보일정을 ${hasHeadhunting?'업체 경유로 ':''}지원자에게 안내하세요.`,'지원자 가능일 확인','openCollectSlots',`openCollectSlots(${positionId},1)`);

  const firstResponded = r1.interviews.filter(i => ['RESPONDED','UNAVAILABLE'].includes(i.availabilityStatus));
  const firstWaiting = r1.interviews.filter(i => i.availabilityStatus === 'SENT');
  if(firstResponded.length && !firstWaiting.length) add('first_schedule_reply','high','1차 면접시간·순서 확정 필요',`가능 시간대 응답 ${firstResponded.length}건 취합 완료 · 세부 시간과 순서를 확정하세요.`,'일정 확정','openPositionRoundSchedule',`openPositionRoundSchedule(${positionId},1)`);
  else if(firstWaiting.length) add('first_schedule_wait','medium','1차 가능 시간대 응답 대기',`응답완료 ${firstResponded.length}명 · 대기 ${firstWaiting.length}명`,'응답 현황','openCollectSlots',`openCollectSlots(${positionId},1)`);
  else if(r1.pending.length) add('first_schedule','high','1차 공동일정 확정 필요',`미확정 일정 ${r1.pending.length}건이 있습니다.`,'일정 확정','openPositionRoundSchedule',`openPositionRoundSchedule(${positionId},1)`);

  if(r1.confirmed.length && r1.panelNotified.length < r1.confirmed.length) add('first_panel_notice','medium','1차 면접관 안내 미발송',`확정 ${r1.confirmed.length}건 중 면접관 안내 미완료`,'면접관 안내','sendPanelNotice',`sendPanelNotice(${positionId},1)`);
  if(r1.confirmed.length && r1.candidateNotified.length < r1.confirmed.length) add('first_candidate_notice','medium',`1차 면접 ${routeNoticeText} 미발송`,`확정 ${r1.confirmed.length}건 중 ${routeNoticeText} 미완료`,'안내 발송','sendAllCandSchedule',`sendAllCandSchedule(${positionId},1)`);

  if(r1.confirmed.length > r1.done.length) add('first_interview_done','medium','1차 면접 실시 후 완료 처리 필요',`일정 확정 ${r1.confirmed.length}건 · 완료 ${r1.done.length}건`,'면접 완료 처리','scrollPositionDetail',`scrollPositionDetail('pp-position-candidates')`);

  const firstResult = list.filter(c => c.stage === 1 && !c.decision);
  if(r1.done.length && firstResult.length) add('first_result','high','1차 면접 결과 입력 필요',`결과 미입력 ${firstResult.length}명 · 합격/불합격 판정 후 일괄 확정`,'결과 입력','confirmStageDecisions',`confirmStageDecisions(${positionId},1)`);

  if(!short) {
    const refReady = list.filter(c => c.stage === 2 && c.ref === '미시작');
    if(refReady.length) add('reference_request','medium',hasHeadhunting?'레퍼런스 체크 업체 요청 필요':'레퍼런스 체크 요청 필요',`요청 대기 ${refReady.length}명${hasHeadhunting?' · 업체 경유 대상 포함':''}`,'레퍼런스 요청','scrollPositionDetail',`scrollPositionDetail('pp-position-candidates')`);
    const refResend = list.filter(c => c.stage === 2 && c.ref === '진행중' && Number(c.refD||0) === 0 && ensureRefDetails(c).length === 0);
    if(refResend.length) add('reference_resend','medium','레퍼런스 재요청 필요',`추천인 미접수 ${refResend.length}명 · ${hasHeadhunting?'업체 경유로':'지원자에게'} 등록 안내를 다시 발송하세요.`,'레퍼런스 재요청','requestPositionReferences',`requestPositionReferences(${positionId})`);
    const refLate = list.filter(c => c.ref === '진행중' && Number(c.refD||0) === 0 && ensureRefDetails(c).length > 0);
    if(refLate.length) add('reference_remind','high','레퍼런스 미응답 독촉 필요',`응답 없음 ${refLate.length}명`,'리마인드','remindRef',`remindRef(${refLate[0].id})`);
    const refIncomplete = list.filter(c => c.stage === 2 && c.ref !== '완료');
    if(refIncomplete.length && !refReady.length && !refResend.length && !refLate.length) add('reference_complete','medium','레퍼런스 완료 확인 필요',`진행중 ${refIncomplete.length}명 · 응답 수집 후 완료 처리`,'레퍼런스 보기','scrollPositionDetail',`scrollPositionDetail('pp-position-candidates')`);

    const secondReady = list.some(c => c.stage === 2 && c.ref === '완료');
    if(secondReady && !pos.panel2AvailabilityConfirmedAt) add('second_panel_availability','high',pos.panel2AvailabilityRequestedAt?'2차 면접관 가능 일정 회신 확인 필요':'2차 면접관 가능 일정 확인 필요',pos.panel2AvailabilityRequestedAt?'면접관 회신을 확인한 뒤 지원자 가능일 확인을 진행하세요.':'면접관에게 공통 후보 날짜의 참석 가능 여부를 먼저 확인하세요.','면접관 일정 확인','openCollectSlots',`openCollectSlots(${positionId},3)`);
    if(secondReady && pos.panel2AvailabilityConfirmedAt && !r2.interviews.length) add('second_slots','medium',`2차 지원자 가능일 ${routeNoticeText} 필요`,`레퍼런스 완료 후보자에게 면접관 확인이 완료된 일정을 ${hasHeadhunting?'업체 경유로 ':''}안내하세요.`,'지원자 가능일 확인','openCollectSlots',`openCollectSlots(${positionId},3)`);
    const secondResponded = r2.interviews.filter(i => ['RESPONDED','UNAVAILABLE'].includes(i.availabilityStatus));
    const secondWaiting = r2.interviews.filter(i => i.availabilityStatus === 'SENT');
    if(secondResponded.length && !secondWaiting.length) add('second_schedule','high','2차 면접시간·순서 확정 필요',`가능 시간대 응답 ${secondResponded.length}건 취합 완료`,'일정 확정','openPositionRoundSchedule',`openPositionRoundSchedule(${positionId},3)`);
    else if(secondWaiting.length) add('second_schedule_wait','medium','2차 가능 시간대 응답 대기',`응답완료 ${secondResponded.length}명 · 대기 ${secondWaiting.length}명`,'응답 현황','openCollectSlots',`openCollectSlots(${positionId},3)`);
    else if(r2.pending.length) add('second_schedule','high','2차 공동일정 확정 필요',`미확정 ${r2.pending.length}건`,'일정 확정','openPositionRoundSchedule',`openPositionRoundSchedule(${positionId},3)`);
    if(r2.confirmed.length && r2.panelNotified.length < r2.confirmed.length) add('second_panel_notice','medium','2차 면접관 안내 미발송','확정된 2차 공동일정을 면접관에게 안내','면접관 안내','sendPanelNotice',`sendPanelNotice(${positionId},2)`);
    if(r2.confirmed.length && r2.candidateNotified.length < r2.confirmed.length) add('second_candidate_notice','medium',`2차 면접 ${routeNoticeText} 미발송`,`확정된 2차 면접일정을 ${hasHeadhunting?'업체 경유로':'지원자에게'} 안내`,'안내 발송','sendAllCandSchedule',`sendAllCandSchedule(${positionId},3)`);
    const secondResult = list.filter(c => c.stage === 3 && !c.decision);
    if(r2.done.length && secondResult.length) add('second_result','high','2차 면접 결과 입력 필요',`결과 미입력 ${secondResult.length}명`,'결과 입력','confirmStageDecisions',`confirmStageDecisions(${positionId},3)`);
  }

  const offerStage = list.filter(c => c.stage === 4);
  if(offerStage.length) add('offer_negotiation','medium',hasHeadhunting?'처우협의 업체 확인 필요':'처우협의 결과 입력 필요',`${offerStage.length}명 · ${hasHeadhunting?'업체를 통한 협의 결과를 ':'협의 결과를 '}최종합격/불합격/협의중으로 입력하세요.`,'결과 입력','openPositionResultModal',`openPositionResultModal(${positionId},4)`);

  if(projectStatus === 'active' || projectStatus === 'partial') {
    if(final.length >= target) add('fill_complete','high','최종합격자 있음 → 충원완료 처리 필요',`최종합격 ${final.length}명 / 목표 ${target}명 · 포지션을 충원완료로 마감하세요.`,'충원완료 처리','closePosition',`closeModal('modal-pos-detail');closePosition(${positionId})`);
    else if(final.length && remain > 0) add('partial_fill','low','부분충원 상태',`최종합격 ${final.length}명 · 잔여 seat ${remain}명`,'지원자 추가','addCandToPos',`addCandToPos(${positionId})`);
  }
  if((projectStatus === 'nohire' || projectStatus === 'stopped') && list.some(c => Number(c.stage) < 5 && !c.held)) add('residual_candidates','high','종료 포지션 잔여 지원자 정리 필요','진행 상태로 남아 있는 지원자를 확인·정리하세요.','지원자 확인','scrollPositionDetail',`scrollPositionDetail('pp-position-candidates')`);

  const pri = { high:0, medium:1, low:2 };
  return items.sort((a,b) => pri[a.priority] - pri[b.priority]);
}

function getPositionProcessStatus(positionId) {
  const d = getPositionProjectData(positionId);
  if(!d) return [];
  const { pos, list, final } = d;
  const short = isShortProcessEtype(pos.etype);
  const r1 = positionRoundData(positionId, 1);
  const r2 = positionRoundData(positionId, 3);
  const refCands = list.filter(c => c.stage >= 2 && c.stage !== 6);
  const flow = getPositionFlow(pos);
  const activeOrPassed = list.filter(c => c.stage !== 6);
  const allPast = stage => activeOrPassed.length > 0 && activeOrPassed.every(c =>
    flowIndex(c.stage, flow) > flowIndex(stage, flow) || (c.stage !== 0 && Number(c.lastCompletedStage) >= Number(stage))
  );
  const pastInt1 = allPast(1);
  const pastInt2 = !short && allPast(3);
  const checks = [
    { key:'register', title:'지원자 등록', done:list.length > 0, skip:false },
    { key:'int1_panel', title:'1차 면접관 일정 확인', done:!!pos.panel1AvailabilityConfirmedAt || pastInt1, skip:false },
    { key:'int1_slots', title:'1차 지원자 가능일 확인', done:r1.interviews.length > 0 || pastInt1, skip:false },
    { key:'int1_notice', title:'1차 면접안내', done:r1.confirmed.length > 0 || pastInt1, skip:false },
    { key:'int1_result', title:'1차 면접결과', done:pastInt1, skip:false },
    { key:'ref_req', title:'레퍼런스 체크 요청', done:refCands.some(c => c.ref !== '미시작'), skip:short },
    { key:'ref_done', title:'레퍼런스 완료', done:refCands.some(c => c.ref === '완료') || list.some(c => c.stage >= 3 && c.stage !== 6), skip:short },
    { key:'int2_panel', title:'2차 면접관 일정 확인', done:!!pos.panel2AvailabilityConfirmedAt || pastInt2, skip:short },
    { key:'int2_slots', title:'2차 지원자 가능일 확인', done:r2.interviews.length > 0 || pastInt2, skip:short },
    { key:'int2_notice', title:'2차 면접안내', done:r2.confirmed.length > 0 || pastInt2, skip:short },
    { key:'int2_result', title:'2차 면접결과', done:pastInt2, skip:short },
    { key:'offer', title:'처우협의', done:list.some(c => c.stage >= 4 && c.stage !== 6), skip:false },
    { key:'final', title:'최종합격', done:final.length > 0 && !list.some(c => c.stage === 4), skip:false },
    { key:'onboard', title:'입사안내', done:final.some(c => c.notified) || final.some(c => onboardings.some(o => Number(o.candId) === Number(c.id))), skip:false },
  ];
  const actions = getPositionActionItems(positionId);
  const actionKeys = new Set(actions.map(a => a.type));
  const keyMap = {
    candidate_register:'register',
    first_panel_availability:'int1_panel', first_slots:'int1_slots', first_schedule:'int1_notice', first_schedule_reply:'int1_notice',
    first_panel_notice:'int1_notice', first_candidate_notice:'int1_notice',
    first_interview_done:'int1_result', first_result:'int1_result',
    reference_request:'ref_req', reference_resend:'ref_req', reference_remind:'ref_done', reference_complete:'ref_done',
    second_panel_availability:'int2_panel', second_slots:'int2_slots', second_schedule:'int2_notice',
    second_panel_notice:'int2_notice', second_candidate_notice:'int2_notice',
    second_result:'int2_result', offer_negotiation:'offer', fill_complete:'final'
  };
  let firstOpen = -1;
  checks.forEach((x, i) => {
    if(x.skip) return;
    if(!x.done && firstOpen < 0) firstOpen = i;
  });
  return checks.map((x, i) => {
    if(x.skip) return { number:i + 1, title:x.title, status:'skipped', label:'생략', key:x.key };
    let status = x.done ? 'complete' : (i === firstOpen ? 'current' : 'upcoming');
    const mapped = Object.entries(keyMap).find(([t,k]) => k === x.key && actionKeys.has(t));
    if(status === 'current' && mapped && actions.find(a => a.type === mapped[0] && a.priority === 'high')) status = 'delayed';
    else if(!x.done && actions.some(a => keyMap[a.type] === x.key && a.priority === 'high')) status = 'delayed';
    const action = actions.find(a => keyMap[a.type] === x.key);
    return {
      number:i + 1, title:x.title, status,
      label:status === 'complete' ? '완료' : status === 'current' ? '현재 단계' : status === 'delayed' ? '처리 필요' : '예정',
      key:x.key,
      actionLabel:action ? action.actionLabel : '',
      actionCall:action ? action.actionCall : ''
    };
  });
}

function renderPositionSummary(positionId) {
  const d = getPositionProjectData(positionId);
  if(!d) return '';
  const { pos, target, final, remain, rate, projectStatus, statusLabel, list, active, rejected } = d;
  const owner = pos.owner || pos.manager || '미지정';
  const requested = pos.requestDate || pos.createdAt || '';
  const targetDate = pos.targetDate || pos.dueDate || '미지정';
  const short = isShortProcessEtype(pos.etype);
  return `<section class="pp-section">
    <div class="pp-summary-top">
      <div class="pp-meta" style="margin-top:0"><span>${esc(pos.dept||'부서 미지정')}</span><span>${esc(pos.loc||'근무지 미지정')}</span><span class="etype ${ETYPE_CLS[pos.etype]||''}">${esc(pos.etype||'-')}</span><span>채용사유 ${esc(pos.hireReason||'충원')}</span><span>${esc(pos.role||'-')}</span><span>담당자 ${esc(owner)}</span><span>요청/생성일 ${fmtDate(requested)||'-'}</span><span>목표 충원일 ${fmtDate(targetDate)||esc(targetDate)}</span>${short?'<span style="color:var(--acc);font-weight:650">1차면접 프로세스</span>':''}</div>
      <div style="text-align:right"><span class="pp-status ${projectStatus}">${statusLabel}</span></div>
    </div>
    <div class="pp-kpis">
      <div class="pp-kpi"><div class="pp-kpi-val">${target}<small>명</small></div><div class="pp-kpi-lbl">채용목표</div></div>
      <div class="pp-kpi"><div class="pp-kpi-val" style="color:var(--green)">${final.length}<small>명</small></div><div class="pp-kpi-lbl">최종합격 (충원 seat)</div></div>
      <div class="pp-kpi"><div class="pp-kpi-val" style="color:${remain?'var(--amber)':'var(--green)'}">${remain}<small>명</small></div><div class="pp-kpi-lbl">미충원 seat</div></div>
      <div class="pp-kpi"><div class="pp-kpi-val">${rate}<small>%</small></div><div class="pp-kpi-lbl">충원율</div></div>
      <div class="pp-kpi"><div class="pp-kpi-val">${active.length}<small>명</small></div><div class="pp-kpi-lbl">진행중 지원자</div></div>
      <div class="pp-kpi"><div class="pp-kpi-val">${rejected.length}<small>명</small></div><div class="pp-kpi-lbl">불합격/종료</div></div>
    </div>
    <div class="pp-fillbar"><span style="width:${rate}%"></span></div>
  </section>`;
}

function renderPositionProcessChecklist(positionId) {
  const d = getPositionProjectData(positionId);
  const steps = getPositionProcessStatus(positionId);
  const byKey = key => steps.find(s => s.key === key);
  const mergeTask = (title, keys, actionKey) => {
    const items = keys.map(byKey).filter(Boolean);
    const status = items.every(x=>x.status==='skipped') ? 'skipped'
      : items.every(x=>x.status==='complete'||x.status==='skipped') ? 'complete'
      : items.some(x=>x.status==='delayed') ? 'delayed'
      : items.some(x=>x.status==='current') ? 'current' : 'upcoming';
    return { title, actionKey, status, label:status==='complete'?'완료':status==='current'?'진행중':status==='delayed'?'지연':status==='skipped'?'생략':'예정' };
  };
  const refResendNeeded = d && d.list.some(c => c.stage===2 && c.ref==='진행중' && Number(c.refD||0)===0 && ensureRefDetails(c).length===0);
  const refRequestTitle = refResendNeeded ? '레퍼런스 재요청' : '레퍼런스 요청';
  const groups = [
    { title:'준비', stage:0, tasks:[mergeTask('지원자 등록',['register'],'candidate_register')] },
    { title:'1차 면접', stage:1, tasks:[mergeTask('면접관 일정 확인',['int1_panel'],'int1_panel'),mergeTask('지원자 가능일 확인',['int1_slots'],'int1_slots'),mergeTask('면접안내',['int1_notice'],'int1_notice'),mergeTask('면접결과',['int1_result'],'int1_result')] },
    { title:'레퍼런스', stage:2, tasks:[mergeTask(refRequestTitle,['ref_req'],'ref_request'),mergeTask('레퍼런스 완료',['ref_done'],'ref_complete')] },
    { title:'2차 면접', stage:3, tasks:[mergeTask('면접관 일정 확인',['int2_panel'],'int2_panel'),mergeTask('지원자 가능일 확인',['int2_slots'],'int2_slots'),mergeTask('면접안내',['int2_notice'],'int2_notice'),mergeTask('면접결과',['int2_result'],'int2_result')] },
    { title:'처우협의', stage:4, tasks:[mergeTask('처우협의 및 결과 판단',['offer','final'],'offer_decision'),mergeTask('입사안내',['onboard'],'onboard')] },
  ];
  const flow = d ? getPositionFlow(d.pos) : FLOW;
  const candidateFlowIndexes = d ? d.list
    .filter(c => Number(c.stage) !== 6 && !c.held)
    .map(c => flowIndex(Number(c.stage), flow))
    .filter(idx => idx >= 0) : [];
  const alignGroupStatusWithCandidates = (groupStatus, groupStage) => {
    const targetIndex = flow.indexOf(groupStage);
    if(targetIndex < 0 || !candidateFlowIndexes.length) return groupStatus;
    if(candidateFlowIndexes.every(idx => idx > targetIndex)) return 'complete';
    if(candidateFlowIndexes.some(idx => idx === targetIndex)) return groupStatus === 'delayed' ? 'delayed' : 'current';
    if(candidateFlowIndexes.some(idx => idx > targetIndex)) return groupStatus === 'delayed' ? 'delayed' : 'active';
    return groupStatus;
  };
  const shortNote = d && isShortProcessEtype(d.pos.etype)
    ? `<div class="pp-process-note">${esc(d.pos.etype)} 채용은 1차 면접까지만 진행합니다. 레퍼런스·2차 면접 항목은 생략됩니다.</div>`
    : '';
  return `<section class="pp-section" id="pp-position-process"><div class="pp-section-h"><div><div class="pp-section-title">프로세스 진행현황</div></div></div>
    ${shortNote}
    <div class="pp-process-groups">${groups.map(g=>{
      const tasks = g.tasks;
      const activeTasks = tasks.filter(s=>s.status!=='skipped');
      const taskGroupStatus = !activeTasks.length ? 'skipped'
        : activeTasks.every(s=>s.status==='complete') ? 'complete'
        : activeTasks.some(s=>s.status==='delayed') ? 'delayed'
        : activeTasks.some(s=>s.status==='current') ? 'current'
        : activeTasks.some(s=>s.status==='complete') ? 'active' : 'upcoming';
      const groupStatus = alignGroupStatusWithCandidates(taskGroupStatus, g.stage);
      const groupStatusLabel = groupStatus==='complete'?'완료':groupStatus==='current'?'현재 진행':groupStatus==='delayed'?'처리 필요':groupStatus==='active'?'진행 보유':groupStatus==='skipped'?'생략':'예정';
      const targetIndex = flow.indexOf(g.stage);
      const fromStage = targetIndex > 0 ? flow[targetIndex-1] : -1;
      const moveCount = fromStage >= 0 ? d.list.filter(c=>c.stage===fromStage).length : 0;
      const moveButton = g.stage > 0 && groupStatus!=='skipped' && moveCount ? `<button class="btn btn-xs pp-group-move" title="${moveCount}명을 ${g.title} 단계로 이동" data-action="call" data-call="event.stopPropagation();changePositionProcessStage(${positionId},${g.stage})">다음</button>` : '';
      return `<div class="pp-process-group ${groupStatus}"><div class="pp-group-head" data-action="call" data-call="togglePositionProcessGroup(this)" title="클릭하여 세부 업무 보기"><span class="pp-group-status"></span><span class="pp-group-title">${g.title}</span><span class="pp-group-count">${groupStatusLabel}</span>${moveButton}</div>
        <div class="pp-group-tasks">${tasks.map(s=>`<div class="pp-task ${s.status}${s.status!=='skipped'?' actionable':''}" ${s.status!=='skipped'?`data-action="call" data-call="executePositionProcessTask(${positionId},'${s.actionKey}')"`:''}><span class="pp-task-dot"></span><span class="pp-task-title">${esc(s.title)}</span><span class="pp-task-state">${s.label}</span></div>`).join('')}</div>
      </div>`;
    }).join('')}</div>
  </section>`;
}

function togglePositionProcessGroup(button) {
  const group = button && button.closest('.pp-process-group');
  if(group) group.classList.toggle('open');
}

function getPositionStageMoveBlockers(positionId, fromStage, toStage) {
  const targets = candidates.filter(c =>
    Number(c.posId) === Number(positionId) &&
    Number(c.stage) === Number(fromStage) &&
    !c.held
  );
  const blockers = [];
  const add = (label, list) => {
    if(!list.length) return;
    blockers.push({
      label,
      count:list.length,
      names:list.map(c=>c.name || `지원자 ${c.id}`)
    });
  };

  if(fromStage === 1 || fromStage === 3) {
    const round = fromStage === 1 ? '1차' : '2차';
    const interviewFor = c => interviews.find(i =>
      Number(i.candId) === Number(c.id) && i.type === round
    );
    add('일정 미확정', targets.filter(c => !hasConfirmedRoundSchedule(c.id, fromStage)));
    add('지원자 안내 미완료', targets.filter(c => !interviewFor(c)?.candidateNotified));
    add('면접관 안내 미완료', targets.filter(c => !interviewFor(c)?.panelNotified));
    add('결과 미입력', targets.filter(c => {
      const itv = interviewFor(c);
      return !c.decision && !itv?.result;
    }));
    add('불합격 판정 포함', targets.filter(c => {
      const result = c.decision || interviewFor(c)?.result || '';
      return result === 'fail' || result === '불합격';
    }));
  }

  if(fromStage === 2) {
    add('레퍼런스 미완료', targets.filter(c => {
      const required = Number(c.refT) || 0;
      const responded = Number(c.refD) || 0;
      return c.ref !== '완료' || required <= 0 || responded < required;
    }));
  }

  if(fromStage === 4 && toStage === 5) {
    add('처우협의 결과 미입력', targets.filter(c => c.decision !== 'pass'));
  }

  return { ok:blockers.length === 0, targets, blockers };
}

function buildPositionStageMoveBlockedMessage(fromStage, toStage, check) {
  const total = check.targets.length;
  const lines = check.blockers.map(item => {
    const completed = Math.max(0, total - item.count);
    const names = item.names.slice(0, 5).join(', ');
    const more = item.names.length > 5 ? ` 외 ${item.names.length - 5}명` : '';
    return `• ${item.label}: 완료 ${completed}/${total}명 · 미완료 ${names}${more}`;
  });
  return `${stageLabel(fromStage)} 단계의 필수 업무가 모두 완료되지 않아 ${stageLabel(toStage)} 단계로 이동할 수 없습니다.\n\n${lines.join('\n')}\n\n미완료 업무를 처리한 후 다시 시도하세요.`;
}

async function changePositionProcessStage(positionId, toStage) {
  const pos = positions.find(p => Number(p.id) === Number(positionId));
  if(!pos) return;
  const flow = getPositionFlow(pos);
  const targetIndex = flow.indexOf(Number(toStage));
  if(targetIndex <= 0) return;
  const fromStage = flow[targetIndex - 1];
  const targets = candidates.filter(c => Number(c.posId) === Number(positionId) && c.stage === fromStage);
  if(!targets.length) {
    toast(`${stageLabel(fromStage)} 단계에 이동할 지원자가 없습니다.`, 'terr');
    return;
  }
  const completionCheck = getPositionStageMoveBlockers(positionId, fromStage, Number(toStage));
  if(!completionCheck.ok) {
    const message = buildPositionStageMoveBlockedMessage(fromStage, Number(toStage), completionCheck);
    alert(message);
    toast(`${stageLabel(fromStage)} 필수 업무 미완료로 단계 이동이 차단되었습니다.`, 'terr');
    return;
  }
  await batchStageChange(positionId, fromStage, Number(toStage));
  refreshOpenPositionDetail(positionId);
}

async function executePositionProcessTask(positionId, actionKey) {
  const d = getPositionProjectData(positionId);
  if(!d) return;
  const round = actionKey.startsWith('int1') ? 1 : actionKey.startsWith('int2') ? 2 : 0;
  const stageIdx = round === 1 ? 1 : round === 2 ? 3 : -1;
  if(actionKey === 'candidate_register') return addCandToPos(positionId);
  if(actionKey === 'int1_panel' || actionKey === 'int2_panel' || actionKey === 'int1_slots' || actionKey === 'int2_slots') return openCollectSlots(positionId, stageIdx);
  if(actionKey === 'int1_confirm' || actionKey === 'int2_confirm') return openPositionRoundSchedule(positionId, stageIdx);
  if(actionKey === 'int1_notice' || actionKey === 'int2_notice') {
    const roundData = positionRoundData(positionId, stageIdx);
    if(!roundData.confirmed.length) return openPositionRoundSchedule(positionId, stageIdx);
    return openInterviewNoticeFlow(positionId, stageIdx, round);
  }
  if(actionKey === 'int1_done' || actionKey === 'int2_done') return completePositionInterviews(positionId, stageIdx);
  if(actionKey === 'int1_result' || actionKey === 'int2_result') return openPositionResultModal(positionId, stageIdx);
  if(actionKey === 'ref_request') return requestPositionReferences(positionId);
  if(actionKey === 'ref_complete') return completePositionReferences(positionId);
  if(actionKey === 'offer') return changePositionProcessStage(positionId, 4);
  if(actionKey === 'offer_decision') {
    if(d.list.some(c=>c.stage===4)) return openPositionResultModal(positionId,4);
    const flow=getPositionFlow(d.pos);
    const offerIndex=flow.indexOf(4);
    const previousStage=offerIndex>0?flow[offerIndex-1]:-1;
    if(previousStage>=0 && d.list.some(c=>c.stage===previousStage)) return changePositionProcessStage(positionId,4);
    return toast('처우협의 결과가 이미 확정되었거나 이동할 대상자가 없습니다.','tok');
  }
  if(actionKey === 'final') return openPositionResultModal(positionId, 4);
  if(actionKey === 'onboard') return openOnboardingFromPosition(positionId);
}

let positionResultCtx = { positionId:null, stageIdx:null };

function openPositionResultModal(positionId, stageIdx) {
  const pos = positions.find(p=>Number(p.id)===Number(positionId));
  const list = candidates.filter(c=>Number(c.posId)===Number(positionId)&&c.stage===Number(stageIdx));
  if(!pos || !list.length) { toast(stageIdx===4?'결과를 입력할 처우협의 대상자가 없습니다.':'결과를 입력할 면접 대상자가 없습니다.', 'terr'); return; }
  positionResultCtx = { positionId:Number(positionId), stageIdx:Number(stageIdx) };
  const isFinal = Number(stageIdx) === 4;
  document.getElementById('pr-title').textContent = `${isFinal?'처우협의 결과 입력':stageLabel(stageIdx)+' 결과 입력'} — ${pos.title} (${list.length}명)`;
  const help=document.getElementById('pr-help');
  if(help) help.textContent=isFinal
    ? '지원자별 처우협의 결과를 선택하세요. 최종합격자는 충원 seat에 반영된 후 입사 안내 화면으로 이어지고, 불합격자는 전형 종료되며, 협의중인 지원자는 처우협의 단계에 남습니다.'
    : '지원자별 판정을 선택하세요. 저장만 하거나, 판정 확정 후 다음 단계로 이동할 수 있습니다.';
  const saveBtn=document.getElementById('pr-save-btn');
  const confirmBtn=document.getElementById('pr-confirm-btn');
  if(saveBtn) saveBtn.textContent=isFinal?'협의 결과 임시 저장':'판정 저장';
  if(confirmBtn) confirmBtn.textContent=isFinal?'처우협의 결과 확정':'판정 확정 및 단계 이동';
  document.getElementById('pr-list').innerHTML = list.map(c=>`
    <div style="display:grid;grid-template-columns:minmax(150px,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-size:12.5px;font-weight:700">${esc(c.name)}${headhunterSearchPill(c)}</div>
        <div style="font-size:10.5px;color:var(--t3)">${esc(c.email||'-')}</div>
        ${isFinal?`<label style="display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11px;color:var(--t2);font-weight:700">입사예정일 <input class="pr-join-date" data-cand-id="${c.id}" type="date" value="${esc(getCandidateJoinDate(c))}" style="height:28px;width:132px;border:1px solid var(--border2);border-radius:6px;padding:0 7px;font-size:11px"></label>`:''}
      </div>
      <div style="display:flex;gap:5px">
        <label class="btn btn-sm ${c.decision==='pass'?'btn-green':''}" style="cursor:pointer"><input type="radio" name="pr-${c.id}" value="pass" ${c.decision==='pass'?'checked':''} style="display:none" data-onchange="selectPositionResult(this)">${isFinal?'최종합격':'합격'}</label>
        <label class="btn btn-sm ${c.decision==='fail'?'btn-red':''}" style="cursor:pointer"><input type="radio" name="pr-${c.id}" value="fail" ${c.decision==='fail'?'checked':''} style="display:none" data-onchange="selectPositionResult(this)">불합격</label>
        <label class="btn btn-sm ${!c.decision?'btn-primary':''}" style="cursor:pointer"><input type="radio" name="pr-${c.id}" value="" ${!c.decision?'checked':''} style="display:none" data-onchange="selectPositionResult(this)">${isFinal?'협의중':'미정'}</label>
      </div>
    </div>`).join('');
  openModal('modal-position-result');
}

function selectPositionResult(input) {
  document.querySelectorAll(`input[name="${input.name}"]`).forEach(r=>{
    const label = r.closest('label');
    if(!label) return;
    label.classList.remove('btn-green','btn-red','btn-primary');
    if(r.checked) label.classList.add(r.value==='pass'?'btn-green':r.value==='fail'?'btn-red':'btn-primary');
  });
}

async function savePositionResults(confirmAndMove) {
  const { positionId, stageIdx } = positionResultCtx;
  const list = candidates.filter(c=>Number(c.posId)===Number(positionId)&&c.stage===Number(stageIdx));
  list.forEach(c=>{
    const selected = document.querySelector(`input[name="pr-${c.id}"]:checked`);
    c.decision = selected ? selected.value : '';
    if(Number(stageIdx) === 4 && c.decision === 'pass') {
      const joinInput = document.querySelector(`.pr-join-date[data-cand-id="${c.id}"]`);
      c.joinDate = joinInput ? joinInput.value || '' : c.joinDate || '';
    }
  });
  if(confirmAndMove) {
    closeModal('modal-position-result');
    return confirmStageDecisions(positionId, stageIdx, {skipConfirm:true});
  }
  saveState();
  if(GS_CONFIG.scriptUrl) await settleSync(list.map(c=>syncCandToGS(c)), stageIdx===4?'처우협의 결과 저장 동기화':'면접 결과 저장 동기화');
  closeModal('modal-position-result');
  refreshOpenPositionDetail(positionId);
  toast(`${stageIdx===4?'처우협의 결과':stageLabel(stageIdx)+' 판정'} 저장 완료`, 'tok');
}

async function completePositionInterviews(positionId, stageIdx) {
  const round = stageIdx === 1 ? '1차' : '2차';
  const ids = new Set(candidates.filter(c=>Number(c.posId)===Number(positionId)&&c.stage===stageIdx).map(c=>Number(c.id)));
  const targets = interviews.filter(i=>ids.has(Number(i.candId))&&i.type===round&&i.status==='confirmed');
  if(!targets.length) { toast('완료 처리할 확정 면접이 없습니다.', 'terr'); return; }
  if(!confirm(`${round} 면접 ${targets.length}건을 완료 처리하시겠습니까?`)) return;
  targets.forEach(i=>{ i.status='done'; });
  saveState();
  if(GS_CONFIG.scriptUrl) await settleSync(targets.map(i=>syncIntToGS(i)), `${round} 면접 완료 동기화`);
  refreshOpenPositionDetail(positionId); renderDashboard();
  toast(`${round} 면접 ${targets.length}건 완료 처리`, 'tok');
}

function requestPositionReferences(positionId) {
  const targets = candidates.filter(c =>
    Number(c.posId) === Number(positionId) &&
    c.stage === 2 &&
    (c.ref === '미시작' || (c.ref === '진행중' && Number(c.refD || 0) === 0))
  );
  if(!targets.length) { toast('레퍼런스 요청 대상자가 없습니다.', 'terr'); return; }
  const resendCount = targets.filter(c => c.ref === '진행중').length;
  if(!confirm(`${targets.length}명에게 레퍼런스 체크 안내를 ${resendCount ? `발송합니다.\n이 중 재요청 ${resendCount}명은 기존 진행 상태를 유지합니다.` : '진행하시겠습니까?'}`)) return;
  targets.forEach((c,i)=>setTimeout(()=>startRef(c.id, c.ref === '진행중'),i*600));
  setTimeout(()=>refreshOpenPositionDetail(positionId),targets.length*600+200);
}

async function completePositionReferences(positionId) {
  const targets = candidates.filter(c=>Number(c.posId)===Number(positionId)&&c.stage===2&&c.ref==='진행중');
  if(!targets.length) { toast('완료 처리할 레퍼런스 진행 건이 없습니다.', 'terr'); return; }
  const eligible = targets.filter(c => ensureRefDetails(c).length > 0);
  if(!eligible.length) { toast('실제 접수된 추천인 정보가 없습니다. 구글시트 동기화를 먼저 실행하세요.', 'terr'); return; }
  if(!confirm(`${eligible.length}명의 레퍼런스를 완료 처리하시겠습니까?`)) return;
  eligible.forEach(c=>{ c.ref='완료'; c.refD=c.refT; refDetails[c.id].forEach(r=>r.status='응답'); });
  saveState();
  if(GS_CONFIG.scriptUrl) await settleSync(eligible.map(c=>syncCandToGS(c)), '레퍼런스 완료 동기화');
  refreshOpenPositionDetail(positionId); updateMetrics();
  toast(`${eligible.length}명 레퍼런스 완료 처리`, 'tok');
}

function renderPositionCandidates(positionId) {
  const d = getPositionProjectData(positionId);
  if(!d) return '';
  const short = isShortProcessEtype(d.pos.etype);
  const sorted = d.list.slice().sort((a,b)=>a.stage-b.stage||(a.name||'').localeCompare(b.name||'','ko'));
  const row = c => {
    const round = c.stage===1?'1차':c.stage===3?'2차':'';
    const itv = round ? interviews.find(i=>Number(i.candId)===Number(c.id)&&i.type===round) : null;
    const intState = !round ? '-' : !itv ? '미등록' : itv.status==='done'?'면접완료':itv.status==='confirmed'?'일정확정':'회신대기';
    const notice = itv ? (itv.candNotified?'지원자 발송완료':'미발송') : (c.notified?'발송':'-');
    const refCell = short ? '<div class="pp-cand-cell pp-secondary"><strong>레퍼런스</strong>해당없음</div>' : `<div class="pp-cand-cell pp-secondary"><strong>레퍼런스</strong>${esc(c.ref||'미시작')}${c.refT?` ${c.refD||0}/${c.refT}`:''}</div>`;
    const dec = c.decision ? (c.decision==='pass'?' · 합격표시':' · 불합격표시') : '';
    return `<div class="pp-cand">
      <div><div class="pp-cand-name">${esc(c.name)}${headhunterSearchPill(c)}</div><div class="pp-cand-email">${esc(c.email||'-')}</div></div>
      <div class="pp-cand-cell"><strong>현재 단계</strong>${stageLabel(c.stage)}${dec}${Number(c.stage)===5?` · ${esc(getCandidateJoinDateLabel(c))}`:''}</div>
      <div class="pp-cand-cell"><strong>면접일정</strong>${intState}${itv&&itv.date?` · ${fmtItv(itv.date)}`:''}</div>
      ${refCell}
      <div class="pp-cand-cell pp-secondary"><strong>안내 발송</strong>${notice}</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap"><button class="btn btn-xs" data-action="open-candidate" data-id="${c.id}" data-close="modal-pos-detail">개별 처리</button><button class="btn btn-xs" data-action="edit-candidate" data-id="${c.id}" data-close="modal-pos-detail">수정</button></div>
    </div>`;
  };
  return `<section class="pp-section" id="pp-position-candidates"><div class="pp-section-h"><div><div class="pp-section-title">지원자 현황</div><div class="pp-section-sub">개별 지원자 상태 확인 및 예외 처리</div></div><button class="btn btn-sm btn-primary" data-action="call" data-call="addCandToPos(${positionId})">+ 지원자 추가</button></div>
    <div class="pp-cand-list">${sorted.length?sorted.map(row).join(''):'<div class="empty">이 포지션에 연결된 지원자가 없습니다. 지원자를 추가해 채용 프로세스를 시작하세요.</div>'}</div>
  </section>`;
}
